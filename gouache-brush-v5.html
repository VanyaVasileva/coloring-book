<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Gouache Brush v5</title>
<style>
:root{--bg:#f5f2eb;--ink:#292721;--line:#d4cdc1}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overscroll-behavior:none}body{display:grid;grid-template-rows:auto 1fr}header{background:#fff;border-bottom:1px solid var(--line);padding:9px 12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}h1{font:500 17px Georgia,serif;margin:0 8px 0 0}.ctrl{display:flex;align-items:center;gap:6px;font-size:12px}.ctrl input[type=range]{width:108px}input[type=color]{width:40px;height:34px;padding:2px;border:1px solid var(--line);border-radius:8px;background:#fff}button{border:1px solid #cfc7bb;background:#fff;border-radius:9px;padding:9px 10px;color:var(--ink);font-size:12px;font-weight:700}.stage{min-height:0;padding:8px}.canvas-wrap{height:100%;background:#fff;box-shadow:0 4px 20px #0001;overflow:hidden;touch-action:none;position:relative}.layer{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}.paint{z-index:1;background:#fff}.live{z-index:2;background:transparent;cursor:crosshair}@media(max-width:760px){header{gap:7px}.ctrl input[type=range]{width:82px}.stage{padding:6px}}
</style>
</head>
<body>
<header>
<h1>Gouache Brush v5</h1>
<div class="ctrl"><span>Color</span><input id="color" type="color" value="#987459"></div>
<div class="ctrl"><span>Size</span><input id="size" type="range" min="7" max="150" value="60"><strong id="sizeVal">60</strong></div>
<div class="ctrl"><span>Paint</span><input id="opacity" type="range" min="45" max="100" value="100"><strong id="opacityVal">100%</strong></div>
<div class="ctrl"><span>Texture</span><input id="texture" type="range" min="0" max="100" value="68"><strong id="textureVal">68%</strong></div>
<button id="undo">Undo</button><button id="clear">Clear</button>
</header>
<div class="stage"><div class="canvas-wrap" id="wrap"><canvas id="paint" class="layer paint"></canvas><canvas id="live" class="layer live"></canvas></div></div>
<script>(()=>{'use strict';
const $=id=>document.getElementById(id),paint=$('paint'),live=$('live'),wrap=$('wrap');
const ctx=paint.getContext('2d',{alpha:false,desynchronized:true}),lctx=live.getContext('2d',{alpha:true,desynchronized:true});
const size=$('size'),opacity=$('opacity'),texture=$('texture'),color=$('color');
let dpr=1,drawing=false,stroke=null,history=[];
const mask=document.createElement('canvas'),tex=document.createElement('canvas'),dry=document.createElement('canvas');
let mctx=mask.getContext('2d',{alpha:true}),tctx=tex.getContext('2d',{alpha:true}),dctx=dry.getContext('2d',{alpha:true});
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function setupCanvas(c,transparent=true){const r=wrap.getBoundingClientRect();c.width=Math.max(1,Math.floor(r.width*dpr));c.height=Math.max(1,Math.floor(r.height*dpr));const x=c.getContext('2d');x.setTransform(dpr,0,0,dpr,0,0);if(!transparent){x.fillStyle='#fff';x.fillRect(0,0,r.width,r.height)}}
function resize(){const old=document.createElement('canvas');old.width=paint.width;old.height=paint.height;if(old.width&&old.height)old.getContext('2d').drawImage(paint,0,0);dpr=Math.max(1,Math.min(2,devicePixelRatio||1));setupCanvas(paint,false);setupCanvas(live,true);setupCanvas(mask,true);setupCanvas(tex,true);setupCanvas(dry,true);mctx=mask.getContext('2d');tctx=tex.getContext('2d');dctx=dry.getContext('2d');mctx.setTransform(dpr,0,0,dpr,0,0);tctx.setTransform(dpr,0,0,dpr,0,0);dctx.setTransform(dpr,0,0,dpr,0,0);if(old.width&&old.height){ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.drawImage(old,0,0,old.width,old.height,0,0,paint.width,paint.height);ctx.restore()}}
function pos(e){const r=live.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top,pressure:e.pressure>0?e.pressure:.5,time:e.timeStamp||performance.now()}}
function snapshot(){const c=document.createElement('canvas');c.width=paint.width;c.height=paint.height;c.getContext('2d').drawImage(paint,0,0);return c}function save(){history.push(snapshot());if(history.length>10)history.shift()}
function rng(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}
function rgb(hex){return[parseInt(hex.slice(1,3),16),parseInt(hex.slice(3,5),16),parseInt(hex.slice(5,7),16)]}
function shade(hex,p){const [r,g,b]=rgb(hex),f=p<0?1+p:1-p;return p<0?`rgb(${Math.round(r*f)},${Math.round(g*f)},${Math.round(b*f)})`:`rgb(${Math.round(r+(255-r)*p)},${Math.round(g+(255-g)*p)},${Math.round(b+(255-b)*p)})`}
function clearLayer(x,c){x.save();x.setTransform(1,0,0,1,0,0);x.clearRect(0,0,c.width,c.height);x.restore()}
function makeTip(brush,seed){
 const rd=rng(seed),L=Math.max(18,Math.round(brush*1.08)),B=Math.max(16,Math.round(brush*.86)),pad=Math.ceil(brush*.18),c=document.createElement('canvas');c.width=L+pad*2;c.height=B+pad*2;const t=c.getContext('2d');t.translate(pad,pad);
 const n=()=> (rd()-.5)*brush*.025,corner=brush*.12,top=B*.07,bottom=B*.93,left=brush*.035,right=L-brush*.035;
 t.fillStyle='#fff';t.globalAlpha=1;t.beginPath();
 t.moveTo(left+corner+n(),top+n());
 t.lineTo(L*.46+n(),top+n());t.lineTo(right-corner+n(),top+n());
 t.quadraticCurveTo(right+n(),top+n(),right+n(),top+corner+n());
 t.lineTo(right+n(),bottom-corner+n());t.quadraticCurveTo(right+n(),bottom+n(),right-corner+n(),bottom+n());
 t.lineTo(L*.54+n(),bottom+n());t.lineTo(left+corner+n(),bottom+n());
 t.quadraticCurveTo(left+n(),bottom+n(),left+n(),bottom-corner+n());
 t.lineTo(left+n(),top+corner+n());t.quadraticCurveTo(left+n(),top+n(),left+corner+n(),top+n());t.closePath();t.fill();
 // Tiny perimeter nicks so the head stays flat but not digital-perfect.
 t.globalCompositeOperation='destination-out';
 for(let i=0;i<26;i++){const edge=rd(),x=L*(.035+rd()*.93),y=edge<.5?B*(.045+rd()*.055):B*(.90+rd()*.055);t.globalAlpha=.25+rd()*.35;t.beginPath();t.ellipse(x,y,brush*(.004+rd()*.012),brush*(.003+rd()*.008),0,0,Math.PI*2);t.fill()}
 // Bristle cuts at leading/trailing ends.
 for(let side=0;side<2;side++)for(let i=0;i<13;i++){const y=B*(.08+rd()*.84),x=side===0?left:left+(right-left),len=brush*(.025+rd()*.075);t.globalAlpha=.22+rd()*.38;t.lineWidth=Math.max(.45,brush*(.0045+rd()*.004));t.lineCap='round';t.beginPath();t.moveTo(x,y);t.lineTo(x+(side===0?len:-len),y+(rd()-.5)*brush*.016);t.stroke()}
 t.globalCompositeOperation='source-over';t.globalAlpha=1;return c;
}
function pf(p){return clamp(.97+(p?.pressure??.5)*.06,.975,1.035)}
function smooth(raw){if(!stroke.filtered){stroke.filtered={...raw};return{...raw}}const dx=raw.x-stroke.filtered.x,dy=raw.y-stroke.filtered.y,speed=Math.hypot(dx,dy),follow=clamp(.80+speed/420,.80,.93);stroke.filtered.x+=dx*follow;stroke.filtered.y+=dy*follow;stroke.filtered.pressure=raw.pressure;stroke.filtered.time=raw.time;return{...stroke.filtered}}
function angleDiff(a,b){let d=b-a;while(d>Math.PI)d-=Math.PI*2;while(d< -Math.PI)d+=Math.PI*2;return d}
function updateAngle(target){if(stroke.angle===null){stroke.angle=target;return}const d=angleDiff(stroke.angle,target);stroke.angle+=clamp(d,-.034,.034)*.24}
function hashNoise(i){return Math.sin(i*12.9898+stroke.seed*.00001)*43758.5453%1}
function stampMask(p,index){const tip=stroke.tips[index%stroke.tips.length],f=pf(p),j=(Math.sin((index+1)*2.17+stroke.seed*.001))*Number(size.value)*.010;const ca=Math.cos(stroke.angle??0),sa=Math.sin(stroke.angle??0),nx=-sa,ny=ca;mctx.save();mctx.translate(p.x+nx*j,p.y+ny*j);mctx.rotate(stroke.angle??0);mctx.scale(f*(.992+((index%3)-1)*.006),f);mctx.globalAlpha=1;mctx.globalCompositeOperation='source-over';mctx.drawImage(tip,-tip.width/2,-tip.height/2);mctx.restore()}
function textureSegment(a,b,brush,index){const dx=b.x-a.x,dy=b.y-a.y,len=Math.hypot(dx,dy);if(len<.01)return;const nx=-dy/len,ny=dx/len,str=Number(texture.value)/100,base=color.value;const lanes=[-.36,-.27,-.17,-.07,.04,.14,.24,.34];
 for(let i=0;i<lanes.length;i++){const wob=Math.sin(index*.73+i*1.91+stroke.seed*.0007)*brush*.012,off=lanes[i]*brush+wob,tone=(i%3===0?.085:i%3===1?-.065:.045),alpha=(.035+(i%4)*.010)*str;tctx.save();tctx.strokeStyle=shade(base,tone);tctx.globalAlpha=alpha;tctx.lineWidth=Math.max(.65,brush*(.010+(i%2)*.005));tctx.lineCap='round';tctx.beginPath();tctx.moveTo(a.x+nx*off,a.y+ny*off);tctx.quadraticCurveTo((a.x+b.x)/2+nx*(off+wob*.4),(a.y+b.y)/2+ny*(off+wob*.4),b.x+nx*off,b.y+ny*off);tctx.stroke();tctx.restore()}
 // A few broken dry bristle channels, stronger near the outer bands.
 const dryOffsets=[-.32,-.21,.19,.31];
 for(let i=0;i<dryOffsets.length;i++){const gate=Math.sin(index*1.37+i*2.11+stroke.seed*.0009);if(gate<-.10)continue;const off=dryOffsets[i]*brush,cut=.18+.20*Math.abs(gate),sx=a.x+dx*.08+nx*off,sy=a.y+dy*.08+ny*off,ex=b.x-dx*.08+nx*off,ey=b.y-dy*.08+ny*off;dctx.save();dctx.strokeStyle='#000';dctx.globalAlpha=(.10+cut*.18)*str;dctx.lineWidth=Math.max(.5,brush*(.0055+(i%2)*.004));dctx.lineCap='round';dctx.beginPath();dctx.moveTo(sx,sy);dctx.lineTo(ex,ey);dctx.stroke();dctx.restore()}
 // Soft paint-body variation: broad, barely visible streaks instead of random grain.
 if(index%3===0){const off=Math.sin(index*.51+stroke.seed*.0003)*brush*.22;tctx.save();tctx.strokeStyle=shade(base,index%2?.055:-.045);tctx.globalAlpha=.028*str;tctx.lineWidth=Math.max(2,brush*.11);tctx.lineCap='round';tctx.beginPath();tctx.moveTo(a.x+nx*off,a.y+ny*off);tctx.lineTo(b.x+nx*off,b.y+ny*off);tctx.stroke();tctx.restore()}
}
function renderLive(){clearLayer(lctx,live);lctx.save();lctx.setTransform(1,0,0,1,0,0);lctx.globalAlpha=1;lctx.drawImage(mask,0,0);lctx.globalCompositeOperation='source-in';lctx.fillStyle=color.value;lctx.fillRect(0,0,live.width,live.height);lctx.globalCompositeOperation='source-atop';lctx.globalAlpha=1;lctx.drawImage(tex,0,0);lctx.globalCompositeOperation='destination-out';lctx.globalAlpha=.82;lctx.drawImage(dry,0,0);lctx.restore();live.style.opacity=opacity.value/100}
function paintTo(a,b){const dx=b.x-a.x,dy=b.y-a.y,len=Math.hypot(dx,dy);if(len<.08)return;updateAngle(Math.atan2(dy,dx));const brush=+size.value,spacing=brush*.095,n=Math.max(1,Math.ceil(len/spacing));for(let i=1;i<=n;i++){const q=i/n,p={x:a.x+dx*q,y:a.y+dy*q,pressure:a.pressure+(b.pressure-a.pressure)*q};stampMask(p,stroke.index++);}textureSegment(a,b,brush,stroke.segment++);}
function draw(raw){const p=smooth(raw);if(!stroke.last){stroke.last={...p};return}const q=stroke.last;if(Math.hypot(p.x-q.x,p.y-q.y)<.12)return;paintTo(q,p);stroke.last={...p}}
function begin(p){save();clearLayer(mctx,mask);clearLayer(tctx,tex);clearLayer(dctx,dry);clearLayer(lctx,live);const seed=((performance.now()*1000)|0)^(Math.random()*0xffffffff),brush=+size.value;stroke={last:null,filtered:null,angle:null,seed,index:0,segment:0,tips:[makeTip(brush,seed^0x9e37),makeTip(brush,seed^0x51f2),makeTip(brush,seed^0xa4c1),makeTip(brush,seed^0x31b7),makeTip(brush,seed^0x7d93)]};draw(p)}
function commit(){if(!stroke)return;renderLive();ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=opacity.value/100;ctx.drawImage(live,0,0);ctx.restore();clearLayer(lctx,live);clearLayer(mctx,mask);clearLayer(tctx,tex);clearLayer(dctx,dry)}
live.addEventListener('pointerdown',e=>{e.preventDefault();try{live.setPointerCapture(e.pointerId)}catch(_){}drawing=true;begin(pos(e))});
live.addEventListener('pointermove',e=>{if(!drawing)return;e.preventDefault();const ce=typeof e.getCoalescedEvents==='function'?e.getCoalescedEvents():null,arr=ce&&ce.length?ce:[e];for(const ev of arr)draw(pos(ev));renderLive()});
function end(e){if(!drawing)return;drawing=false;commit();stroke=null;try{live.releasePointerCapture(e.pointerId)}catch(_){}}live.addEventListener('pointerup',end);live.addEventListener('pointercancel',end);live.addEventListener('contextmenu',e=>e.preventDefault());
$('undo').onclick=()=>{clearLayer(lctx,live);if(!history.length)return;const s=history.pop();ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;ctx.fillStyle='#fff';ctx.fillRect(0,0,paint.width,paint.height);ctx.drawImage(s,0,0);ctx.restore()};$('clear').onclick=()=>{save();clearLayer(lctx,live);ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;ctx.fillStyle='#fff';ctx.fillRect(0,0,paint.width,paint.height);ctx.restore()};
size.oninput=()=>{$('sizeVal').textContent=size.value};opacity.oninput=()=>{$('opacityVal').textContent=opacity.value+'%';live.style.opacity=opacity.value/100};texture.oninput=()=>{$('textureVal').textContent=texture.value+'%';if(drawing)renderLive()};addEventListener('resize',resize);resize();
})();</script>
</body>
</html>
