<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Gouache Brush v25</title>
<style>
:root{--bg:#f5f2eb;--ink:#292721;--line:#d4cdc1}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overscroll-behavior:none}body{display:grid;grid-template-rows:auto 1fr}header{background:#fff;border-bottom:1px solid var(--line);padding:9px 12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}h1{font:500 17px Georgia,serif;margin:0 8px 0 0}.ctrl{display:flex;align-items:center;gap:6px;font-size:12px}.ctrl input[type=range]{width:108px}input[type=color]{width:40px;height:34px;padding:2px;border:1px solid var(--line);border-radius:8px;background:#fff}button{border:1px solid #cfc7bb;background:#fff;border-radius:9px;padding:9px 10px;color:var(--ink);font-size:12px;font-weight:700}.stage{min-height:0;padding:8px}.wrap{height:100%;background:#fff;box-shadow:0 4px 20px #0001;overflow:hidden;touch-action:none;position:relative}.layer{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}.paint{z-index:1;background:#fff}.live{z-index:2;background:transparent;cursor:crosshair}@media(max-width:760px){header{gap:7px}.ctrl input[type=range]{width:82px}.stage{padding:6px}}
</style>
</head>
<body>
<header>
<h1>Gouache Brush v25</h1>
<div class="ctrl"><span>Color</span><input id="color" type="color" value="#987459"></div>
<div class="ctrl"><span>Size</span><input id="size" type="range" min="7" max="150" value="60"><strong id="sizeVal">60</strong></div>
<div class="ctrl"><span>Paint</span><input id="opacity" type="range" min="45" max="100" value="100"><strong id="opacityVal">100%</strong></div>
<div class="ctrl"><span>Texture</span><input id="texture" type="range" min="0" max="100" value="80"><strong id="textureVal">80%</strong></div>
<button id="undo">Undo</button><button id="clear">Clear</button>
</header>
<div class="stage"><div class="wrap" id="wrap"><canvas id="paint" class="layer paint"></canvas><canvas id="live" class="layer live"></canvas></div></div>
<script>(()=>{'use strict';
const $=id=>document.getElementById(id),paint=$('paint'),live=$('live'),wrap=$('wrap'),size=$('size'),opacity=$('opacity'),texture=$('texture'),color=$('color');
const pctx=paint.getContext('2d',{alpha:false,desynchronized:true}),lctx=live.getContext('2d',{alpha:true,desynchronized:true});
let dpr=1,drawing=false,stroke=null,history=[];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function setup(c,transparent){const r=wrap.getBoundingClientRect();c.width=Math.max(1,Math.floor(r.width*dpr));c.height=Math.max(1,Math.floor(r.height*dpr));const x=c.getContext('2d');x.setTransform(dpr,0,0,dpr,0,0);if(!transparent){x.fillStyle='#fff';x.fillRect(0,0,r.width,r.height)}}
function clearLive(){lctx.save();lctx.setTransform(1,0,0,1,0,0);lctx.clearRect(0,0,live.width,live.height);lctx.restore()}
function resize(){const old=document.createElement('canvas');old.width=paint.width;old.height=paint.height;if(old.width&&old.height)old.getContext('2d').drawImage(paint,0,0);dpr=Math.max(1,Math.min(2,devicePixelRatio||1));setup(paint,false);setup(live,true);if(old.width&&old.height){pctx.save();pctx.setTransform(1,0,0,1,0,0);pctx.drawImage(old,0,0,old.width,old.height,0,0,paint.width,paint.height);pctx.restore()}}
function pos(e){const r=live.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top,pressure:e.pressure>0?e.pressure:.5,time:e.timeStamp||performance.now()}}
function snapshot(){const c=document.createElement('canvas');c.width=paint.width;c.height=paint.height;c.getContext('2d').drawImage(paint,0,0);return c}
function save(){history.push(snapshot());if(history.length>10)history.shift()}
function rng(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}
function hash(n){const x=Math.sin(n*12.9898+stroke.seed*.000017)*43758.5453;return x-Math.floor(x)}
function makeTip(brush,hex,seed){const rd=rng(seed),W=Math.max(18,Math.round(brush*1.08)),H=Math.max(16,Math.round(brush*.90)),pad=Math.ceil(brush*.16),c=document.createElement('canvas');c.width=W+pad*2;c.height=H+pad*2;const t=c.getContext('2d');t.translate(pad,pad);const L=[.008,.120,.224,.496,.600,.712,.816,.856,.824,.848,.880,.880,.920,.968,.992,1,1,.976,.968,.960,.936,.872,.904,.872,.784],R=[.477,.742,.836,.914,.938,.977,.992,1,1,1,.883,.875,.875,.898,.930,.875,.852,.852,.820,.797,.719,.695,.695,.633,.641],cap=brush*.22,x0=brush*.020,x1=W-brush*.020,y0=H*.035,y1=H*.965,N=L.length;t.fillStyle=hex;t.beginPath();for(let i=0;i<N;i++){const u=i/(N-1),y=y0+(y1-y0)*u,x=x0+cap*(1-L[i])+(rd()-.5)*brush*.0045;if(i===0)t.moveTo(x,y);else t.lineTo(x,y)}for(let i=N-1;i>=0;i--){const u=i/(N-1),y=y0+(y1-y0)*u,x=x1-cap*(1-R[i])+(rd()-.5)*brush*.0045;t.lineTo(x,y)}t.closePath();t.fill();t.globalCompositeOperation='destination-out';for(let i=0;i<18;i++){const top=rd()<.5,x=W*(.045+rd()*.91),y=top?H*(.034+rd()*.050):H*(.916+rd()*.050);t.globalAlpha=.10+rd()*.18;t.beginPath();t.ellipse(x,y,brush*(.0025+rd()*.007),brush*(.0018+rd()*.0045),0,0,Math.PI*2);t.fill()}const rightYs=[.16,.25,.36,.49,.61,.74,.84];t.lineCap='round';for(const u0 of rightYs){const u=u0+(rd()-.5)*.015,y=y0+(y1-y0)*u,j=Math.max(0,Math.min(N-1,Math.round(u*(N-1)))),edge=x1-cap*(1-R[j]),len=brush*(.008+rd()*.026);t.globalAlpha=.22+rd()*.28;t.lineWidth=Math.max(.35,brush*(.0028+rd()*.0035));t.beginPath();t.moveTo(edge+brush*.004,y);t.lineTo(edge-len,y+(rd()-.5)*brush*.010);t.stroke()}t.globalCompositeOperation='source-over';t.globalAlpha=1;return c}
function angleDiff(a,b){let d=b-a;while(d>Math.PI)d-=Math.PI*2;while(d< -Math.PI)d+=Math.PI*2;return d}
function updateAngle(target){if(stroke.angle===null){stroke.angle=target;return}stroke.angle+=clamp(angleDiff(stroke.angle,target),-.035,.035)*.38}
function pressureScale(p){return clamp(.975+p*.055,.98,1.035)}
function stamp(p,index){const tip=stroke.tips[index%stroke.tips.length],f=pressureScale(p.pressure),a=stroke.angle??0,nx=-Math.sin(a),ny=Math.cos(a),j=Math.sin(index*1.37+stroke.seed*.001)*Number(size.value)*.0018;lctx.save();lctx.translate(p.x+nx*j,p.y+ny*j);lctx.rotate(a);lctx.scale(f,f);lctx.globalAlpha=1;lctx.globalCompositeOperation='source-over';lctx.drawImage(tip,-tip.width/2,-tip.height/2);lctx.restore()}
function textureStrength(){const v=+texture.value/100;return Math.pow(v,.85)}
function addSample(p){const a=stroke.samples[stroke.samples.length-1];if(!a||Math.hypot(p.x-a.x,p.y-a.y)>=1.0)stroke.samples.push({...p,s:stroke.distance});else stroke.samples[stroke.samples.length-1]={...p,s:stroke.distance}}
function pointAtS(s){const pts=stroke.samples;if(pts.length<2)return null;let i=stroke.cutIndex;while(i<pts.length-2&&pts[i+1].s<s)i++;stroke.cutIndex=i;const a=pts[i],b=pts[Math.min(i+1,pts.length-1)],span=Math.max(.0001,b.s-a.s),q=clamp((s-a.s)/span,0,1),x=a.x+(b.x-a.x)*q,y=a.y+(b.y-a.y)*q;const p0=pts[Math.max(0,i-1)],p1=pts[Math.min(pts.length-1,i+2)],dx=p1.x-p0.x,dy=p1.y-p0.y,L=Math.hypot(dx,dy)||1;return{x,y,tx:dx/L,ty:dy/L,nx:-dy/L,ny:dx/L}}
function drawCutAt(g,id){const brush=+size.value,str=textureStrength();if(str<=0)return;const r1=hash(id*19+1),r2=hash(id*19+2),r3=hash(id*19+3),r4=hash(id*19+4),r5=hash(id*19+5),lane=(r1-.5)*.72,off=lane*brush,len=brush*(.09+r2*.20),back=len*.48,forward=len*.52,curve=(r3-.5)*brush*.060,width=Math.max(.38,brush*(.0035+r4*.009)),alpha=(.16+r5*.34)*str;const sx=g.x-g.tx*back+g.nx*off,sy=g.y-g.ty*back+g.ny*off,ex=g.x+g.tx*forward+g.nx*(off+(r2-.5)*brush*.026),ey=g.y+g.ty*forward+g.ny*(off+(r2-.5)*brush*.026);lctx.save();lctx.globalCompositeOperation='destination-out';lctx.globalAlpha=alpha;lctx.lineWidth=width;lctx.lineCap='round';lctx.beginPath();lctx.moveTo(sx,sy);lctx.quadraticCurveTo((sx+ex)/2+g.nx*curve,(sy+ey)/2+g.ny*curve,ex,ey);lctx.stroke();if(hash(id*23+7)>.82){const chipLane=(hash(id*29+2)-.5)*.82,chipOff=chipLane*brush,chipBack=(hash(id*29+3)-.5)*brush*.050;lctx.globalAlpha=.12*str;lctx.beginPath();lctx.ellipse(g.x+g.nx*chipOff-g.tx*chipBack,g.y+g.ny*chipOff-g.ty*chipBack,brush*(.004+hash(id*29+4)*.007),brush*(.002+hash(id*29+5)*.004),Math.atan2(g.ty,g.tx),0,Math.PI*2);lctx.fill()}lctx.restore()}
function flushCuts(final=false){const brush=+size.value,cutoff=final?stroke.distance:stroke.distance-brush*.72;if(cutoff<=0)return;while(stroke.nextCutS<=cutoff){const g=pointAtS(stroke.nextCutS);if(!g)break;drawCutAt(g,stroke.cutId++);const r=hash(stroke.cutId*31+9);stroke.nextCutS+=brush*(.13+r*.18)}}
function paintTo(a,b){const dx=b.x-a.x,dy=b.y-a.y,len=Math.hypot(dx,dy);if(len<.05)return;updateAngle(Math.atan2(dy,dx));const brush=+size.value,spacing=clamp(brush*.026,1.0,2.0),n=Math.max(1,Math.ceil(len/spacing));for(let i=1;i<=n;i++){const q=i/n,p={x:a.x+dx*q,y:a.y+dy*q,pressure:a.pressure+(b.pressure-a.pressure)*q};stamp(p,stroke.index++)}stroke.distance+=len;addSample(b);flushCuts(false)}
function process(p){if(!stroke.last){stroke.last={...p};stroke.samples=[{...p,s:0}];return}const q=stroke.last;if(Math.hypot(p.x-q.x,p.y-q.y)<.08)return;paintTo(q,p);stroke.last={...p}}
function begin(p){save();clearLive();const seed=((performance.now()*1000)|0)^(Math.random()*0xffffffff),brush=+size.value;stroke={last:null,angle:null,index:0,distance:0,samples:[],cutIndex:0,cutId:1,nextCutS:brush*(.14+Math.random()*.12),seed,tips:[makeTip(brush,color.value,seed^0x9e37),makeTip(brush,color.value,seed^0x51f2),makeTip(brush,color.value,seed^0xa4c1),makeTip(brush,color.value,seed^0x31b7)]};process(p);live.style.opacity=opacity.value/100}
function commit(){if(!stroke)return;flushCuts(true);pctx.save();pctx.setTransform(1,0,0,1,0,0);pctx.globalAlpha=+opacity.value/100;pctx.drawImage(live,0,0);pctx.restore();clearLive()}
live.addEventListener('pointerdown',e=>{e.preventDefault();try{live.setPointerCapture(e.pointerId)}catch(_){}drawing=true;begin(pos(e))});
live.addEventListener('pointermove',e=>{if(!drawing)return;e.preventDefault();const ce=typeof e.getCoalescedEvents==='function'?e.getCoalescedEvents():null,arr=ce&&ce.length?ce:[e];for(const ev of arr)process(pos(ev))});
function end(e){if(!drawing)return;e.preventDefault();process(pos(e));drawing=false;commit();stroke=null;try{live.releasePointerCapture(e.pointerId)}catch(_){}}
live.addEventListener('pointerup',end);live.addEventListener('pointercancel',end);live.addEventListener('contextmenu',e=>e.preventDefault());
$('undo').onclick=()=>{clearLive();if(!history.length)return;const s=history.pop();pctx.save();pctx.setTransform(1,0,0,1,0,0);pctx.globalAlpha=1;pctx.fillStyle='#fff';pctx.fillRect(0,0,paint.width,paint.height);pctx.drawImage(s,0,0);pctx.restore()};
$('clear').onclick=()=>{save();clearLive();pctx.save();pctx.setTransform(1,0,0,1,0,0);pctx.globalAlpha=1;pctx.fillStyle='#fff';pctx.fillRect(0,0,paint.width,paint.height);pctx.restore()};
size.oninput=()=>{$('sizeVal').textContent=size.value};opacity.oninput=()=>{$('opacityVal').textContent=opacity.value+'%';live.style.opacity=opacity.value/100};texture.oninput=()=>{$('textureVal').textContent=texture.value+'%'};addEventListener('resize',resize);resize();
})();</script>
</body>
</html>
