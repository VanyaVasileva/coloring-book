const frame=document.getElementById('app');
frame.addEventListener('load',()=>{
  let d,w;try{d=frame.contentDocument;w=frame.contentWindow}catch(_){return}if(!d||!w)return;
  let tries=0;
  const timer=w.setInterval(()=>{
    tries++;
    const paint=d.getElementById('paint'),tools=d.getElementById('toolsPanel');
    if(!paint||!tools){if(tries>240)w.clearInterval(timer);return}
    w.clearInterval(timer);
    install(d,w,paint,tools);
  },50);
});

function install(d,w,paint,tools){
  if(d.getElementById('pencilSoundToggle'))return;
  const $=id=>d.getElementById(id),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
  const actionsLabel=[...tools.querySelectorAll('.label')].find(x=>/actions/i.test(x.textContent||''));
  const anchor=actionsLabel||$('status')||tools.lastElementChild;
  const box=d.createElement('div');
  box.id='pencilSoundControls';
  box.innerHTML=`
    <div class="label">Drawing sound</div>
    <label class="cursorSetting"><span>✏️ Pencil sound</span><input id="pencilSoundToggle" type="checkbox" checked></label>
    <div class="rowLabel" style="margin-top:9px"><span>Sound volume</span><span id="pencilSoundVal">100%</span></div>
    <input id="pencilSoundVolume" type="range" min="0" max="100" value="100">
    <button id="pencilSoundTest" type="button" style="width:100%;margin-top:9px">✏️ Test pencil sound</button>
    <div class="help">Uses your uploaded pencil-scratch recording. No generated wind/noise layer. Centered mono sound follows drawing movement and Apple Pencil pressure.</div>`;
  tools.insertBefore(box,anchor);

  const toggle=$('pencilSoundToggle'),volume=$('pencilSoundVolume'),value=$('pencilSoundVal'),test=$('pencilSoundTest');
  try{
    const saved=w.localStorage.getItem('pencilSoundEnabled');
    if(saved==='0')toggle.checked=false;
    const v=w.localStorage.getItem('pencilSoundVolume');
    if(v!==null&&Number.isFinite(+v))volume.value=String(clamp(+v,0,100));
  }catch(_){}
  value.textContent=volume.value+'%';

  let ac=null,audioBuffer=null,decodePromise=null,strokeSource=null,strokeGain=null,strokeFilter=null,fadeTimer=0,stopTimer=0;
  const pointers=new Map();

  function isPaint(){return $('toolPaint')?.classList.contains('active')||$('mPaint')?.classList.contains('active')}
  function ensureContext(){
    if(!ac){const AC=w.AudioContext||w.webkitAudioContext;if(!AC)return null;ac=new AC()}
    if(ac.state==='suspended')ac.resume().catch(()=>{});
    return ac;
  }
  function ensureBuffer(){
    const a=ensureContext();if(!a)return Promise.resolve(null);
    if(audioBuffer)return Promise.resolve(audioBuffer);
    if(decodePromise)return decodePromise;
    decodePromise=new Promise((resolve,reject)=>{
      try{
        const raw=atob(SAMPLE_B64),u8=new Uint8Array(raw.length);
        for(let i=0;i<raw.length;i++)u8[i]=raw.charCodeAt(i);
        const ab=u8.buffer.slice(0);
        const p=a.decodeAudioData(ab);
        if(p&&typeof p.then==='function')p.then(b=>{audioBuffer=b;resolve(b)}).catch(reject);
        else a.decodeAudioData(ab,b=>{audioBuffer=b;resolve(b)},reject);
      }catch(e){reject(e)}
    }).catch(()=>null);
    return decodePromise;
  }
  function clearTimers(){if(fadeTimer){w.clearTimeout(fadeTimer);fadeTimer=0}if(stopTimer){w.clearTimeout(stopTimer);stopTimer=0}}
  function endSource(immediate=false){
    clearTimers();
    if(!ac||!strokeSource||!strokeGain){strokeSource=null;strokeGain=null;strokeFilter=null;return}
    const src=strokeSource,g=strokeGain,t=ac.currentTime;
    strokeSource=null;strokeGain=null;strokeFilter=null;
    try{g.gain.cancelScheduledValues(t);if(immediate)g.gain.setValueAtTime(0,t);else g.gain.setTargetAtTime(0,t,.018)}catch(_){}
    stopTimer=w.setTimeout(()=>{try{src.stop()}catch(_){}},immediate?0:90);
  }
  async function startSource(pointerId){
    if(!toggle.checked||!isPaint()||pointers.size!==1)return;
    const a=ensureContext(),buf=await ensureBuffer();
    if(!a||!buf||!toggle.checked||!isPaint()||!pointers.has(pointerId)||pointers.size!==1)return;
    endSource(true);
    const src=a.createBufferSource(),gain=a.createGain(),hp=a.createBiquadFilter(),lp=a.createBiquadFilter();
    src.buffer=buf;src.loop=true;src.loopStart=.04;src.loopEnd=Math.max(.15,buf.duration-.09);
    hp.type='highpass';hp.frequency.value=145;hp.Q.value=.55;
    lp.type='lowpass';lp.frequency.value=5200;lp.Q.value=.45;
    gain.gain.value=0;
    src.connect(hp);hp.connect(lp);lp.connect(gain);gain.connect(a.destination);
    strokeSource=src;strokeGain=gain;strokeFilter=lp;
    try{src.start(0,Math.min(.12,buf.duration*.08))}catch(_){}
  }
  function updateSound(distance,dt,pressure,type){
    if(!toggle.checked||!isPaint()||!ac||!strokeGain)return;
    const frameScale=Math.max(.25,dt/16.7),speed=clamp(distance/frameScale/18,0,1),p=type==='pen'?clamp(pressure||.08,.04,1):.45,vol=+volume.value/100;
    const level=vol*(.055+.19*speed)*(.72+.38*p),now=ac.currentTime;
    strokeGain.gain.cancelScheduledValues(now);strokeGain.gain.setTargetAtTime(level,now,.012);
    if(strokeFilter)strokeFilter.frequency.setTargetAtTime(3900+speed*1700+p*300,now,.035);
    if(fadeTimer)w.clearTimeout(fadeTimer);
    fadeTimer=w.setTimeout(()=>{if(ac&&strokeGain){const t=ac.currentTime;strokeGain.gain.cancelScheduledValues(t);strokeGain.gain.setTargetAtTime(0,t,.025)}},105);
  }

  toggle.addEventListener('change',()=>{try{w.localStorage.setItem('pencilSoundEnabled',toggle.checked?'1':'0')}catch(_){}if(!toggle.checked)endSource(true);else ensureBuffer()});
  volume.addEventListener('input',()=>{value.textContent=volume.value+'%';try{w.localStorage.setItem('pencilSoundVolume',volume.value)}catch(_){}});

  paint.addEventListener('pointerdown',e=>{
    if(!toggle.checked||!isPaint())return;
    ensureContext();
    pointers.set(e.pointerId,{x:e.clientX,y:e.clientY,t:performance.now(),type:e.pointerType});
    if(pointers.size>1){endSource(true);return}
    startSource(e.pointerId);
  },true);
  paint.addEventListener('pointermove',e=>{
    const p=pointers.get(e.pointerId);if(!p)return;
    if(pointers.size>1||!isPaint()){endSource(true);return}
    const now=performance.now(),dx=e.clientX-p.x,dy=e.clientY-p.y,dist=Math.hypot(dx,dy),dt=Math.max(4,now-p.t);
    p.x=e.clientX;p.y=e.clientY;p.t=now;
    if(dist>.2)updateSound(dist,dt,e.pressure,e.pointerType);
  },true);
  const finish=e=>{pointers.delete(e.pointerId);if(!pointers.size)endSource(false)};
  paint.addEventListener('pointerup',finish,true);paint.addEventListener('pointercancel',finish,true);
  paint.addEventListener('pointerleave',e=>{if(pointers.has(e.pointerId))endSource(false)},true);
  ['toolFill','toolErase','toolMove','mFill','mErase','mMove'].forEach(id=>$(id)?.addEventListener('click',()=>endSource(true),true));

  test.addEventListener('click',async()=>{
    if(!toggle.checked){toggle.checked=true;toggle.dispatchEvent(new w.Event('change',{bubbles:true}))}
    const a=ensureContext(),buf=await ensureBuffer();if(!a||!buf)return;
    endSource(true);
    const src=a.createBufferSource(),gain=a.createGain(),hp=a.createBiquadFilter();
    src.buffer=buf;hp.type='highpass';hp.frequency.value=145;gain.gain.value=(+volume.value/100)*.24;
    src.connect(hp);hp.connect(gain);gain.connect(a.destination);src.start();
    w.setTimeout(()=>{try{src.stop()}catch(_){}},Math.min(1800,buf.duration*1000));
  });

  ensureBuffer();
  const diag=$('diag');
  if(diag)diag.textContent=(diag.textContent?diag.textContent+' ':'')+'Real uploaded pencil-scratch sample active; generated noise removed.';
}
})();
</script>
