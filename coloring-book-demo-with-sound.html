<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Coloring Book — Pencil Sound</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7f4ed}#app{display:block;width:100%;height:100%;border:0;background:#f7f4ed}
</style>
</head>
<body>
<iframe id="app" src="./demo.html?soundhost=mp3-direct-20260815" title="Color Sketchbook with pencil sound"></iframe>
<audio id="pencilAudio" preload="auto" loop playsinline src="./pencil-scratch-loop.mp3?build=mp3-direct-20260815"></audio>
<script>
(()=>{'use strict';
const frame=document.getElementById('app');
const audio=document.getElementById('pencilAudio');
audio.volume=0.72;

frame.addEventListener('load',()=>{
  let d,w;try{d=frame.contentDocument;w=frame.contentWindow}catch(_){return}if(!d||!w)return;
  let tries=0;
  const timer=w.setInterval(()=>{
    tries++;
    const paint=d.getElementById('paint'),tools=d.getElementById('toolsPanel');
    if(!paint||!tools){if(tries>240)w.clearInterval(timer);return}
    w.clearInterval(timer);install(d,w,paint,tools);
  },50);
});

function install(d,w,paint,tools){
  if(d.getElementById('pencilSoundToggle'))return;
  const $=id=>d.getElementById(id),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
  const actionsLabel=[...tools.querySelectorAll('.label')].find(x=>/actions/i.test(x.textContent||''));
  const anchor=actionsLabel||$('status')||tools.lastElementChild;
  const box=d.createElement('div');
  box.id='pencilSoundControls';
  box.innerHTML=`
    <div class="label">Drawing sound</div>
    <label class="cursorSetting"><span>✏️ Pencil scratch</span><input id="pencilSoundToggle" type="checkbox" checked></label>
    <div class="rowLabel" style="margin-top:9px"><span>Sound volume</span><span id="pencilSoundVal">72%</span></div>
    <input id="pencilSoundVolume" type="range" min="0" max="100" value="72">
    <button id="pencilSoundTest" type="button" style="width:100%;margin-top:9px">✏️ Test pencil sound</button>
    <div class="help">Uses the real pencil-scratch MP3 you supplied. Safari plays the file directly — no generated wind/noise and no Web Audio decoding.</div>`;
  tools.insertBefore(box,anchor);

  const toggle=$('pencilSoundToggle'),volume=$('pencilSoundVolume'),value=$('pencilSoundVal'),test=$('pencilSoundTest');
  let drawing=false,lastX=0,lastY=0,lastT=0,fadeTimer=0,activePointer=null;

  try{
    const saved=w.localStorage.getItem('pencilSoundEnabled');if(saved==='0')toggle.checked=false;
    const v=w.localStorage.getItem('pencilSoundVolume');if(v!==null&&Number.isFinite(+v))volume.value=String(clamp(+v,0,100));
  }catch(_){}
  value.textContent=volume.value+'%';audio.volume=(+volume.value/100)*.78;

  function isPaint(){return $('toolPaint')?.classList.contains('active')||$('mPaint')?.classList.contains('active')}
  function stop(immediate=false){
    drawing=false;activePointer=null;if(fadeTimer){w.clearTimeout(fadeTimer);fadeTimer=0}
    if(immediate){audio.pause();return}
    const start=audio.volume,target=0,steps=4;let i=0;
    const step=()=>{i++;audio.volume=start+(target-start)*(i/steps);if(i<steps)fadeTimer=w.setTimeout(step,12);else{audio.pause();audio.volume=(+volume.value/100)*.78}};step();
  }
  function start(e){
    if(!toggle.checked||!isPaint())return;
    if(fadeTimer){w.clearTimeout(fadeTimer);fadeTimer=0}
    drawing=true;activePointer=e.pointerId;lastX=e.clientX;lastY=e.clientY;lastT=performance.now();
    audio.volume=(+volume.value/100)*.58;
    if(audio.paused){try{audio.currentTime=Math.min(.08,audio.duration||.08)}catch(_){};const p=audio.play();if(p&&p.catch)p.catch(()=>{})}
  }
  function move(e){
    if(!drawing||e.pointerId!==activePointer||!toggle.checked||!isPaint())return;
    const now=performance.now(),dist=Math.hypot(e.clientX-lastX,e.clientY-lastY),dt=Math.max(4,now-lastT),speed=clamp((dist/(dt/16.7))/18,0,1),pressure=e.pointerType==='pen'?clamp(e.pressure||.1,.05,1):.45;
    lastX=e.clientX;lastY=e.clientY;lastT=now;
    const base=(+volume.value/100),level=base*(.34+.42*speed)*(.80+.20*pressure);
    audio.volume=clamp(level,0,1);
    if(audio.paused){const p=audio.play();if(p&&p.catch)p.catch(()=>{})}
  }

  toggle.addEventListener('change',()=>{try{w.localStorage.setItem('pencilSoundEnabled',toggle.checked?'1':'0')}catch(_){}if(!toggle.checked)stop(true)});
  volume.addEventListener('input',()=>{value.textContent=volume.value+'%';if(!drawing)audio.volume=(+volume.value/100)*.78;try{w.localStorage.setItem('pencilSoundVolume',volume.value)}catch(_){}});
  paint.addEventListener('pointerdown',start,true);
  paint.addEventListener('pointermove',move,true);
  paint.addEventListener('pointerup',e=>{if(e.pointerId===activePointer)stop(false)},true);
  paint.addEventListener('pointercancel',e=>{if(e.pointerId===activePointer)stop(true)},true);
  paint.addEventListener('pointerleave',e=>{if(e.pointerId===activePointer&&drawing)stop(false)},true);
  ['toolFill','toolErase','toolMove','mFill','mErase','mMove'].forEach(id=>$(id)?.addEventListener('click',()=>stop(true),true));

  test.addEventListener('click',()=>{
    if(!toggle.checked){toggle.checked=true;toggle.dispatchEvent(new w.Event('change',{bubbles:true}))}
    if(fadeTimer){w.clearTimeout(fadeTimer);fadeTimer=0}
    audio.pause();try{audio.currentTime=0}catch(_){};audio.volume=(+volume.value/100)*.78;
    const p=audio.play();if(p&&p.catch)p.catch(()=>{});
    fadeTimer=w.setTimeout(()=>stop(false),1100);
  });

  audio.load();
  const diag=$('diag');if(diag)diag.textContent=(diag.textContent?diag.textContent+' ':'')+'Direct Safari MP3 pencil sound enabled.';
}
})();
</script>
</body>
</html>
