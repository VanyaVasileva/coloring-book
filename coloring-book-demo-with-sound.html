<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>coloring-book-demo-with-sound</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7f4ed}#app{display:block;width:100%;height:100%;border:0;background:#f7f4ed}
</style>
</head>
<body>
<iframe id="app" src="./demo.html?soundhost=20260815d" title="Color Sketchbook with pencil sound"></iframe>
<script>
(()=>{'use strict';
const frame=document.getElementById('app');
frame.addEventListener('load',()=>{
  let d,w;try{d=frame.contentDocument;w=frame.contentWindow}catch(_){return}if(!d||!w)return;
  let tries=0;
  const timer=w.setInterval(()=>{
    tries++;
    const paint=d.getElementById('paint'),tools=d.getElementById('toolsPanel');
    if(!paint||!tools){if(tries>240)w.clearInterval(timer);return}
    w.clearInterval(timer);
    install(d,w,paint,tools);
  },50);
});

function install(d,w,paint,tools){
  if(d.getElementById('pencilSoundToggle'))return;
  const $=id=>d.getElementById(id),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
  const actionsLabel=[...tools.querySelectorAll('.label')].find(x=>/actions/i.test(x.textContent||''));
  const anchor=actionsLabel||$('status')||tools.lastElementChild;
  const box=d.createElement('div');
  box.id='pencilSoundControls';
  box.innerHTML=`
    <div class="label">Drawing sound</div>
    <label class="cursorSetting"><span>✏️ Pencil sound</span><input id="pencilSoundToggle" type="checkbox" checked></label>
    <div class="rowLabel" style="margin-top:9px"><span>Sound volume</span><span id="pencilSoundVal">100%</span></div>
    <input id="pencilSoundVolume" type="range" min="0" max="100" value="100">
    <button id="pencilSoundTest" type="button" style="width:100%;margin-top:9px">✏️ Test pencil sound</button>
    <div class="help">Scratchier pencil-tip texture with less wind-like noise. Centered sound, following drawing speed and Apple Pencil pressure.</div>`;
  tools.insertBefore(box,anchor);

  const toggle=$('pencilSoundToggle'),volume=$('pencilSoundVolume'),value=$('pencilSoundVal'),test=$('pencilSoundTest');
  try{
    const saved=w.localStorage.getItem('pencilSoundEnabled');
    if(saved==='0')toggle.checked=false;
    const v=w.localStorage.getItem('pencilSoundVolume');
    if(v!==null&&Number.isFinite(+v))volume.value=String(clamp(+v,0,100));
  }catch(_){}
  value.textContent=volume.value+'%';
  toggle.addEventListener('change',()=>{try{w.localStorage.setItem('pencilSoundEnabled',toggle.checked?'1':'0')}catch(_){}if(!toggle.checked)stopSound(true)});
  volume.addEventListener('input',()=>{value.textContent=volume.value+'%';try{w.localStorage.setItem('pencilSoundVolume',volume.value)}catch(_){}});

  let ac=null,baseSource=null,grainSource=null,master=null,baseLowpass=null,scratchFilter=null,grainFilter=null,bodyFilter=null,scratchGain=null,grainGain=null,bodyGain=null,compressor=null,center=null,fadeTimer=0;
  const pointers=new Map();

  function isPaint(){return $('toolPaint')?.classList.contains('active')||$('mPaint')?.classList.contains('active')}
  function createAudio(){
    if(ac)return ac;
    const AC=w.AudioContext||w.webkitAudioContext;if(!AC)return null;
    ac=new AC();
    const seconds=2,samples=Math.max(1,Math.floor(ac.sampleRate*seconds));

    const baseBuffer=ac.createBuffer(1,samples,ac.sampleRate),base=baseBuffer.getChannelData(0);
    let brown=0;
    for(let i=0;i<samples;i++){
      const white=Math.random()*2-1;
      brown=brown*.965+white*.035;
      base[i]=brown*.50+white*.045;
    }

    const grainBuffer=ac.createBuffer(1,samples,ac.sampleRate),grain=grainBuffer.getChannelData(0);
    let env=0,rough=0;
    for(let i=0;i<samples;i++){
      if(Math.random()<.006)env=.35+Math.random()*.65;
      env*=.995;
      const white=Math.random()*2-1;
      rough=rough*.45+white*.55;
      grain[i]=rough*env;
    }

    baseSource=ac.createBufferSource();baseSource.buffer=baseBuffer;baseSource.loop=true;
    grainSource=ac.createBufferSource();grainSource.buffer=grainBuffer;grainSource.loop=true;

    const baseHigh=ac.createBiquadFilter();baseHigh.type='highpass';baseHigh.frequency.value=135;baseHigh.Q.value=.55;
    baseLowpass=ac.createBiquadFilter();baseLowpass.type='lowpass';baseLowpass.frequency.value=1500;baseLowpass.Q.value=.45;
    scratchFilter=ac.createBiquadFilter();scratchFilter.type='bandpass';scratchFilter.frequency.value=1050;scratchFilter.Q.value=.95;
    bodyFilter=ac.createBiquadFilter();bodyFilter.type='bandpass';bodyFilter.frequency.value=300;bodyFilter.Q.value=.8;

    const grainHigh=ac.createBiquadFilter();grainHigh.type='highpass';grainHigh.frequency.value=700;grainHigh.Q.value=.5;
    grainFilter=ac.createBiquadFilter();grainFilter.type='bandpass';grainFilter.frequency.value=2150;grainFilter.Q.value=1.45;

    scratchGain=ac.createGain();scratchGain.gain.value=.46;
    grainGain=ac.createGain();grainGain.gain.value=.13;
    bodyGain=ac.createGain();bodyGain.gain.value=.30;
    master=ac.createGain();master.gain.value=0;
    compressor=ac.createDynamicsCompressor();compressor.threshold.value=-30;compressor.knee.value=18;compressor.ratio.value=2.6;compressor.attack.value=.006;compressor.release.value=.075;
    center=ac.createStereoPanner?ac.createStereoPanner():null;if(center)center.pan.value=0;

    baseSource.connect(baseHigh);baseHigh.connect(baseLowpass);
    baseLowpass.connect(scratchFilter);scratchFilter.connect(scratchGain);scratchGain.connect(master);
    baseLowpass.connect(bodyFilter);bodyFilter.connect(bodyGain);bodyGain.connect(master);

    grainSource.connect(grainHigh);grainHigh.connect(grainFilter);grainFilter.connect(grainGain);grainGain.connect(master);

    master.connect(compressor);
    if(center){compressor.connect(center);center.connect(ac.destination)}else compressor.connect(ac.destination);
    baseSource.start();grainSource.start();
    return ac;
  }

  function unlock(){
    if(!toggle.checked)return null;
    const a=createAudio();
    if(a&&a.state==='suspended')a.resume().catch(()=>{});
    return a;
  }

  function stopSound(immediate=false){
    if(fadeTimer){w.clearTimeout(fadeTimer);fadeTimer=0}
    if(!ac||!master)return;
    const t=ac.currentTime;
    master.gain.cancelScheduledValues(t);
    if(immediate)master.gain.setValueAtTime(0,t);
    else master.gain.setTargetAtTime(0,t,.020);
  }

  function scratch(distance,dt,pressure,type){
    if(!toggle.checked||!isPaint())return;
    const a=unlock();if(!a||!master)return;
    const frameScale=Math.max(.25,dt/16.7),speed=clamp(distance/frameScale/19,0,1),p=type==='pen'?clamp(pressure||.08,.04,1):.44,vol=+volume.value/100;
    const level=vol*(.008+.032*speed)*(.72+.44*p),now=a.currentTime;
    master.gain.cancelScheduledValues(now);master.gain.setTargetAtTime(level,now,.010);
    baseLowpass.frequency.setTargetAtTime(1200+speed*650+p*120,now,.030);
    scratchFilter.frequency.setTargetAtTime(850+speed*850+p*130,now,.024);
    grainFilter.frequency.setTargetAtTime(1850+speed*1150+p*120,now,.022);
    bodyFilter.frequency.setTargetAtTime(220+p*210+speed*45,now,.030);
    scratchGain.gain.setTargetAtTime(.34+speed*.28,now,.025);
    grainGain.gain.setTargetAtTime(.09+speed*.16,now,.022);
    bodyGain.gain.setTargetAtTime(.22+p*.12,now,.030);
    if(fadeTimer)w.clearTimeout(fadeTimer);
    fadeTimer=w.setTimeout(()=>stopSound(false),72);
  }

  paint.addEventListener('pointerdown',e=>{
    if(!toggle.checked||!isPaint())return;
    unlock();
    pointers.set(e.pointerId,{x:e.clientX,y:e.clientY,t:performance.now(),type:e.pointerType});
    if(pointers.size>1)stopSound(true);
  },true);
  paint.addEventListener('pointermove',e=>{
    const p=pointers.get(e.pointerId);if(!p)return;
    if(pointers.size>1||!isPaint()){stopSound(true);return}
    const now=performance.now(),dx=e.clientX-p.x,dy=e.clientY-p.y,dist=Math.hypot(dx,dy),dt=Math.max(4,now-p.t);
    p.x=e.clientX;p.y=e.clientY;p.t=now;
    if(dist>.25)scratch(dist,dt,e.pressure,e.pointerType);
  },true);
  const finish=e=>{pointers.delete(e.pointerId);stopSound(false)};
  paint.addEventListener('pointerup',finish,true);paint.addEventListener('pointercancel',finish,true);paint.addEventListener('pointerleave',e=>{if(pointers.has(e.pointerId))stopSound(false)},true);
  ['toolFill','toolErase','toolMove','mFill','mErase','mMove'].forEach(id=>$(id)?.addEventListener('click',()=>stopSound(true),true));

  test.addEventListener('click',()=>{
    if(!toggle.checked){toggle.checked=true;toggle.dispatchEvent(new w.Event('change',{bubbles:true}))}
    const a=unlock();if(!a||!master)return;
    let i=0;
    const run=()=>{
      if(i++>22){stopSound(false);return}
      scratch(4+Math.random()*11,16+Math.random()*9,.25+Math.random()*.55,'pen');
      w.setTimeout(run,22+Math.random()*13);
    };
    run();
  });

  const diag=$('diag');
  if(diag)diag.textContent=(diag.textContent?diag.textContent+' ':'')+'Scratchier pencil-tip sound enabled; wind-like body reduced.';
}
})();
</script>
</body>
</html>
