<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Coloring Book — Pencil Sound</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7f4ed}#app{display:block;width:100%;height:100%;border:0;background:#f7f4ed}
</style>
</head>
<body>
<iframe id="app" src="./demo.html?soundhost=velocity-sync-light-20260815" title="Color Sketchbook with pencil sound"></iframe>
<audio id="pencilAudio" preload="auto" loop playsinline src="./pencil-scratch-loop.mp3?build=velocity-sync-light-20260815"></audio>
<script>
(()=>{'use strict';
const frame=document.getElementById('app');
const audio=document.getElementById('pencilAudio');
audio.setAttribute('playsinline','');
audio.setAttribute('webkit-playsinline','');
audio.preservesPitch=false;
audio.webkitPreservesPitch=false;

frame.addEventListener('load',()=>{
  let d,w;try{d=frame.contentDocument;w=frame.contentWindow}catch(_){return}if(!d||!w)return;
  let tries=0;
  const timer=w.setInterval(()=>{
    tries++;
    const paint=d.getElementById('paint'),tools=d.getElementById('toolsPanel');
    if(!paint||!tools){if(tries>240)w.clearInterval(timer);return}
    w.clearInterval(timer);install(d,w,paint,tools);
  },50);
});

function install(d,w,paint,tools){
  if(d.getElementById('pencilSoundToggle'))return;
  const $=id=>d.getElementById(id),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
  const actionsLabel=[...tools.querySelectorAll('.label')].find(x=>/actions/i.test(x.textContent||''));
  const anchor=actionsLabel||$('status')||tools.lastElementChild;
  const box=d.createElement('div');
  box.id='pencilSoundControls';
  box.innerHTML=`
    <div class="label">Drawing sound</div>
    <label class="cursorSetting"><span>✏️ Pencil scratch</span><input id="pencilSoundToggle" type="checkbox" checked></label>
    <div class="rowLabel" style="margin-top:9px"><span>Sound volume</span><span id="pencilSoundVal">72%</span></div>
    <input id="pencilSoundVolume" type="range" min="0" max="100" value="72">
    <button id="pencilSoundTest" type="button" style="width:100%;margin-top:9px">✏️ Test pencil sound</button>
    <div class="help">Lightweight velocity sync: the drawing loop is untouched. Pencil speed changes only the sound playback speed and loudness. Stop moving = silence.</div>`;
  tools.insertBefore(box,anchor);

  const toggle=$('pencilSoundToggle'),volume=$('pencilSoundVolume'),value=$('pencilSoundVal'),test=$('pencilSoundTest');
  let drawing=false,activePointer=null,lastX=0,lastY=0,lastT=0,smoothSpeed=0,silenceTimer=0,rafPending=false,pendingVolume=0,pendingRate=1;

  try{
    const saved=w.localStorage.getItem('pencilSoundEnabled');if(saved==='0')toggle.checked=false;
    const v=w.localStorage.getItem('pencilSoundVolume');if(v!==null&&Number.isFinite(+v))volume.value=String(clamp(+v,0,100));
  }catch(_){}
  value.textContent=volume.value+'%';
  audio.volume=0;
  audio.playbackRate=1;

  function isPaint(){return $('toolPaint')?.classList.contains('active')||$('mPaint')?.classList.contains('active')}
  function cancelSilence(){if(silenceTimer){w.clearTimeout(silenceTimer);silenceTimer=0}}
  function applyAudio(){
    rafPending=false;
    if(!drawing||!toggle.checked||!isPaint()){audio.volume=0;return}
    audio.playbackRate=pendingRate;
    audio.volume=pendingVolume;
  }
  function scheduleAudio(level,rate){
    pendingVolume=clamp(level,0,1);
    pendingRate=clamp(rate,.55,2.05);
    if(!rafPending){rafPending=true;w.requestAnimationFrame(applyAudio)}
  }
  function startAudioFromGesture(){
    audio.volume=0;
    if(audio.paused){
      const p=audio.play();
      if(p&&p.catch)p.catch(()=>{});
    }
  }
  function stop(){
    drawing=false;activePointer=null;smoothSpeed=0;cancelSilence();
    audio.volume=0;
    // Pause only after the stroke ends; never start/stop repeatedly during pointermove.
    try{audio.pause()}catch(_){}
  }
  function start(e){
    if(!toggle.checked||!isPaint())return;
    cancelSilence();
    drawing=true;activePointer=e.pointerId;lastX=e.clientX;lastY=e.clientY;lastT=performance.now();smoothSpeed=0;
    startAudioFromGesture();
  }
  function move(e){
    if(!drawing||e.pointerId!==activePointer||!toggle.checked||!isPaint())return;
    const now=performance.now(),dx=e.clientX-lastX,dy=e.clientY-lastY,dist=Math.hypot(dx,dy),dt=Math.max(4,now-lastT);
    lastX=e.clientX;lastY=e.clientY;lastT=now;
    if(dist<.08)return;

    // px/ms from the actual Pencil event stream. This is read-only: it never changes drawing coordinates or timing.
    const rawSpeed=dist/dt;
    smoothSpeed=smoothSpeed*.58+rawSpeed*.42;
    const speed01=clamp((smoothSpeed-.015)/.85,0,1);
    const pressure=e.pointerType==='pen'?clamp(e.pressure||.08,.04,1):.45;
    const base=+volume.value/100;

    // Sound speed follows Pencil speed continuously: very slow stroke ~0.58x, normal ~1x, fast up to ~2x.
    const rate=.58+speed01*1.42;
    const level=base*(.16+.52*speed01)*(.78+.22*pressure);
    scheduleAudio(level,rate);

    cancelSilence();
    silenceTimer=w.setTimeout(()=>{
      if(drawing){smoothSpeed=0;scheduleAudio(0,.58)}
    },48);
  }

  toggle.addEventListener('change',()=>{try{w.localStorage.setItem('pencilSoundEnabled',toggle.checked?'1':'0')}catch(_){}if(!toggle.checked)stop()});
  volume.addEventListener('input',()=>{value.textContent=volume.value+'%';try{w.localStorage.setItem('pencilSoundVolume',volume.value)}catch(_){}});
  paint.addEventListener('pointerdown',start,true);
  paint.addEventListener('pointermove',move,true);
  paint.addEventListener('pointerup',e=>{if(e.pointerId===activePointer)stop()},true);
  paint.addEventListener('pointercancel',e=>{if(e.pointerId===activePointer)stop()},true);
  paint.addEventListener('pointerleave',e=>{if(e.pointerId===activePointer&&drawing)stop()},true);
  ['toolFill','toolErase','toolMove','mFill','mErase','mMove'].forEach(id=>$(id)?.addEventListener('click',stop,true));

  test.addEventListener('click',()=>{
    if(!toggle.checked){toggle.checked=true;toggle.dispatchEvent(new w.Event('change',{bubbles:true}))}
    cancelSilence();
    try{audio.pause();audio.currentTime=0}catch(_){}
    audio.volume=(+volume.value/100)*.42;
    audio.playbackRate=1;
    const p=audio.play();if(p&&p.catch)p.catch(()=>{});
    silenceTimer=w.setTimeout(()=>{audio.volume=0;try{audio.pause()}catch(_){}},1000);
  });

  audio.load();
  const diag=$('diag');if(diag)diag.textContent=(diag.textContent?diag.textContent+' ':'')+'Lightweight sound sync active; drawing speed is not modified by audio.';
}
})();
</script>
</body>
</html>
