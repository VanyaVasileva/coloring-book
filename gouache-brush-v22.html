<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Gouache Brush v22</title>
<style>
:root{--bg:#f5f2eb;--ink:#292721;--line:#d4cdc1}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overscroll-behavior:none}body{display:grid;grid-template-rows:auto 1fr}header{background:#fff;border-bottom:1px solid var(--line);padding:9px 12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}h1{font:500 17px Georgia,serif;margin:0 8px 0 0}.ctrl{display:flex;align-items:center;gap:6px;font-size:12px}.ctrl input[type=range]{width:108px}input[type=color]{width:40px;height:34px;padding:2px;border:1px solid var(--line);border-radius:8px;background:#fff}button{border:1px solid #cfc7bb;background:#fff;border-radius:9px;padding:9px 10px;color:var(--ink);font-size:12px;font-weight:700}.stage{min-height:0;padding:8px}.wrap{height:100%;background:#fff;box-shadow:0 4px 20px #0001;overflow:hidden;touch-action:none;position:relative}.layer{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}.paint{z-index:1;background:#fff}.live{z-index:2;background:transparent;cursor:crosshair}@media(max-width:760px){header{gap:7px}.ctrl input[type=range]{width:82px}.stage{padding:6px}}
</style>
</head>
<body>
<header>
<h1>Gouache Brush v22</h1>
<div class="ctrl"><span>Color</span><input id="color" type="color" value="#987459"></div>
<div class="ctrl"><span>Size</span><input id="size" type="range" min="7" max="150" value="60"><strong id="sizeVal">60</strong></div>
<div class="ctrl"><span>Paint</span><input id="opacity" type="range" min="45" max="100" value="100"><strong id="opacityVal">100%</strong></div>
<div class="ctrl"><span>Texture</span><input id="texture" type="range" min="0" max="100" value="80"><strong id="textureVal">80%</strong></div>
<button id="undo">Undo</button><button id="clear">Clear</button>
</header>
<div class="stage"><div class="wrap" id="wrap"><canvas id="paint" class="layer paint"></canvas><canvas id="live" class="layer live"></canvas></div></div>
<script>(()=>{'use strict';
const $=id=>document.getElementById(id),paint=$('paint'),live=$('live'),wrap=$('wrap'),size=$('size'),opacity=$('opacity'),texture=$('texture'),color=$('color');
const pctx=paint.getContext('2d',{alpha:false,desynchronized:true}),lctx=live.getContext('2d',{alpha:true,desynchronized:true});
const body=document.createElement('canvas'),tex=document.createElement('canvas'),dry=document.createElement('canvas');
let bctx=body.getContext('2d',{alpha:true}),tctx=tex.getContext('2d',{alpha:true}),dctx=dry.getContext('2d',{alpha:true});
let dpr=1,drawing=false,stroke=null,history=[];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function setup(c,transparent){const r=wrap.getBoundingClientRect();c.width=Math.max(1,Math.floor(r.width*dpr));c.height=Math.max(1,Math.floor(r.height*dpr));const x=c.getContext('2d');x.setTransform(dpr,0,0,dpr,0,0);if(!transparent){x.fillStyle='#fff';x.fillRect(0,0,r.width,r.height)}}
function clearCtx(x,c){x.save();x.setTransform(1,0,0,1,0,0);x.clearRect(0,0,c.width,c.height);x.restore()}
function clearStrokeLayers(){clearCtx(bctx,body);clearCtx(tctx,tex);clearCtx(dctx,dry);clearCtx(lctx,live)}
function resize(){const old=document.createElement('canvas');old.width=paint.width;old.height=paint.height;if(old.width&&old.height)old.getContext('2d').drawImage(paint,0,0);dpr=Math.max(1,Math.min(2,devicePixelRatio||1));setup(paint,false);setup(live,true);setup(body,true);setup(tex,true);setup(dry,true);bctx=body.getContext('2d');tctx=tex.getContext('2d');dctx=dry.getContext('2d');bctx.setTransform(dpr,0,0,dpr,0,0);tctx.setTransform(dpr,0,0,dpr,0,0);dctx.setTransform(dpr,0,0,dpr,0,0);if(old.width&&old.height){pctx.save();pctx.setTransform(1,0,0,1,0,0);pctx.drawImage(old,0,0,old.width,old.height,0,0,paint.width,paint.height);pctx.restore()}}
function pos(e){const r=live.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top,pressure:e.pressure>0?e.pressure:.5,time:e.timeStamp||performance.now()}}
function snapshot(){const c=document.createElement('canvas');c.width=paint.width;c.height=paint.height;c.getContext('2d').drawImage(paint,0,0);return c}
function save(){history.push(snapshot());if(history.length>10)history.shift()}
function rng(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}
function rgb(hex){return[parseInt(hex.slice(1,3),16),parseInt(hex.slice(3,5),16),parseInt(hex.slice(5,7),16)]}
function shade(hex,p){const[r,g,b]=rgb(hex);return p<0?`rgb(${Math.round(r*(1+p))},${Math.round(g*(1+p))},${Math.round(b*(1+p))})`:`rgb(${Math.round(r+(255-r)*p)},${Math.round(g+(255-g)*p)},${Math.round(b+(255-b)*p)})`}
function makeTip(brush,hex,seed){const rd=rng(seed),W=Math.max(18,Math.round(brush*1.06)),H=Math.max(16,Math.round(brush*.90)),pad=Math.ceil(brush*.15),c=document.createElement('canvas');c.width=W+pad*2;c.height=H+pad*2;const t=c.getContext('2d');t.translate(pad,pad);const wob=()=> (rd()-.5)*brush*.016,r=brush*.075,x0=brush*.025,x1=W-brush*.025,y0=H*.05,y1=H*.95;t.fillStyle=hex;t.globalAlpha=1;t.beginPath();t.moveTo(x0+r+wob(),y0+wob());t.lineTo(x1-r+wob(),y0+wob());t.quadraticCurveTo(x1+wob(),y0+wob(),x1+wob(),y0+r+wob());t.lineTo(x1+wob(),y1-r+wob());t.quadraticCurveTo(x1+wob(),y1+wob(),x1-r+wob(),y1+wob());t.lineTo(x0+r+wob(),y1+wob());t.quadraticCurveTo(x0+wob(),y1+wob(),x0+wob(),y1-r+wob());t.lineTo(x0+wob(),y0+r+wob());t.quadraticCurveTo(x0+wob(),y0+wob(),x0+r+wob(),y0+wob());t.closePath();t.fill();t.globalCompositeOperation='destination-out';for(let i=0;i<38;i++){const top=rd()<.5,x=W*(.03+rd()*.94),y=top?H*(.028+rd()*.064):H*(.908+rd()*.064);t.globalAlpha=.18+rd()*.32;t.beginPath();t.ellipse(x,y,brush*(.003+rd()*.012),brush*(.002+rd()*.007),0,0,Math.PI*2);t.fill()}for(let side=0;side<2;side++)for(let i=0;i<12;i++){const y=H*(.08+rd()*.84),x=side===0?x0:x1,len=brush*(.015+rd()*.040);t.globalAlpha=.15+rd()*.24;t.lineWidth=Math.max(.4,brush*(.0033+rd()*.0028));t.lineCap='round';t.beginPath();t.moveTo(x,y);t.lineTo(x+(side===0?len:-len),y+(rd()-.5)*brush*.010);t.stroke()}t.globalCompositeOperation='source-over';t.globalAlpha=1;return c}
function angleDiff(a,b){let d=b-a;while(d>Math.PI)d-=Math.PI*2;while(d< -Math.PI)d+=Math.PI*2;return d}
function updateAngle(target){if(stroke.angle===null){stroke.angle=target;return}const d=angleDiff(stroke.angle,target);stroke.angle+=clamp(d,-.035,.035)*.38}
function pressureScale(p){return clamp(.975+p*.055,.98,1.035)}
function stamp(p,index){const tip=stroke.tips[index%stroke.tips.length],f=pressureScale(p.pressure),a=stroke.angle??0,nx=-Math.sin(a),ny=Math.cos(a),j=Math.sin(index*1.37+stroke.seed*.001)*Number(size.value)*.0018;bctx.save();bctx.translate(p.x+nx*j,p.y+ny*j);bctx.rotate(a);bctx.scale(f,f);bctx.globalAlpha=1;bctx.globalCompositeOperation='source-over';bctx.drawImage(tip,-tip.width/2,-tip.height/2);bctx.restore()}
function textureStrength(){const v=+texture.value/100;return v<=0?0:.42+Math.pow(v,.72)*.92}
function makeBristles(brush,seed){const rd=rng(seed),arr=[];for(let i=0;i<13;i++){arr.push({lane:-.43+(i/12)*.86+(rd()-.5)*.025,width:brush*(.0030+rd()*.0042),alpha:.050+rd()*.070,tone:(rd()-.5)*.30,amp:brush*(.008+rd()*.022),freq:.018+rd()*.022,phase:rd()*Math.PI*2,breakFreq:.010+rd()*.015,breakPhase:rd()*Math.PI*2,breakThreshold:-.20+rd()*.20})}return arr}
function makeDryHairs(brush,seed){const rd=rng(seed),arr=[];for(let i=0;i<7;i++){arr.push({lane:-.42+(i/6)*.84+(rd()-.5)*.035,width:brush*(.0036+rd()*.0040),alpha:.070+rd()*.090,amp:brush*(.010+rd()*.030),freq:.016+rd()*.020,phase:rd()*Math.PI*2,breakFreq:.012+rd()*.018,breakPhase:rd()*Math.PI*2,breakThreshold:-.05+rd()*.24})}return arr}
function laneOffset(h,d,brush){return h.lane*brush+Math.sin(d*h.freq+h.phase)*h.amp}
function textureSegment(a,b){const dx=b.x-a.x,dy=b.y-a.y,len=Math.hypot(dx,dy);if(len<.01)return;const nx=-dy/len,ny=dx/len,brush=+size.value,str=textureStrength(),base=color.value;if(str<=0)return;const d0=stroke.distance,d1=stroke.distance+len,dm=(d0+d1)/2;for(let i=0;i<2;i++){const lane=i===0?-.18:.20,off0=lane*brush+Math.sin(d0*.010+i*2.4+stroke.seed*.0007)*brush*.025,off1=lane*brush+Math.sin(d1*.010+i*2.4+stroke.seed*.0007)*brush*.025,offm=(off0+off1)/2+Math.sin(dm*.016+i*1.7)*brush*.018;tctx.save();tctx.lineCap='round';tctx.strokeStyle=shade(base,i===0?-.075:.085);tctx.globalAlpha=(.030+i*.006)*str;tctx.lineWidth=Math.max(1.2,brush*(.075+i*.015));tctx.beginPath();tctx.moveTo(a.x+nx*off0,a.y+ny*off0);tctx.quadraticCurveTo((a.x+b.x)/2+nx*offm,(a.y+b.y)/2+ny*offm,b.x+nx*off1,b.y+ny*off1);tctx.stroke();tctx.restore()}tctx.save();tctx.lineCap='round';for(const h of stroke.bristles){const gate=Math.sin(dm*h.breakFreq+h.breakPhase);if(gate<h.breakThreshold)continue;const o0=laneOffset(h,d0,brush),o1=laneOffset(h,d1,brush),om=laneOffset(h,dm,brush)+Math.sin(dm*h.freq*.63+h.phase*1.31)*h.amp*.75;const along=Math.sin(dm*.021+h.phase)*brush*.025;tctx.strokeStyle=shade(base,h.tone);tctx.globalAlpha=h.alpha*str*(.72+.28*Math.abs(gate));tctx.lineWidth=Math.max(.32,h.width);tctx.beginPath();tctx.moveTo(a.x+nx*o0,a.y+ny*o0);tctx.quadraticCurveTo((a.x+b.x)/2+nx*om+dx/len*along,(a.y+b.y)/2+ny*om+dy/len*along,b.x+nx*o1,b.y+ny*o1);tctx.stroke()}tctx.restore();dctx.save();dctx.lineCap='round';for(const h of stroke.dryHairs){const gate=Math.sin(dm*h.breakFreq+h.breakPhase);if(gate<h.breakThreshold)continue;const o0=laneOffset(h,d0,brush),o1=laneOffset(h,d1,brush),om=laneOffset(h,dm,brush)+Math.cos(dm*h.freq*.71+h.phase)*h.amp*.85;const along=Math.cos(dm*.019+h.phase)*brush*.022;dctx.globalAlpha=h.alpha*str*(.68+.32*Math.abs(gate));dctx.lineWidth=Math.max(.34,h.width);dctx.beginPath();dctx.moveTo(a.x+nx*o0,a.y+ny*o0);dctx.quadraticCurveTo((a.x+b.x)/2+nx*om+dx/len*along,(a.y+b.y)/2+ny*om+dy/len*along,b.x+nx*o1,b.y+ny*o1);dctx.stroke()}dctx.restore()}
function addReferenceEnding(p,a,isStart){if(!p||a===null)return;const tx=Math.cos(a),ty=Math.sin(a),nx=-ty,ny=tx,brush=+size.value,str=textureStrength(),dir=isStart?-1:1,rd=rng((stroke.seed^(isStart?0x31f7:0xc4a9))>>>0),base=color.value,count=isStart?7:10;/* short paint bristles only */bctx.save();bctx.globalCompositeOperation='source-over';bctx.lineCap='round';for(let i=0;i<count;i++){const lane=-.41+(count===1?.5:i/(count-1))*.82+(rd()-.5)*.028,off=lane*brush,startBack=brush*(.020+rd()*.035),reach=brush*(.035+rd()*(isStart?.055:.085)),bend=(rd()-.5)*brush*.020,sx=p.x-tx*dir*startBack+nx*off,sy=p.y-ty*dir*startBack+ny*off,ex=p.x+tx*dir*reach+nx*(off+(rd()-.5)*brush*.012),ey=p.y+ty*dir*reach+ny*(off+(rd()-.5)*brush*.012);bctx.strokeStyle=shade(base,(rd()-.5)*.07);bctx.globalAlpha=.82+rd()*.16;bctx.lineWidth=Math.max(.55,brush*(.010+rd()*.013));bctx.beginPath();bctx.moveTo(sx,sy);bctx.quadraticCurveTo((sx+ex)/2+nx*bend,(sy+ey)/2+ny*bend,ex,ey);bctx.stroke()}bctx.restore();/* tiny dry separations cut into only the final edge */dctx.save();dctx.lineCap='round';for(let i=0;i<(isStart?4:6);i++){const lane=-.36+(i/Math.max(1,(isStart?3:5)))*.72+(rd()-.5)*.030,off=lane*brush,startBack=brush*(.015+rd()*.025),depth=brush*(.035+rd()*.055),bend=(rd()-.5)*brush*.018,sx=p.x+tx*dir*brush*.018+nx*off,sy=p.y+ty*dir*brush*.018+ny*off,ex=p.x-tx*dir*(startBack+depth)+nx*(off+(rd()-.5)*brush*.010),ey=p.y-ty*dir*(startBack+depth)+ny*(off+(rd()-.5)*brush*.010);dctx.globalAlpha=(.16+rd()*.18)*str;dctx.lineWidth=Math.max(.34,brush*(.0035+rd()*.0040));dctx.beginPath();dctx.moveTo(sx,sy);dctx.quadraticCurveTo((sx+ex)/2+nx*bend,(sy+ey)/2+ny*bend,ex,ey);dctx.stroke()}for(let i=0;i<4;i++){const lane=-.38+rd()*.76,off=lane*brush,along=brush*(-.004+rd()*.028);dctx.globalAlpha=(.08+rd()*.10)*str;dctx.beginPath();dctx.ellipse(p.x+tx*dir*along+nx*off,p.y+ty*dir*along+ny*off,brush*(.004+rd()*.006),brush*(.002+rd()*.004),a+(rd()-.5)*.20,0,Math.PI*2);dctx.fill()}dctx.restore()}
function renderLive(){clearCtx(lctx,live);lctx.save();lctx.setTransform(1,0,0,1,0,0);lctx.globalAlpha=1;lctx.globalCompositeOperation='source-over';lctx.drawImage(body,0,0);lctx.globalCompositeOperation='source-atop';lctx.drawImage(tex,0,0);lctx.globalCompositeOperation='destination-out';lctx.drawImage(dry,0,0);lctx.restore();live.style.opacity=opacity.value/100}
function paintTo(a,b){const dx=b.x-a.x,dy=b.y-a.y,len=Math.hypot(dx,dy);if(len<.05)return;updateAngle(Math.atan2(dy,dx));if(stroke.startAngle===null){stroke.startAngle=stroke.angle;stroke.startPoint={...a};}const brush=+size.value,spacing=clamp(brush*.026,1.0,2.0),n=Math.max(1,Math.ceil(len/spacing));for(let i=1;i<=n;i++){const q=i/n,p={x:a.x+dx*q,y:a.y+dy*q,pressure:a.pressure+(b.pressure-a.pressure)*q};stamp(p,stroke.index++)}textureSegment(a,b);stroke.distance+=len}
function process(p){if(!stroke.last){stroke.last={...p};return}const q=stroke.last;if(Math.hypot(p.x-q.x,p.y-q.y)<.08)return;paintTo(q,p);stroke.last={...p}}
function begin(p){save();clearStrokeLayers();const seed=((performance.now()*1000)|0)^(Math.random()*0xffffffff),brush=+size.value;stroke={last:null,angle:null,startAngle:null,startPoint:null,index:0,distance:0,segment:0,seed,bristles:makeBristles(brush,seed^0x22b9),dryHairs:makeDryHairs(brush,seed^0x77c1),tips:[makeTip(brush,color.value,seed^0x9e37),makeTip(brush,color.value,seed^0x51f2),makeTip(brush,color.value,seed^0xa4c1),makeTip(brush,color.value,seed^0x31b7)]};process(p);live.style.opacity=opacity.value/100}
function commit(){if(!stroke)return;if(stroke.startPoint&&stroke.startAngle!==null)addReferenceEnding(stroke.startPoint,stroke.startAngle,true);if(stroke.last&&stroke.angle!==null)addReferenceEnding(stroke.last,stroke.angle,false);renderLive();pctx.save();pctx.setTransform(1,0,0,1,0,0);pctx.globalAlpha=+opacity.value/100;pctx.drawImage(live,0,0);pctx.restore();clearStrokeLayers()}
live.addEventListener('pointerdown',e=>{e.preventDefault();try{live.setPointerCapture(e.pointerId)}catch(_){}drawing=true;begin(pos(e))});
live.addEventListener('pointermove',e=>{if(!drawing)return;e.preventDefault();const ce=typeof e.getCoalescedEvents==='function'?e.getCoalescedEvents():null,arr=ce&&ce.length?ce:[e];for(const ev of arr)process(pos(ev));renderLive()});
function end(e){if(!drawing)return;e.preventDefault();process(pos(e));drawing=false;commit();stroke=null;try{live.releasePointerCapture(e.pointerId)}catch(_){}}
live.addEventListener('pointerup',end);live.addEventListener('pointercancel',end);live.addEventListener('contextmenu',e=>e.preventDefault());
$('undo').onclick=()=>{clearStrokeLayers();if(!history.length)return;const s=history.pop();pctx.save();pctx.setTransform(1,0,0,1,0,0);pctx.globalAlpha=1;pctx.fillStyle='#fff';pctx.fillRect(0,0,paint.width,paint.height);pctx.drawImage(s,0,0);pctx.restore()};
$('clear').onclick=()=>{save();clearStrokeLayers();pctx.save();pctx.setTransform(1,0,0,1,0,0);pctx.globalAlpha=1;pctx.fillStyle='#fff';pctx.fillRect(0,0,paint.width,paint.height);pctx.restore()};
size.oninput=()=>{$('sizeVal').textContent=size.value};opacity.oninput=()=>{$('opacityVal').textContent=opacity.value+'%';live.style.opacity=opacity.value/100};texture.oninput=()=>{$('textureVal').textContent=texture.value+'%';if(drawing)renderLive()};addEventListener('resize',resize);resize();
})();</script>
</body>
