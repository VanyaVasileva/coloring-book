<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Gouache Brush v20</title>
<style>
:root{--bg:#f5f2eb;--ink:#292721;--line:#d4cdc1}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overscroll-behavior:none}
body{display:grid;grid-template-rows:auto 1fr}
header{background:#fff;border-bottom:1px solid var(--line);padding:9px 12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h1{font:500 17px Georgia,serif;margin:0 8px 0 0}.ctrl{display:flex;align-items:center;gap:6px;font-size:12px}.ctrl input[type=range]{width:108px}
input[type=color]{width:40px;height:34px;padding:2px;border:1px solid var(--line);border-radius:8px;background:#fff}
button{border:1px solid #cfc7bb;background:#fff;border-radius:9px;padding:9px 10px;color:var(--ink);font-size:12px;font-weight:700}
.stage{min-height:0;padding:8px}.wrap{height:100%;background:#fff;box-shadow:0 4px 20px #0001;overflow:hidden;touch-action:none;position:relative}
.layer{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}.paint{z-index:1;background:#fff}.live{z-index:2;background:transparent;cursor:crosshair}.textureLive{z-index:3;background:transparent;pointer-events:none}
@media(max-width:760px){header{gap:7px}.ctrl input[type=range]{width:82px}.stage{padding:6px}}
</style>
</head>
<body>
<header>
<h1>Gouache Brush v20</h1>
<div class="ctrl"><span>Color</span><input id="color" type="color" value="#987459"></div>
<div class="ctrl"><span>Size</span><input id="size" type="range" min="7" max="150" value="60"><strong id="sizeVal">60</strong></div>
<div class="ctrl"><span>Paint</span><input id="opacity" type="range" min="45" max="100" value="100"><strong id="opacityVal">100%</strong></div>
<div class="ctrl"><span>Texture</span><input id="texture" type="range" min="0" max="100" value="80"><strong id="textureVal">80%</strong></div>
<button id="undo">Undo</button><button id="clear">Clear</button>
</header>
<div class="stage"><div class="wrap" id="wrap">
<canvas id="paint" class="layer paint"></canvas>
<canvas id="live" class="layer live"></canvas>
<canvas id="textureLive" class="layer textureLive"></canvas>
</div></div>
<script>(()=>{'use strict';
const $=id=>document.getElementById(id),paint=$('paint'),live=$('live'),textureLive=$('textureLive'),wrap=$('wrap'),size=$('size'),opacity=$('opacity'),texture=$('texture'),color=$('color');
const pctx=paint.getContext('2d',{alpha:false,desynchronized:true}),lctx=live.getContext('2d',{alpha:true,desynchronized:true}),xctx=textureLive.getContext('2d',{alpha:true,desynchronized:true});
let dpr=1,drawing=false,stroke=null,history=[];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function setup(c,transparent){const r=wrap.getBoundingClientRect();c.width=Math.max(1,Math.floor(r.width*dpr));c.height=Math.max(1,Math.floor(r.height*dpr));const x=c.getContext('2d');x.setTransform(dpr,0,0,dpr,0,0);if(!transparent){x.fillStyle='#fff';x.fillRect(0,0,r.width,r.height)}}
function clearCanvas(c,x){x.save();x.setTransform(1,0,0,1,0,0);x.clearRect(0,0,c.width,c.height);x.restore()}
function clearLive(){clearCanvas(live,lctx);clearCanvas(textureLive,xctx)}
function resize(){const old=document.createElement('canvas');old.width=paint.width;old.height=paint.height;if(old.width&&old.height)old.getContext('2d').drawImage(paint,0,0);dpr=Math.max(1,Math.min(2,devicePixelRatio||1));setup(paint,false);setup(live,true);setup(textureLive,true);if(old.width&&old.height){pctx.save();pctx.setTransform(1,0,0,1,0,0);pctx.drawImage(old,0,0,old.width,old.height,0,0,paint.width,paint.height);pctx.restore()}}
function pos(e){const r=live.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top,pressure:e.pressure>0?e.pressure:.5,time:e.timeStamp||performance.now()}}
function snapshot(){const c=document.createElement('canvas');c.width=paint.width;c.height=paint.height;c.getContext('2d').drawImage(paint,0,0);return c}
function save(){history.push(snapshot());if(history.length>10)history.shift()}
function rng(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}
function rgb(hex){return[parseInt(hex.slice(1,3),16),parseInt(hex.slice(3,5),16),parseInt(hex.slice(5,7),16)]}
function shade(hex,p){const[r,g,b]=rgb(hex);return p<0?`rgb(${Math.round(r*(1+p))},${Math.round(g*(1+p))},${Math.round(b*(1+p))})`:`rgb(${Math.round(r+(255-r)*p)},${Math.round(g+(255-g)*p)},${Math.round(b+(255-b)*p)})`}
function makeTip(brush,hex,seed){const rd=rng(seed),W=Math.max(18,Math.round(brush*1.06)),H=Math.max(16,Math.round(brush*.90)),pad=Math.ceil(brush*.14),c=document.createElement('canvas');c.width=W+pad*2;c.height=H+pad*2;const t=c.getContext('2d');t.translate(pad,pad);const wob=()=> (rd()-.5)*brush*.015,r=brush*.085,x0=brush*.025,x1=W-brush*.025,y0=H*.05,y1=H*.95;t.fillStyle=hex;t.globalAlpha=1;t.beginPath();t.moveTo(x0+r+wob(),y0+wob());t.lineTo(x1-r+wob(),y0+wob());t.quadraticCurveTo(x1+wob(),y0+wob(),x1+wob(),y0+r+wob());t.lineTo(x1+wob(),y1-r+wob());t.quadraticCurveTo(x1+wob(),y1+wob(),x1-r+wob(),y1+wob());t.lineTo(x0+r+wob(),y1+wob());t.quadraticCurveTo(x0+wob(),y1+wob(),x0+wob(),y1-r+wob());t.lineTo(x0+wob(),y0+r+wob());t.quadraticCurveTo(x0+wob(),y0+wob(),x0+r+wob(),y0+wob());t.closePath();t.fill();t.globalCompositeOperation='destination-out';for(let i=0;i<24;i++){const top=rd()<.5,x=W*(.04+rd()*.92),y=top?H*(.035+rd()*.055):H*(.91+rd()*.055);t.globalAlpha=.14+rd()*.22;t.beginPath();t.ellipse(x,y,brush*(.003+rd()*.009),brush*(.002+rd()*.0055),0,0,Math.PI*2);t.fill()}for(let side=0;side<2;side++)for(let i=0;i<7;i++){const y=H*(.12+rd()*.76),x=side===0?x0:x1,len=brush*(.014+rd()*.030);t.globalAlpha=.12+rd()*.18;t.lineWidth=Math.max(.35,brush*(.003+rd()*.0025));t.lineCap='round';t.beginPath();t.moveTo(x,y);t.lineTo(x+(side===0?len:-len),y+(rd()-.5)*brush*.012);t.stroke()}t.globalCompositeOperation='source-over';t.globalAlpha=1;return c}
function makeHairs(brush,seed,count,dry=false){const rd=rng(seed),arr=[];for(let i=0;i<count;i++){arr.push({lane:-.38+(count===1?.5:i/(count-1))*.76+(rd()-.5)*.065,width:brush*(dry?.0034+rd()*.0035:.0027+rd()*.0038),alpha:dry?.10+rd()*.07:.06+rd()*.055,tone:dry?.22+rd()*.16:(rd()-.5)*.28,amp1:brush*(.016+rd()*.028),amp2:brush*(.006+rd()*.014),freq1:.008+rd()*.011,freq2:.019+rd()*.014,phase1:rd()*Math.PI*2,phase2:rd()*Math.PI*2,breakFreq:.008+rd()*.010,breakPhase:rd()*Math.PI*2,breakThreshold:dry?-.02+rd()*.12:-.35+rd()*.10})}return arr}
function angleDiff(a,b){let d=b-a;while(d>Math.PI)d-=Math.PI*2;while(d< -Math.PI)d+=Math.PI*2;return d}
function updateAngle(target){if(stroke.angle===null){stroke.angle=target;return}const d=angleDiff(stroke.angle,target);stroke.angle+=clamp(d,-.035,.035)*.38}
function pressureScale(p){return clamp(.975+p*.055,.98,1.035)}
function stamp(p,index){const tip=stroke.tips[index%stroke.tips.length],f=pressureScale(p.pressure),a=stroke.angle??0,nx=-Math.sin(a),ny=Math.cos(a),j=Math.sin(index*1.37+stroke.seed*.001)*Number(size.value)*.0018;lctx.save();lctx.translate(p.x+nx*j,p.y+ny*j);lctx.rotate(a);lctx.scale(f,f);lctx.globalAlpha=1;lctx.globalCompositeOperation='source-over';lctx.drawImage(tip,-tip.width/2,-tip.height/2);lctx.restore()}
function textureStrength(){const v=+texture.value/100;return v<=0?0:.38+Math.pow(v,.74)*.82}
function hairOffset(h,d,brush){return h.lane*brush+Math.sin(d*h.freq1+h.phase1)*h.amp1+Math.sin(d*h.freq2+h.phase2)*h.amp2}
function textureSegment(a,b,s0,s1){const dx=b.x-a.x,dy=b.y-a.y,len=Math.hypot(dx,dy);if(len<.01)return;const nx=-dy/len,ny=dx/len,brush=+size.value,str=textureStrength(),base=color.value,sm=(s0+s1)/2;if(str<=0)return;xctx.save();xctx.lineCap='round';for(const h of stroke.hairs){const gate=Math.sin(sm*h.breakFreq+h.breakPhase);if(gate<h.breakThreshold)continue;const o0=hairOffset(h,s0,brush),o1=hairOffset(h,s1,brush),om=hairOffset(h,sm,brush)+(Math.sin(sm*.015+h.phase2)-.15)*brush*.014;xctx.strokeStyle=shade(base,h.tone);xctx.globalAlpha=h.alpha*str*(.78+.22*Math.abs(gate));xctx.lineWidth=Math.max(.32,h.width);xctx.beginPath();xctx.moveTo(a.x+nx*o0,a.y+ny*o0);xctx.quadraticCurveTo((a.x+b.x)/2+nx*om,(a.y+b.y)/2+ny*om,b.x+nx*o1,b.y+ny*o1);xctx.stroke()}for(const h of stroke.dryHairs){const gate=Math.sin(sm*h.breakFreq+h.breakPhase);if(gate<h.breakThreshold)continue;const o0=hairOffset(h,s0,brush),o1=hairOffset(h,s1,brush),om=hairOffset(h,sm,brush)+Math.cos(sm*.014+h.phase1)*brush*.017;xctx.strokeStyle=shade(base,h.tone);xctx.globalAlpha=h.alpha*str*(.72+.28*Math.abs(gate));xctx.lineWidth=Math.max(.34,h.width);xctx.beginPath();xctx.moveTo(a.x+nx*o0,a.y+ny*o0);xctx.quadraticCurveTo((a.x+b.x)/2+nx*om,(a.y+b.y)/2+ny*om,b.x+nx*o1,b.y+ny*o1);xctx.stroke()}xctx.restore()}
function drawEndHairs(p,a,isStart){if(!p||a===null)return;const tx=Math.cos(a),ty=Math.sin(a),nx=-ty,ny=tx,brush=+size.value,str=textureStrength(),base=color.value,dir=isStart?-1:1,rd=rng((stroke.seed^(isStart?0x3d27:0xb841))>>>0);xctx.save();xctx.lineCap='round';for(let i=0;i<6;i++){const lane=-.37+i*(.74/5)+(rd()-.5)*.035,off=lane*brush,inside=brush*(.13+rd()*.07),outside=brush*(.075+rd()*.12),curve=(rd()-.5)*brush*.050,sx=p.x-tx*dir*inside+nx*off,sy=p.y-ty*dir*inside+ny*off,ex=p.x+tx*dir*outside+nx*(off+(rd()-.5)*brush*.030),ey=p.y+ty*dir*outside+ny*(off+(rd()-.5)*brush*.030);xctx.strokeStyle=shade(base,(rd()-.5)*.20);xctx.globalAlpha=(.38+rd()*.28)*str;xctx.lineWidth=Math.max(.42,brush*(.0038+rd()*.0045));xctx.beginPath();xctx.moveTo(sx,sy);xctx.quadraticCurveTo((sx+ex)/2+nx*curve,(sy+ey)/2+ny*curve,ex,ey);xctx.stroke()}for(let i=0;i<3;i++){const lane=-.30+i*.30+(rd()-.5)*.045,off=lane*brush,inside=brush*(.10+rd()*.06),outside=brush*(.025+rd()*.055),curve=(rd()-.5)*brush*.028,sx=p.x-tx*dir*inside+nx*off,sy=p.y-ty*dir*inside+ny*off,ex=p.x+tx*dir*outside+nx*(off+(rd()-.5)*brush*.020),ey=p.y+ty*dir*outside+ny*(off+(rd()-.5)*brush*.020);xctx.strokeStyle='rgba(255,255,255,.95)';xctx.globalAlpha=(.16+rd()*.12)*str;xctx.lineWidth=Math.max(.38,brush*(.0032+rd()*.0035));xctx.beginPath();xctx.moveTo(sx,sy);xctx.quadraticCurveTo((sx+ex)/2+nx*curve,(sy+ey)/2+ny*curve,ex,ey);xctx.stroke()}xctx.restore()}
function paintTo(a,b){const dx=b.x-a.x,dy=b.y-a.y,len=Math.hypot(dx,dy);if(len<.05)return;updateAngle(Math.atan2(dy,dx));if(stroke.startAngle===null){stroke.startAngle=stroke.angle;stroke.startPoint={...a};}const brush=+size.value,spacing=clamp(brush*.026,1.0,2.0),n=Math.max(1,Math.ceil(len/spacing));for(let i=1;i<=n;i++){const q=i/n,p={x:a.x+dx*q,y:a.y+dy*q,pressure:a.pressure+(b.pressure-a.pressure)*q};stamp(p,stroke.index++)}const s0=stroke.distance;stroke.distance+=len;const texGap=Math.max(2.4,brush*.055);if(!stroke.textureLast){stroke.textureLast={...a,s:s0}}if(stroke.distance-stroke.textureLast.s>=texGap){textureSegment(stroke.textureLast,b,stroke.textureLast.s,stroke.distance);stroke.textureLast={...b,s:stroke.distance}}}
function process(p){if(!stroke.last){stroke.last={...p};return}const q=stroke.last;if(Math.hypot(p.x-q.x,p.y-q.y)<.08)return;paintTo(q,p);stroke.last={...p}}
function begin(p){save();clearLive();const seed=((performance.now()*1000)|0)^(Math.random()*0xffffffff),brush=+size.value;stroke={last:null,angle:null,startAngle:null,startPoint:null,index:0,distance:0,textureLast:null,seed,hairs:makeHairs(brush,seed^0x2ab9,6,false),dryHairs:makeHairs(brush,seed^0x71c1,3,true),tips:[makeTip(brush,color.value,seed^0x9e37),makeTip(brush,color.value,seed^0x51f2),makeTip(brush,color.value,seed^0xa4c1),makeTip(brush,color.value,seed^0x31b7)]};process(p);live.style.opacity=opacity.value/100;textureLive.style.opacity=opacity.value/100}
function commit(){if(!stroke)return;if(stroke.textureLast&&stroke.last&&stroke.distance>stroke.textureLast.s+.2)textureSegment(stroke.textureLast,stroke.last,stroke.textureLast.s,stroke.distance);if(stroke.startPoint&&stroke.startAngle!==null)drawEndHairs(stroke.startPoint,stroke.startAngle,true);if(stroke.last&&stroke.angle!==null)drawEndHairs(stroke.last,stroke.angle,false);pctx.save();pctx.setTransform(1,0,0,1,0,0);pctx.globalAlpha=+opacity.value/100;pctx.drawImage(live,0,0);pctx.drawImage(textureLive,0,0);pctx.restore();clearLive()}
live.addEventListener('pointerdown',e=>{e.preventDefault();try{live.setPointerCapture(e.pointerId)}catch(_){}drawing=true;begin(pos(e))});
live.addEventListener('pointermove',e=>{if(!drawing)return;e.preventDefault();const ce=typeof e.getCoalescedEvents==='function'?e.getCoalescedEvents():null,arr=ce&&ce.length?ce:[e];for(const ev of arr)process(pos(ev))});
function end(e){if(!drawing)return;e.preventDefault();process(pos(e));drawing=false;commit();stroke=null;try{live.releasePointerCapture(e.pointerId)}catch(_){}}
live.addEventListener('pointerup',end);live.addEventListener('pointercancel',end);live.addEventListener('contextmenu',e=>e.preventDefault());
$('undo').onclick=()=>{clearLive();if(!history.length)return;const s=history.pop();pctx.save();pctx.setTransform(1,0,0,1,0,0);pctx.globalAlpha=1;pctx.fillStyle='#fff';pctx.fillRect(0,0,paint.width,paint.height);pctx.drawImage(s,0,0);pctx.restore()};
$('clear').onclick=()=>{save();clearLive();pctx.save();pctx.setTransform(1,0,0,1,0,0);pctx.globalAlpha=1;pctx.fillStyle='#fff';pctx.fillRect(0,0,paint.width,paint.height);pctx.restore()};
size.oninput=()=>{$('sizeVal').textContent=size.value};opacity.oninput=()=>{$('opacityVal').textContent=opacity.value+'%';live.style.opacity=opacity.value/100;textureLive.style.opacity=opacity.value/100};texture.oninput=()=>{$('textureVal').textContent=texture.value+'%'};addEventListener('resize',resize);resize();
})();</script>
</body>
</html>
