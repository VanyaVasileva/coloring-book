<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Acrylic v3 — City Tools & Numbered Colors</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f5f2eb}
#cityBase{display:block;width:100%;height:100%;border:0;background:#f5f2eb}
</style>
</head>
<body>
<iframe id="cityBase" src="./acrylic-v3-city-tools-base.html?v=painted-reference-form-2" title="Acrylic v3 City Tools"></iframe>
<script>
(() => {
  'use strict';

  const host = document.getElementById('cityBase');
  if (!host) return;

  let pollTimer = null;
  const patchedContexts = new WeakSet();
  const tipCache = new WeakMap();
  const stampState = new WeakMap();

  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const smoothstep = (a, b, x) => {
    x = clamp((x - a) / Math.max(0.0001, b - a), 0, 1);
    return x * x * (3 - 2 * x);
  };
  const angleDelta = (a, b) => {
    let v = a - b;
    while (v > Math.PI) v -= Math.PI * 2;
    while (v < -Math.PI) v += Math.PI * 2;
    return Math.abs(v);
  };

  function buildReferenceTip(d, source) {
    const cached = tipCache.get(source);
    if (cached) return cached;

    const sw = source.width | 0;
    const sh = source.height | 0;
    if (sw < 4 || sh < 4 || !source.getContext) return source;

    let src;
    try {
      src = source.getContext('2d', {willReadFrequently: true}).getImageData(0, 0, sw, sh);
    } catch (_) {
      return source;
    }

    let minX = sw, minY = sh, maxX = -1, maxY = -1;
    const sd = src.data;
    for (let y = 0; y < sh; y++) {
      for (let x = 0; x < sw; x++) {
        if (sd[(y * sw + x) * 4 + 3] <= 3) continue;
        minX = Math.min(minX, x);
        minY = Math.min(minY, y);
        maxX = Math.max(maxX, x);
        maxY = Math.max(maxY, y);
      }
    }
    if (maxX < minX || maxY < minY) return source;

    const bodyW = maxX - minX + 1;
    const bodyH = maxY - minY + 1;

    // The supplied reference is a long, thin loaded-brush mark: roughly 4.2:1,
    // with a pointed tail, a fuller middle and a softer rounded leading end.
    const outH = Math.max(16, Math.round(bodyH * 0.90));
    const outW = Math.max(52, Math.round(outH * 4.25));
    const out = d.createElement('canvas');
    out.width = outW;
    out.height = outH;
    const o = out.getContext('2d', {willReadFrequently: true});

    // Stretch the real Acrylic v3 pigment texture into the reference proportions.
    o.drawImage(source, minX, minY, bodyW, bodyH, 0, 0, outW, outH);

    let img;
    try {
      img = o.getImageData(0, 0, outW, outH);
    } catch (_) {
      return source;
    }

    const data = img.data;
    for (let y = 0; y < outH; y++) {
      const yn = y / Math.max(1, outH - 1);
      for (let x = 0; x < outW; x++) {
        const k = (y * outW + x) * 4;
        if (!data[k + 3]) continue;

        const u = x / Math.max(1, outW - 1);

        // Asymmetric silhouette copied from the visual reference:
        // sharp taper on the left, broad middle, softer taper on the right.
        let widthProfile;
        if (u < 0.48) {
          const q = clamp(u / 0.48, 0, 1);
          widthProfile = Math.pow(Math.sin(q * Math.PI * 0.5), 0.78);
        } else {
          const q = clamp((u - 0.48) / 0.52, 0, 1);
          widthProfile = Math.pow(Math.cos(q * Math.PI * 0.5), 0.34);
        }

        // Very slight sweep only; the painted mark itself keeps the reference form.
        const centre = 0.5 + 0.012 * Math.sin((u - 0.10) * Math.PI * 1.55);
        const half = Math.max(0.008, 0.475 * widthProfile);
        const edge = Math.abs(yn - centre) / half;
        const silhouette = 1 - smoothstep(0.87, 1.015, edge);

        // Preserve the original pigment streaks while keeping the body readable.
        const load = 0.82 + 0.16 * widthProfile;
        data[k + 3] = Math.round(data[k + 3] * clamp(silhouette * load, 0, 1));
      }
    }

    o.putImageData(img, 0, 0);
    tipCache.set(source, out);
    return out;
  }

  function patchPaintContext(d, paint) {
    const ctx = paint.getContext('2d', {alpha: true, desynchronized: true});
    if (!ctx || patchedContexts.has(ctx)) return true;

    const nativeDrawImage = ctx.drawImage.bind(ctx);

    ctx.drawImage = function(source, ...args) {
      try {
        // Only replace live Acrylic v3 paint dabs. Undo/history canvases are full-size.
        const isCanvas = source && typeof source.width === 'number' && typeof source.height === 'number';
        const looksLikeTip = isCanvas && args.length === 2 && source.width >= 10 && source.height >= 10 && source.width <= 260 && source.height <= 260;
        if (looksLikeTip) {
          const shaped = buildReferenceTip(d, source);
          const dx = Number(args[0]);
          const dy = Number(args[1]);
          const cx = dx + source.width / 2;
          const cy = dy + source.height / 2;
          const m = typeof ctx.getTransform === 'function' ? ctx.getTransform() : null;
          const px = m ? m.e : NaN;
          const py = m ? m.f : NaN;
          const angle = m ? Math.atan2(m.b, m.a) : 0;

          let state = stampState.get(source);
          if (!state) {
            state = {drawn: 0, lastX: px, lastY: py, lastAngle: angle};
            stampState.set(source, state);
          }

          // The engine draws one dab before it knows stroke direction. Keep that
          // first touch small; the elongated reference form begins once direction exists.
          if (state.drawn === 0) {
            state.drawn = 1;
            state.lastX = px;
            state.lastY = py;
            state.lastAngle = angle;
            const starterW = shaped.width * 0.20;
            const starterH = shaped.height * 0.74;
            return nativeDrawImage(shaped, cx - starterW / 2, cy - starterH / 2, starterW, starterH);
          }

          const travelled = Number.isFinite(px) && Number.isFinite(py) && Number.isFinite(state.lastX) && Number.isFinite(state.lastY)
            ? Math.hypot(px - state.lastX, py - state.lastY)
            : shaped.width;
          const turn = angleDelta(angle, state.lastAngle);

          // This is the important part: do NOT stack a long stamp every few pixels.
          // Let each actual painted impression keep the same long tapered form as
          // the reference image, with only moderate overlap between impressions.
          const normalStep = shaped.width * 0.46;
          if (state.drawn > 1 && travelled < normalStep && turn < 0.26) return;

          let lengthScale = 1;
          if (turn >= 0.26) {
            lengthScale = clamp(travelled / Math.max(1, shaped.width * 0.34), 0.34, 0.82);
          }

          state.drawn++;
          state.lastX = px;
          state.lastY = py;
          state.lastAngle = angle;

          const dw = shaped.width * lengthScale;
          const dh = shaped.height;
          return nativeDrawImage(shaped, cx - dw / 2, cy - dh / 2, dw, dh);
        }
      } catch (_) {}
      return nativeDrawImage(source, ...args);
    };

    patchedContexts.add(ctx);
    d.documentElement.dataset.referencePaintForm = '2';
    return true;
  }

  function tryAttach() {
    let baseDoc, inner, d;
    try {
      baseDoc = host.contentDocument;
      inner = baseDoc && baseDoc.getElementById('app');
      d = inner && inner.contentDocument;
    } catch (_) {
      return false;
    }
    if (!d || !d.documentElement) return false;
    if (d.documentElement.dataset.referencePaintForm === '2') return true;

    const paint = d.getElementById('paint');
    if (!paint || !paint.width || !paint.height) return false;
    return patchPaintContext(d, paint);
  }

  function startAttachLoop() {
    if (pollTimer) clearInterval(pollTimer);
    let tries = 0;
    pollTimer = setInterval(() => {
      tries++;
      if (tryAttach() || tries > 240) {
        clearInterval(pollTimer);
        pollTimer = null;
      }
    }, 40);
  }

  host.addEventListener('load', () => {
    startAttachLoop();
    try {
      const baseDoc = host.contentDocument;
      const inner = baseDoc && baseDoc.getElementById('app');
      if (inner) inner.addEventListener('load', startAttachLoop, {once: true});
    } catch (_) {}
  });

  startAttachLoop();
})();
</script>
<!-- painted brush form only; cursor remains independent -->
</body>
</html>
