<title>Gouache Brush v24</title>
<style>

<body>
<header>
<h1>Gouache Brush v24</h1>
<div class="ctrl"><span>Color</span><input id="color" type="color" value="#987459"></div>
<div class="ctrl"><span>Size</span><input id="size" type="range" min="7" max="150" value="60"><strong id="sizeVal">60</strong></div>

</header>
<div class="stage"><div class="wrap" id="wrap"><canvas id="paint" class="layer paint"></canvas><canvas id="live" class="layer live"></canvas><canvas id="textureLive" class="layer textureLive"></canvas></div></div>
<script>(()=>{'use strict';
const $=id=>document.getElementById(id),paint=$('paint'),live=$('live'),textureLive=$('textureLive'),wrap=$('wrap'),size=$('size'),opacity=$('opacity'),texture=$('texture'),color=$('color');

    const u=.22+rd()*.58,y=y0+(y1-y0)*u,j=Math.max(0,Math.min(N-1,Math.round(u*(N-1)))),edge=x0+cap*(1-L[j]);

function angleDiff(a,b){let d=b-a;while(d>Math.PI)d-=Math.PI*2;while(d< -Math.PI)d+=Math.PI*2;return d}

function textureStrength(){const v=+texture.value/100;return v<=0?0:.42+Math.pow(v,.72)*.92}
function makeBristles(brush,seed){const rd=rng(seed),arr=[];for(let i=0;i<13;i++){arr.push({lane:-.43+(i/12)*.86+(rd()-.5)*.025,width:brush*(.0030+rd()*.0042),alpha:.050+rd()*.070,tone:(rd()-.5)*.30,amp:brush*(.008+rd()*.022),freq:.018+rd()*.022,phase:rd()*Math.PI*2,breakFreq:.010+rd()*.015,breakPhase:rd()*Math.PI*2,breakThreshold:-.20+rd()*.20})}return arr}
function makeDryHairs(brush,seed){const rd=rng(seed),arr=[];for(let i=0;i<7;i++){arr.push({lane:-.42+(i/6)*.84+(rd()-.5)*.035,width:brush*(.0036+rd()*.0040),alpha:.070+rd()*.090,amp:brush*(.010+rd()*.030),freq:.016+rd()*.020,phase:rd()*Math.PI*2,breakFreq:.012+rd()*.018,breakPhase:rd()*Math.PI*2,breakThreshold:-.05+rd()*.24})}return arr}
function laneOffset(h,d,brush){return h.lane*brush+Math.sin(d*h.freq+h.phase)*h.amp}
function textureSegment(a,b,d0,d1){const dx=b.x-a.x,dy=b.y-a.y,len=Math.hypot(dx,dy);if(len<.01)return;const nx=-dy/len,ny=dx/len,brush=+size.value,str=textureStrength(),base=color.value;if(str<=0)return;const dm=(d0+d1)/2;
 xctx.save();xctx.lineCap='round';xctx.globalCompositeOperation='source-over';
 for(let i=0;i<2;i++){const lane=i===0?-.18:.20,off0=lane*brush+Math.sin(d0*.010+i*2.4+stroke.seed*.0007)*brush*.025,off1=lane*brush+Math.sin(d1*.010+i*2.4+stroke.seed*.0007)*brush*.025,offm=(off0+off1)/2+Math.sin(dm*.016+i*1.7)*brush*.018;xctx.strokeStyle=shade(base,i===0?-.075:.085);xctx.globalAlpha=(.030+i*.006)*str;xctx.lineWidth=Math.max(1.2,brush*(.075+i*.015));xctx.beginPath();xctx.moveTo(a.x+nx*off0,a.y+ny*off0);xctx.quadraticCurveTo((a.x+b.x)/2+nx*offm,(a.y+b.y)/2+ny*offm,b.x+nx*off1,b.y+ny*off1);xctx.stroke()}
 for(const h of stroke.bristles){const gate=Math.sin(dm*h.breakFreq+h.breakPhase);if(gate<h.breakThreshold)continue;const o0=laneOffset(h,d0,brush),o1=laneOffset(h,d1,brush),om=laneOffset(h,dm,brush)+Math.sin(dm*h.freq*.63+h.phase*1.31)*h.amp*.75;const along=Math.sin(dm*.021+h.phase)*brush*.025;xctx.strokeStyle=shade(base,h.tone);xctx.globalAlpha=h.alpha*str*(.72+.28*Math.abs(gate));xctx.lineWidth=Math.max(.32,h.width);xctx.beginPath();xctx.moveTo(a.x+nx*o0,a.y+ny*o0);xctx.quadraticCurveTo((a.x+b.x)/2+nx*om+dx/len*along,(a.y+b.y)/2+ny*om+dy/len*along,b.x+nx*o1,b.y+ny*o1);xctx.stroke()}
 for(const h of stroke.dryHairs){const gate=Math.sin(dm*h.breakFreq+h.breakPhase);if(gate<h.breakThreshold)continue;const o0=laneOffset(h,d0,brush),o1=laneOffset(h,d1,brush),om=laneOffset(h,dm,brush)+Math.cos(dm*h.freq*.71+h.phase)*h.amp*.85;const along=Math.cos(dm*.019+h.phase)*brush*.022;xctx.strokeStyle=shade(base,.58);xctx.globalAlpha=h.alpha*str*(.58+.22*Math.abs(gate));xctx.lineWidth=Math.max(.34,h.width);xctx.beginPath();xctx.moveTo(a.x+nx*o0,a.y+ny*o0);xctx.quadraticCurveTo((a.x+b.x)/2+nx*om+dx/len*along,(a.y+b.y)/2+ny*om+dy/len*along,b.x+nx*o1,b.y+ny*o1);xctx.stroke()}
 xctx.restore()}
function paintTo(a,b){const dx=b.x-a.x,dy=b.y-a.y,len=Math.hypot(dx,dy);if(len<.05)return;updateAngle(Math.atan2(dy,dx));if(stroke.startAngle===null){stroke.startAngle=stroke.angle;stroke.startPoint={...a};}const brush=+size.value,spacing=clamp(brush*.026,1.0,2.0),n=Math.max(1,Math.ceil(len/spacing));for(let i=1;i<=n;i++){const q=i/n,p={x:a.x+dx*q,y:a.y+dy*q,pressure:a.pressure+(b.pressure-a.pressure)*q};stamp(p,stroke.index++)}const d0=stroke.distance,d1=d0+len;stroke.distance=d1;const gap=Math.max(2.6,brush*.055);if(d1-stroke.lastTextureDistance>=gap){textureSegment(a,b,d0,d1);stroke.lastTextureDistance=d1}}

function begin(p){save();clearLive();const seed=((performance.now()*1000)|0)^(Math.random()*0xffffffff),brush=+size.value;stroke={last:null,angle:null,startAngle:null,startPoint:null,index:0,distance:0,lastTextureDistance:0,seed,bristles:makeBristles(brush,seed^0x22b9),dryHairs:makeDryHairs(brush,seed^0x77c1),tips:[makeTip(brush,color.value,seed^0x9e37),makeTip(brush,color.value,seed^0x51f2),makeTip(brush,color.value,seed^0xa4c1),makeTip(brush,color.value,seed^0x31b7)]};process(p);live.style.opacity=opacity.value/100;textureLive.style.opacity=opacity.value/100}
function commit(){if(!stroke)return;pctx.save();pctx.setTransform(1,0,0,1,0,0);pctx.globalAlpha=+opacity.value/100;pctx.drawImage(live,0,0);pctx.drawImage(textureLive,0,0);pctx.restore();clearLive()}
live.addEventListener('pointerdown',e=>{e.preventDefault();try{live.setPointerCapture(e.pointerId)}catch(_){}drawing=true;begin(pos(e))});

$('clear').onclick=()=>{save();clearLive();pctx.save();pctx.setTransform(1,0,0,1,0,0);pctx.globalAlpha=1;pctx.fillStyle='#fff';pctx.fillRect(0,0,paint.width,paint.height);pctx.restore()};
size.oninput=()=>{$('sizeVal').textContent=size.value};opacity.oninput=()=>{$('opacityVal').textContent=opacity.value+'%';live.style.opacity=opacity.value/100;textureLive.style.opacity=opacity.value/100};texture.oninput=()=>{$('textureVal').textContent=texture.value+'%'};addEventListener('resize',resize);resize();
})();</script>
