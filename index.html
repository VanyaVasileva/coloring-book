<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Coloring Demo</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    background: #f6f4f0; color: #2a2620; min-height: 100vh; min-height: 100dvh;
    display: flex; flex-direction: column; touch-action: none; overscroll-behavior: none;
  }
  header { padding: 14px 16px 10px; border-bottom: 1px solid #e5e1d8; }
  h1 { margin: 0 0 4px; font-size: 18px; }
  .sub { color: #8a8375; font-size: 12px; }

  .variantToggle { display: flex; gap: 8px; padding: 10px 16px; }
  .variantToggle button { flex: 1; font-size: 13px; padding: 9px; border-radius: 8px; border: 1px solid #d8d3c6; background: #fff; }
  .variantToggle button.active { background: #2a2620; color: #fff; border-color: #2a2620; }

  main { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 0 16px 16px; gap: 14px; }
  .canvas-wrap { position: relative; touch-action: none; max-width: 100%; }
  canvas { display: block; max-width: 100%; height: auto; touch-action: none; border: 1px solid #e5e1d8; border-radius: 8px; background: #fff; }

  .palette { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; max-width: 480px; }
  .swatch {
    width: 40px; height: 40px; border-radius: 8px; border: 2px solid #d8d3c6;
    display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600;
    cursor: pointer; color: rgba(0,0,0,.55);
  }
  .swatch.active { border-color: #2a2620; border-width: 3px; }

  .row { display: flex; gap: 10px; }
  button.reset { font-size: 13px; padding: 9px 14px; border-radius: 8px; border: 1px solid #d8d3c6; background: #fff; }
</style>
</head>
<body>

<header>
  <h1>Coloring Demo — Paint With Your Hand</h1>
  <div class="sub">Pick a number/color, then drag your finger inside the matching region. Color stays inside the lines automatically.</div>
</header>

<div class="variantToggle">
  <button id="naturalBtn" class="active">Natural regions</button>
  <button id="mergedBtn">Merged legs</button>
</div>

<main>
  <div class="canvas-wrap">
    <canvas id="canvas"></canvas>
  </div>
  <div class="palette" id="palette"></div>
  <div class="row">
    <button class="reset" id="resetBtn">Clear coloring</button>
  </div>
</main>

let currentVariant = 'natural';
let selectedRegion = null;
let coloredData = null; // ImageData holding the user's painted colors, native resolution
let W = 0, H = 0;
let regionColors = {}; // user-picked color per region id, shared across variants for simplicity

const PALETTE_COLORS = ['#e8735c','#f2b84b','#7cb37c','#5b9bd5','#a37cc9','#e8a0c4','#8a6a4f','#6bbfb0','#d4d46a','#c97b9e'];

function loadImageFromB64(b64) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.src = 'data:image/png;base64,' + b64;
  });
}

async function init() {
  lineartImg = await loadImageFromB64(LINEART_B64);
  W = lineartImg.naturalWidth; H = lineartImg.naturalHeight;
  canvas.width = W; canvas.height = H;

  const naturalImg = await loadImageFromB64(NATURAL_B64);
  const mergedImg = await loadImageFromB64(MERGED_B64);
  regionData.natural = extractRegionIds(naturalImg);
  regionData.merged = extractRegionIds(mergedImg);

  coloredData = ctx.createImageData(W, H);
  fillWhite(coloredData);

  buildPalette();
  render();
}

function extractRegionIds(img) {
  const off = document.createElement('canvas');
  off.width = img.naturalWidth; off.height = img.naturalHeight;
  const octx = off.getContext('2d');
  octx.drawImage(img, 0, 0);
  const data = octx.getImageData(0, 0, off.width, off.height).data;
  const ids = new Uint8Array(off.width * off.height);
  for (let i = 0; i < ids.length; i++) {
    ids[i] = data[i * 4]; // region id was encoded directly in the R channel
  }
  return ids;
}

function fillWhite(imageData) {
  for (let i = 0; i < imageData.data.length; i += 4) {
    imageData.data[i] = 255; imageData.data[i+1] = 255; imageData.data[i+2] = 255; imageData.data[i+3] = 255;
  }
}

function buildPalette() {
  const ids = Array.from(new Set(regionData[currentVariant])).filter(id => id > 0).sort((a,b) => a-b);
  palette.innerHTML = '';
  ids.forEach((id, i) => {
    if (!regionColors[id]) regionColors[id] = PALETTE_COLORS[i % PALETTE_COLORS.length];
    const sw = document.createElement('div');
    sw.className = 'swatch';
    sw.style.background = regionColors[id];
    sw.textContent = i + 1;
    sw.onclick = () => {
      selectedRegion = id;
      document.querySelectorAll('.swatch').forEach(s => s.classList.remove('active'));
      sw.classList.add('active');
    };
    palette.appendChild(sw);
  });
}

function render() {
  ctx.putImageData(coloredData, 0, 0);
  ctx.drawImage(lineartImg, 0, 0, W, H);
}

document.getElementById('naturalBtn').onclick = () => switchVariant('natural');
document.getElementById('mergedBtn').onclick = () => switchVariant('merged');
function switchVariant(v) {
  currentVariant = v;
  document.getElementById('naturalBtn').classList.toggle('active', v === 'natural');
  document.getElementById('mergedBtn').classList.toggle('active', v === 'merged');
  selectedRegion = null;
  buildPalette();
}

document.getElementById('resetBtn').onclick = () => {
  fillWhite(coloredData);
  render();
};

// Painting — brush stays inside the CURRENTLY SELECTED region even if the
// finger strays slightly outside its true boundary, checking each pixel
// within the brush individually rather than just the center point.
let painting = false;
const BRUSH_RADIUS = Math.max(4, Math.round(W * 0.02));

function getCanvasPoint(e) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = W / rect.width, scaleY = H / rect.height;
  const clientX = e.touches ? e.touches[0].clientX : e.clientX;
  const clientY = e.touches ? e.touches[0].clientY : e.clientY;
  return { x: Math.round((clientX - rect.left) * scaleX), y: Math.round((clientY - rect.top) * scaleY) };
}

function paintAt(x, y) {
  if (selectedRegion === null) return;
  const ids = regionData[currentVariant];
  const color = hexToRgb(regionColors[selectedRegion]);
  for (let dy = -BRUSH_RADIUS; dy <= BRUSH_RADIUS; dy++) {
    for (let dx = -BRUSH_RADIUS; dx <= BRUSH_RADIUS; dx++) {
      if (dx*dx + dy*dy > BRUSH_RADIUS*BRUSH_RADIUS) continue;
      const px = x + dx, py = y + dy;
      if (px < 0 || py < 0 || px >= W || py >= H) continue;
      const idx = py * W + px;
      if (ids[idx] !== selectedRegion) continue; // the actual containment check, per-pixel
      const di = idx * 4;
      coloredData.data[di] = color.r;
      coloredData.data[di+1] = color.g;
      coloredData.data[di+2] = color.b;
      coloredData.data[di+3] = 255;
    }
  }
}

function hexToRgb(hex) {
  const n = parseInt(hex.slice(1), 16);
  return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
}

canvas.addEventListener('pointerdown', (e) => {
  painting = true;
  const p = getCanvasPoint(e);
  paintAt(p.x, p.y);
  render();
});
canvas.addEventListener('pointermove', (e) => {
  if (!painting) return;
  const p = getCanvasPoint(e);
  paintAt(p.x, p.y);
  render();
});
window.addEventListener('pointerup', () => { painting = false; });
window.addEventListener('pointercancel', () => { painting = false; });

init();
</script>
</body>
</html>
