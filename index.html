<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Color Sketchbook Fish</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}html,body{margin:0;background:#f7f4ed;color:#292721;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{padding:12px 15px;background:#fff;border-bottom:1px solid #d8d1c5;display:flex;justify-content:space-between;align-items:center}h1{font:500 20px Georgia,serif;margin:0}button{border:1px solid #cec7bb;background:#fff;border-radius:9px;padding:9px 11px;font-size:13px}main{display:grid;grid-template-columns:205px minmax(0,1fr) 245px;min-height:calc(100vh - 58px)}aside{padding:14px}.stage{padding:14px;display:flex;justify-content:center;align-items:flex-start}.shell{position:relative;width:min(100%,850px);background:#fff;overflow:hidden;line-height:0}#guide{position:relative;width:100%;height:auto;display:block;pointer-events:none;-webkit-user-drag:none}#paint{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}.label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;margin:14px 0 7px}.palette{display:grid;grid-template-columns:1fr 1fr;gap:7px}.swatch{height:48px;border:1px solid #cfc7ba;border-radius:9px;font-weight:700}.swatch.selected{outline:3px solid #292721;outline-offset:2px}input[type=range]{width:100%}.hidden{display:none}.pill{font-size:12px;background:#fff;border:1px solid #d8d1c5;border-radius:8px;padding:8px;margin-top:8px;line-height:1.4}@media(max-width:900px){main{grid-template-columns:1fr}.stage{order:1;padding:8px}aside{order:2;border-top:1px solid #d8d1c5}}</style></head><body><header><h1>Color Sketchbook — Fish</h1><div><button id="refBtn">Reference</button> <button id="exportBtn">Export</button></div></header><main><aside><div class="label">Traditional Acrylic</div><div class="label">Brush size</div><input id="size" type="range" min="8" max="100" value="36"><div class="label">Opacity</div><input id="opacity" type="range" min="40" max="100" value="96"><div class="label">Actions</div><button id="undo">Undo</button> <button id="clear">Clear</button><div id="status" class="pill">Loading…</div></aside><section class="stage"><div class="shell" id="shell"><img id="guide" draggable="false" src="fish-numbered-guide.png"><canvas id="paint"></canvas></div></section><aside><div class="label">Palette</div><div id="palette" class="palette"></div><img id="reference" class="hidden" style="width:100%;height:auto;margin-top:14px" draggable="false" src="fish-reference.png"></aside></main><img class="hidden" id="mask1" src="mask-1.png"><img class="hidden" id="mask2" src="mask-2.png"><img class="hidden" id="mask3" src="mask-3.png"><img class="hidden" id="mask4" src="mask-4.png"><img class="hidden" id="mask5" src="mask-5.png"><img class="hidden" id="mask6" src="mask-6.png"><script>const guide=document.getElementById('guide'),c=document.getElementById('paint'),ctx=c.getContext('2d'),work=document.createElement('canvas'),wctx=work.getContext('2d'),mc=document.createElement('canvas'),mctx=mc.getContext('2d'),status=document.getElementById('status');const colors=[['Sage','#94A684'],['Coral','#D17563'],['Soft Pink','#F1D5D3'],['Light Details','#F1D5D3'],['Apricot','#E5B887'],['Charcoal','#111111']];let W=1,H=1,selected=2,drawing=false,last=null,history=[];async function init(){let imgs=[guide,...[1,2,3,4,5,6].map(n=>document.getElementById('mask'+n))];await Promise.all(imgs.map(i=>i.decode().catch(()=>{})));W=guide.naturalWidth;H=guide.naturalHeight;c.width=work.width=mc.width=W;c.height=work.height=mc.height=H;document.getElementById('shell').style.aspectRatio=W+'/'+H;status.textContent='Ready — '+W+' × '+H;}init();function pnt(e){let r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}function drawMask(n,x){let im=document.getElementById('mask'+n);x.drawImage(im,0,0,W,H)}function hit(n,p){mctx.clearRect(0,0,W,H);drawMask(n,mctx);return mctx.getImageData(Math.max(0,Math.min(W-1,p.x|0)),Math.max(0,Math.min(H-1,p.y|0)),1,1).data[3]>20}function snap(){history.push(ctx.getImageData(0,0,W,H));if(history.length>12)history.shift()}function stamp(p){let r=+size.value/2;wctx.clearRect(0,0,W,H);wctx.globalCompositeOperation='source-over';wctx.globalAlpha=+opacity.value/100;wctx.fillStyle=colors[selected-1][1];wctx.beginPath();wctx.arc(p.x,p.y,r,0,Math.PI*2);wctx.fill();wctx.globalAlpha=1;wctx.globalCompositeOperation='destination-in';drawMask(selected,wctx);wctx.globalCompositeOperation='source-over';ctx.drawImage(work,0,0)}function line(a,b){let d=Math.hypot(b.x-a.x,b.y-a.y),n=Math.max(1,Math.ceil(d/Math.max(2,+size.value*.18)));for(let i=0;i<=n;i++){let q=i/n;stamp({x:a.x+(b.x-a.x)*q,y:a.y+(b.y-a.y)*q})}}c.addEventListener('pointerdown',e=>{e.preventDefault();let p=pnt(e);if(!hit(selected,p)){status.textContent='Start inside number '+selected+'.';return}snap();drawing=true;last=p;c.setPointerCapture(e.pointerId);stamp(p)},{passive:false});c.addEventListener('pointermove',e=>{e.preventDefault();if(!drawing)return;let p=pnt(e);line(last,p);last=p},{passive:false});c.addEventListener('pointerup',e=>{drawing=false;last=null;e.preventDefault()},{passive:false});c.addEventListener('pointercancel',()=>{drawing=false;last=null});c.addEventListener('contextmenu',e=>e.preventDefault());document.addEventListener('gesturestart',e=>e.preventDefault(),{passive:false});let pal=document.getElementById('palette');colors.forEach((x,i)=>{let n=i+1,b=document.createElement('button');b.className='swatch'+(n===2?' selected':'');b.style.background=x[1];b.textContent=n+' '+x[0];b.onclick=()=>{selected=n;document.querySelectorAll('.swatch').forEach(z=>z.classList.remove('selected'));b.classList.add('selected');status.textContent='Selected '+n};pal.appendChild(b)});undo.onclick=()=>{if(history.length)ctx.putImageData(history.pop(),0,0)};clear.onclick=()=>{snap();ctx.clearRect(0,0,W,H)};refBtn.onclick=()=>reference.classList.toggle('hidden');exportBtn.onclick=()=>{let o=document.createElement('canvas');o.width=W;o.height=H;let x=o.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,W,H);x.drawImage(guide,0,0,W,H);x.drawImage(c,0,0);let a=document.createElement('a');a.download='fish-colored.png';a.href=o.toDataURL('image/png');a.click()};</script></body></html>
