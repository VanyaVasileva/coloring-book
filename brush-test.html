<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Painted Acrylic Brush Test</title>
<style>
:root{--bg:#f5f2eb;--ink:#292721;--line:#d4cdc1}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overscroll-behavior:none}
header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);padding:9px 12px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
h1{font:500 17px Georgia,serif;margin:0}.tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
button,input{font:inherit}button{border:1px solid #cfc7bb;background:#fff;border-radius:9px;padding:9px 10px;color:var(--ink);font-size:12px;font-weight:700}button.active{background:var(--ink);color:#fff;border-color:var(--ink)}
main{display:grid;grid-template-columns:minmax(0,1fr) 240px;gap:0;min-height:calc(100dvh - 58px)}
.stage{display:flex;justify-content:center;align-items:flex-start;padding:10px;overflow:hidden}.viewport{position:relative;overflow:hidden;background:#fff;box-shadow:0 4px 20px #0001;touch-action:none;user-select:none}.shell{position:absolute;inset:0;transform-origin:0 0}.layer{position:absolute;inset:0;width:100%;height:100%;display:block}
#paint{z-index:1;touch-action:none;cursor:crosshair}#guide{z-index:2;pointer-events:none;mix-blend-mode:multiply}
aside{border-left:1px solid var(--line);background:#ffffffb8;padding:12px;overflow:auto}.label{font-size:10px;text-transform:uppercase;letter-spacing:.09em;font-weight:800;color:#716b62;margin:12px 0 6px}.row{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:11px}.pill{background:#fff;border:1px solid var(--line);border-radius:9px;padding:9px;font-size:12px;line-height:1.4}.brush{font-weight:800}.sw{width:100%;height:38px;border:1px solid var(--line);border-radius:8px;padding:2px;background:#fff}input[type=range]{width:100%}
@media(max-width:760px){main{grid-template-columns:1fr}.stage{padding:7px}aside{border-left:0;border-top:1px solid var(--line);padding-bottom:90px}header{position:relative}.tools button{min-height:42px}}
</style>
</head>
<body>
<header><h1>Painted Acrylic Brush Test</h1><div class="tools"><button id="paintBtn" class="active">🖌️ Paint</button><button id="moveBtn">✋ Move</button><button id="eraseBtn">🧼 Erase</button><button id="zoomOut">−</button><button id="zoomIn">+</button><button id="undo">Undo</button><button id="clear">Clear</button></div></header>
<main>
<section class="stage" id="stage"><div class="viewport" id="viewport"><div class="shell" id="shell"><canvas id="paint" class="layer"></canvas><canvas id="guide" class="layer"></canvas></div></div></section>
<aside>
<div class="pill"><span class="brush">Painted Acrylic v2</span><br>Opaque paint body with dragged dry streaks, scuffed edges and layered buildup — closer to the reference painting.</div>
<div class="label">Brush size</div><div class="row"><span>Size</span><strong id="sizeVal">44</strong></div><input id="size" type="range" min="7" max="120" value="44">
<div class="label">Opacity</div><div class="row"><span>Paint</span><strong id="opacityVal">100%</strong></div><input id="opacity" type="range" min="25" max="100" value="100">
<div class="label">Color</div><input id="color" class="sw" type="color" value="#D94D74">
<div class="label">Sketch opacity</div><div class="row"><span>Guide</span><strong id="guideVal">78%</strong></div><input id="guideOpacity" type="range" min="0" max="100" value="78">
<div class="label">Status</div><div id="status" class="pill">Loading city artwork…</div>
</aside>
</main>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),stage=$('stage'),viewport=$('viewport'),shell=$('shell'),guide=$('guide'),paint=$('paint'),gctx=guide.getContext('2d'),ctx=paint.getContext('2d',{alpha:true,desynchronized:true});
const size=$('size'),opacity=$('opacity'),color=$('color'),status=$('status');
let W=1000,H=1417,tool='paint',scale=1,tx=0,ty=0,active=new Map(),mode=null,stroke=null,gesture=null,pan=null,history=[];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),mid=p=>({x:(p[0].x+p[1].x)/2,y:(p[0].y+p[1].y)/2}),dist=p=>Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);
function pos(e){const r=paint.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height,pressure:e.pressure>0?e.pressure:.5,time:e.timeStamp||performance.now()};}
function fit(){const header=document.querySelector('header').getBoundingClientRect().height,side=innerWidth>760?240:0,aw=Math.max(260,innerWidth-side-20),ah=innerWidth<=760?Math.max(390,Math.min(innerHeight*.67,700)):Math.max(390,innerHeight-header-20),ar=W/H;let vw=Math.min(aw,950),vh=vw/ar;if(vh>ah){vh=ah;vw=vh*ar}viewport.style.width=vw+'px';viewport.style.height=vh+'px';clampPan();apply();}
function apply(){shell.style.transform=`translate(${tx}px,${ty}px) scale(${scale})`}
function clampPan(){const r=viewport.getBoundingClientRect();tx=clamp(tx,Math.min(0,r.width-r.width*scale),0);ty=clamp(ty,Math.min(0,r.height-r.height*scale),0)}
function zoom(next,cx,cy){const r=viewport.getBoundingClientRect(),ax=(cx??r.left+r.width/2)-r.left,ay=(cy??r.top+r.height/2)-r.top,b=scale;scale=clamp(next,1,6);tx=ax-(ax-tx)*(scale/b);ty=ay-(ay-ty)*(scale/b);clampPan();apply()}
function snapshot(){const c=document.createElement('canvas');c.width=W;c.height=H;c.getContext('2d').drawImage(paint,0,0);return c}function save(){history.push(snapshot());if(history.length>8)history.shift()}
function seedRandom(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}
function rgba(hex,a){const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return`rgba(${r},${g},${b},${a})`}
function makeTip(brush,hex,seed){
  const rnd=seedRandom(seed),L=Math.max(18,Math.round(brush*.88)),B=Math.max(18,Math.round(brush*1.05)),pad=Math.ceil(brush*.16),c=document.createElement('canvas');c.width=L+pad*2;c.height=B+pad*2;const t=c.getContext('2d');
  t.translate(pad,pad);t.fillStyle=rgba(hex,1);t.beginPath();
  const wob=()=> (rnd()-.5)*brush*.05;
  t.moveTo(brush*.08+wob(),B*.10+wob());t.quadraticCurveTo(L*.45,B*.00+wob(),L-brush*.08+wob(),B*.12+wob());t.quadraticCurveTo(L+wob(),B*.50,L-brush*.09+wob(),B*.88+wob());t.quadraticCurveTo(L*.52,B+wob(),brush*.07+wob(),B*.89+wob());t.quadraticCurveTo(-wob(),B*.50,brush*.08+wob(),B*.10+wob());t.closePath();t.fill();
  t.globalCompositeOperation='destination-out';
  const longCount=4+Math.floor(rnd()*3);
  for(let i=0;i<longCount;i++){
    const y=B*(.15+rnd()*.70),amp=(rnd()-.5)*brush*.10;t.strokeStyle=`rgba(0,0,0,${.12+rnd()*.19})`;t.lineWidth=Math.max(.8,brush*(.018+rnd()*.030));t.lineCap='round';t.beginPath();t.moveTo(L*.03,y);t.bezierCurveTo(L*.28,y+amp,L*.68,y-amp*.7,L*.98,y+amp*.2);t.stroke();
  }
  const scratchCount=8+Math.floor(rnd()*8);
  for(let i=0;i<scratchCount;i++){
    const y=B*(.08+rnd()*.84),x=L*(.04+rnd()*.72),len=L*(.10+rnd()*.28);t.strokeStyle=`rgba(0,0,0,${.10+rnd()*.18})`;t.lineWidth=Math.max(.55,brush*(.007+rnd()*.016));t.beginPath();t.moveTo(x,y);t.lineTo(Math.min(L*.98,x+len),y+(rnd()-.5)*brush*.035);t.stroke();
  }
  for(let i=0;i<12;i++){
    const top=rnd()<.5,y=top?B*(.04+rnd()*.08):B*(.88+rnd()*.08),x=L*(.06+rnd()*.88),rx=brush*(.025+rnd()*.055),ry=brush*(.018+rnd()*.045);t.fillStyle=`rgba(0,0,0,${.18+rnd()*.34})`;t.beginPath();t.ellipse(x,y,rx,ry,0,0,Math.PI*2);t.fill();
  }
  return{canvas:c,L,B,pad};
}
function pf(p){return clamp(.88+(p?.pressure??.5)*.24,.90,1.12)}
function smooth(raw){if(!stroke.filtered){stroke.filtered={...raw};return{...raw}}const dx=raw.x-stroke.filtered.x,dy=raw.y-stroke.filtered.y,speed=Math.hypot(dx,dy),follow=clamp(.80+speed/260,.80,.96);stroke.filtered.x+=dx*follow;stroke.filtered.y+=dy*follow;stroke.filtered.pressure=raw.pressure;stroke.filtered.time=raw.time;return{...stroke.filtered}}
function stamp(p,angle,alphaScale=1){const tip=stroke.tip,f=pf(p);ctx.save();ctx.translate(p.x,p.y);ctx.rotate(angle);ctx.scale(f,f);ctx.globalCompositeOperation='source-over';ctx.globalAlpha=(+opacity.value/100)*.56*alphaScale;ctx.drawImage(tip.canvas,-tip.canvas.width/2,-tip.canvas.height/2);ctx.restore()}
function stampDot(p){stamp(p,stroke.angle||0,1.25)}
function acrylic(a,b){const dx=b.x-a.x,dy=b.y-a.y,len=Math.hypot(dx,dy);if(len<.08)return;const angle=Math.atan2(dy,dx),brush=+size.value,dt=Math.max(1,(b.time||0)-(a.time||0)),velocity=len/dt,spacing=brush*clamp(.12+velocity*.11,.12,.24),count=Math.max(1,Math.ceil(len/spacing));stroke.angle=angle;for(let i=1;i<=count;i++){const q=i/count;stamp({x:a.x+dx*q,y:a.y+dy*q,pressure:a.pressure+(b.pressure-a.pressure)*q},angle,1)}}
function erase(a,b){ctx.save();ctx.globalCompositeOperation='destination-out';ctx.globalAlpha=.92;ctx.lineCap='round';ctx.lineJoin='round';ctx.lineWidth=(+size.value)*.88*pf(b);ctx.strokeStyle='#000';ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();ctx.restore()}
function eraseDot(p){ctx.save();ctx.globalCompositeOperation='destination-out';ctx.globalAlpha=.92;ctx.beginPath();ctx.arc(p.x,p.y,(+size.value)*.44*pf(p),0,Math.PI*2);ctx.fill();ctx.restore()}
function draw(raw){const p=smooth(raw);if(!stroke.last){stroke.last={...p};tool==='erase'?eraseDot(p):stampDot(p);return}const q=stroke.last;if(Math.hypot(p.x-q.x,p.y-q.y)<.10)return;tool==='erase'?erase(q,p):acrylic(q,p);stroke.last={...p}}
function begin(p){save();mode='draw';const seed=((performance.now()*1000)|0)^(Math.random()*0xffffffff);stroke={last:null,filtered:null,angle:0,tip:makeTip(+size.value,color.value,seed)};draw(p)}
function setTool(t){tool=t;mode=null;stroke=null;[$('paintBtn'),$('moveBtn'),$('eraseBtn')].forEach(b=>b.classList.remove('active'));$(t==='paint'?'paintBtn':t==='move'?'moveBtn':'eraseBtn').classList.add('active');paint.style.cursor=t==='move'?'grab':'crosshair';status.textContent=t==='move'?'Move mode — drag to pan; pinch or +/- to zoom.':t==='erase'?'Erase mode.':'Painted Acrylic v2 active — broad paint body with dry dragged texture.'}
paint.addEventListener('pointerdown',e=>{e.preventDefault();try{paint.setPointerCapture(e.pointerId)}catch(_){}active.set(e.pointerId,{x:e.clientX,y:e.clientY});if(active.size>=2){if(mode==='draw'&&history.length){const s=history.pop();ctx.clearRect(0,0,W,H);ctx.drawImage(s,0,0)}const p=[...active.values()].slice(0,2);mode='gesture';stroke=null;gesture={d:dist(p),m:mid(p),s:scale,x:tx,y:ty};return}if(tool==='move'){mode='pan';pan={x:e.clientX,y:e.clientY,tx,ty};return}begin(pos(e))});
paint.addEventListener('pointermove',e=>{if(!active.has(e.pointerId))return;active.set(e.pointerId,{x:e.clientX,y:e.clientY});if(active.size>=2&&mode!=='gesture'){const p=[...active.values()].slice(0,2);if(mode==='draw'&&history.length){const s=history.pop();ctx.clearRect(0,0,W,H);ctx.drawImage(s,0,0)}mode='gesture';stroke=null;gesture={d:dist(p),m:mid(p),s:scale,x:tx,y:ty}}if(mode==='gesture'&&active.size>=2){const p=[...active.values()].slice(0,2),nd=dist(p),nm=mid(p),ns=clamp(gesture.s*nd/Math.max(1,gesture.d),1,6),f=ns/gesture.s,r=viewport.getBoundingClientRect();scale=ns;tx=(nm.x-r.left)-((gesture.m.x-r.left)-gesture.x)*f;ty=(nm.y-r.top)-((gesture.m.y-r.top)-gesture.y)*f;clampPan();apply();return}if(mode==='pan'&&active.size===1){tx=pan.tx+(e.clientX-pan.x);ty=pan.ty+(e.clientY-pan.y);clampPan();apply();return}if(mode==='draw'&&active.size===1){const ce=typeof e.getCoalescedEvents==='function'?e.getCoalescedEvents():null,arr=ce&&ce.length?ce:[e];for(const ev of arr)draw(pos(ev))}});
function end(e){active.delete(e.pointerId);try{paint.releasePointerCapture(e.pointerId)}catch(_){}if(mode==='gesture'&&active.size===1){mode='hold';return}if(active.size===0){mode=null;stroke=null;gesture=null;pan=null}}paint.addEventListener('pointerup',end);paint.addEventListener('pointercancel',end);
$('paintBtn').onclick=()=>setTool('paint');$('moveBtn').onclick=()=>setTool('move');$('eraseBtn').onclick=()=>setTool('erase');$('zoomIn').onclick=()=>zoom(scale*1.35);$('zoomOut').onclick=()=>zoom(scale/1.35);$('clear').onclick=()=>{save();ctx.clearRect(0,0,W,H)};$('undo').onclick=()=>{if(!history.length)return;const s=history.pop();ctx.clearRect(0,0,W,H);ctx.drawImage(s,0,0)};
size.oninput=()=>$('sizeVal').textContent=size.value;opacity.oninput=()=>$('opacityVal').textContent=opacity.value+'%';$('guideOpacity').oninput=e=>{guide.style.opacity=e.target.value/100;$('guideVal').textContent=e.target.value+'%'};
async function init(){const res=await fetch('./index.html',{cache:'no-store'});if(!res.ok)throw new Error('Could not load index.html');const text=await res.text(),doc=new DOMParser().parseFromString(text,'text/html'),src=doc.querySelector('#guide')?.getAttribute('src');if(!src)throw new Error('Guide image not found');const im=new Image();await new Promise((ok,bad)=>{im.onload=ok;im.onerror=bad;im.src=src});W=im.naturalWidth||1000;H=im.naturalHeight||1417;guide.width=paint.width=W;guide.height=paint.height=H;gctx.drawImage(im,0,0,W,H);guide.style.opacity=.78;fit();setTool('paint');status.textContent='Painted Acrylic v2 ready — test one broad stroke and then layer a second pass over it.'}
addEventListener('resize',fit);init().catch(e=>{status.textContent='Could not load city artwork.';console.error(e)});
})();
</script>
</body>
</html>
