<header><h1>Translucent Pigment Acrylic v3</h1><div class="tools"><button id="paintBtn" class="active">🖌️ Paint</button><button id="moveBtn">✋ Move</button><button id="eraseBtn">🧼 Erase</button><button id="zoomOut">−</button><button id="zoomIn">+</button><button id="undo">Undo</button><button id="clear">Clear</button></div></header>

<script>(()=>{'use strict';
const $=id=>document.getElementById(id),stage=$('stage'),viewport=$('viewport'),shell=$('shell'),guide=$('guide'),paint=$('paint'),gctx=guide.getContext('2d'),ctx=paint.getContext('2d',{alpha:true,desynchronized:true}),size=$('size'),opacity=$('opacity'),color=$('color'),status=$('status');

async function init(){const res=await fetch('./index.html',{cache:'no-store'});if(!res.ok)throw new Error('Could not load index.html');const text=await res.text(),doc=new DOMParser().parseFromString(text,'text/html'),src=doc.querySelector('#guide')?.getAttribute('src');if(!src)throw new Error('Guide image not found');const im=new Image();await new Promise((ok,bad)=>{im.onload=ok;im.onerror=bad;im.src=src});W=im.naturalWidth||1000;H=im.naturalHeight||1417;guide.width=paint.width=W;guide.height=paint.height=H;gctx.drawImage(im,0,0,W,H);guide.style.opacity=.72;fit();setTool('paint');status.textContent='Acrylic v3 ready — continuous mask join test.'}addEventListener('resize',fit);init().catch(e=>{status.textContent='Could not load city artwork.';console.error(e)});
