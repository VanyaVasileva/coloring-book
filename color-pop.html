<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Color Pop</title>
<style>
:root{
  --cream:#fff8ef;
  --ink:#2f2b2a;
  --soft:#fffdf9;
  --line:#eadfd3;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;min-height:100%;background:var(--cream);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden;touch-action:manipulation}
body{min-height:100dvh}
button{font:inherit}
.app{position:relative;width:100vw;height:100dvh;overflow:hidden;background:
  radial-gradient(circle at 12% 10%,#ffe7d8 0 8%,transparent 8.4%),
  radial-gradient(circle at 88% 18%,#dff4ec 0 7%,transparent 7.4%),
  radial-gradient(circle at 8% 82%,#e9e3ff 0 9%,transparent 9.4%),
  radial-gradient(circle at 92% 86%,#fff0ad 0 8%,transparent 8.4%),
  linear-gradient(180deg,#fffaf3,#fff6eb 58%,#fff8f1)}
header{position:relative;z-index:10;display:flex;align-items:center;justify-content:space-between;padding:max(14px,env(safe-area-inset-top)) 18px 8px;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:clamp(20px,4vw,30px);letter-spacing:-.04em}
.brandDot{width:24px;height:24px;border-radius:50%;background:linear-gradient(145deg,#ff8f7b,#ffd36d 40%,#75d8c0 70%,#8da6ff);box-shadow:inset 0 2px 0 #ffffffb8,0 4px 12px #d9b9a455}
.iconBtn{border:1px solid #eadfd3;background:#ffffffcc;backdrop-filter:blur(8px);border-radius:999px;min-width:46px;height:46px;padding:0 14px;font-weight:800;color:#4a403a;box-shadow:0 7px 18px #cba98d22}
.hud{position:relative;z-index:9;display:flex;flex-direction:column;align-items:center;gap:8px;padding:0 18px 4px;text-align:center}
.kicker{font-size:13px;font-weight:800;color:#8d7d72;letter-spacing:.08em;text-transform:uppercase}
.targetCard{display:flex;align-items:center;gap:12px;background:#ffffffd9;border:1px solid #ecdfd2;border-radius:24px;padding:11px 16px 11px 12px;box-shadow:0 12px 28px #be957a25;backdrop-filter:blur(9px)}
.targetDot{width:54px;height:54px;border-radius:50%;box-shadow:inset 0 3px 0 #ffffff88,0 5px 12px #5e46331f;border:3px solid #fff}
.targetText{min-width:122px;text-align:left}
.targetText small{display:block;font-size:11px;color:#918379;font-weight:800;letter-spacing:.05em;text-transform:uppercase;margin-bottom:2px}
.targetText strong{display:block;font-size:22px;line-height:1;font-weight:900;letter-spacing:-.03em}
.progress{display:flex;align-items:center;justify-content:center;gap:7px;margin-top:1px}
.star{width:13px;height:13px;border-radius:50%;background:#e8ddd2;box-shadow:inset 0 1px 1px #fff}
.star.on{background:#ffbf4f;box-shadow:0 0 0 3px #fff3cd,0 2px 4px #d89c3844}
.playfield{position:absolute;left:0;right:0;top:182px;bottom:max(10px,env(safe-area-inset-bottom));overflow:hidden}
.bubble{position:absolute;display:flex;align-items:center;justify-content:center;border:0;border-radius:50%;cursor:pointer;box-shadow:inset 0 5px 0 #ffffff88,inset 0 -8px 16px #00000010,0 16px 24px #80695720;transform:translate(-50%,-50%);animation:floaty var(--dur,4s) ease-in-out infinite;outline:none}
.bubble::after{content:"";position:absolute;left:20%;top:16%;width:28%;height:18%;border-radius:50%;background:#ffffff80;filter:blur(.2px);transform:rotate(-18deg)}
.bubble:focus-visible{outline:5px solid #2f2b2a;outline-offset:4px}
.bubble.pop{animation:pop .28s ease-out forwards}
.bubble.wrong{animation:wobble .34s ease-in-out}
@keyframes floaty{0%,100%{transform:translate(-50%,-50%) translateY(0) rotate(-1deg)}50%{transform:translate(-50%,-50%) translateY(var(--drift,-8px)) rotate(1deg)}}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(1);opacity:1}65%{transform:translate(-50%,-50%) scale(1.25);opacity:.72}100%{transform:translate(-50%,-50%) scale(.25);opacity:0}}
@keyframes wobble{0%,100%{transform:translate(-50%,-50%) translateX(0)}25%{transform:translate(-50%,-50%) translateX(-7px)}75%{transform:translate(-50%,-50%) translateX(7px)}}
.splash,.win{position:absolute;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;padding:22px;background:#fff8efdd;backdrop-filter:blur(14px)}
.card{width:min(92vw,480px);border:1px solid #eadfd3;background:#fffdf9;border-radius:34px;padding:28px 24px 24px;text-align:center;box-shadow:0 24px 70px #8b684633}
.logoBubble{width:112px;height:112px;border-radius:50%;margin:0 auto 14px;background:linear-gradient(145deg,#ff8b7b,#ffc861 35%,#73d9c0 66%,#9b9cff);box-shadow:inset 0 7px 0 #ffffff88,0 18px 34px #b5846440;position:relative}
.logoBubble::after{content:"";position:absolute;left:22px;top:18px;width:40px;height:24px;border-radius:50%;background:#ffffff82;transform:rotate(-20deg)}
.card h1{font-size:clamp(36px,9vw,54px);line-height:.95;margin:0 0 11px;letter-spacing:-.06em}
.card p{font-size:16px;line-height:1.45;color:#756860;margin:0 auto 20px;max-width:340px}
.primary{border:0;background:#2f2b2a;color:#fff;border-radius:999px;padding:16px 26px;font-weight:900;font-size:18px;min-width:180px;box-shadow:0 9px 0 #171514,0 14px 24px #3e302b2b}
.primary:active{transform:translateY(5px);box-shadow:0 4px 0 #171514,0 8px 16px #3e302b24}
.win{display:none;background:#fff8efe8}
.win.show{display:flex}
.confetti{display:flex;justify-content:center;gap:9px;font-size:30px;margin-bottom:12px}
.winStars{font-size:34px;letter-spacing:6px;margin:12px 0 20px}
.footerHint{position:absolute;left:0;right:0;bottom:max(10px,env(safe-area-inset-bottom));z-index:8;text-align:center;font-size:11px;font-weight:700;color:#9b8b80;pointer-events:none}
@media(max-width:620px){
  header{padding-left:14px;padding-right:14px}.iconBtn{height:42px;min-width:42px;padding:0 11px}.targetDot{width:48px;height:48px}.targetText strong{font-size:20px}.playfield{top:174px}.footerHint{display:none}
}
@media(max-height:650px){.playfield{top:150px}.hud{transform:scale(.9);transform-origin:top center}.brand{font-size:20px}}
@media(prefers-reduced-motion:reduce){.bubble{animation:none}.bubble.pop{animation:pop .18s ease-out forwards}.bubble.wrong{animation:wobble .25s ease-in-out}}
</style>
</head>
<body>
<div class="app" id="app">
  <header>
    <div class="brand"><span class="brandDot"></span><span>Color Pop</span></div>
    <button class="iconBtn" id="soundBtn" type="button" aria-pressed="true">🔊 Sound</button>
  </header>

  <div class="hud" aria-live="polite">
    <div class="kicker">Find this color</div>
    <div class="targetCard">
      <span class="targetDot" id="targetDot"></span>
      <span class="targetText"><small>Tap the matching bubble</small><strong id="targetName">Peach</strong></span>
    </div>
    <div class="progress" id="progress" aria-label="Round progress"></div>
  </div>

  <main class="playfield" id="playfield" aria-label="Color bubbles"></main>
  <div class="footerHint">No timer · no losing · just colors and pops</div>

  <section class="splash" id="splash">
    <div class="card">
      <div class="logoBubble"></div>
      <h1>Color<br>Pop</h1>
      <p>Find the color, tap the matching bubble, and collect six little stars.</p>
      <button class="primary" id="startBtn" type="button">Start popping</button>
    </div>
  </section>

  <section class="win" id="win">
    <div class="card">
      <div class="confetti" aria-hidden="true">● ✦ ● ✦ ●</div>
      <h1>You did it!</h1>
      <p>Six perfect color pops.</p>
      <div class="winStars" aria-hidden="true">⭐️⭐️⭐️</div>
      <button class="primary" id="againBtn" type="button">Play again</button>
    </div>
  </section>
</div>

<script>
(()=>{'use strict';
const COLORS=[
  {name:'Peach',hex:'#FF9B86'},
  {name:'Sky',hex:'#79B9F2'},
  {name:'Mint',hex:'#72D8B7'},
  {name:'Sunny',hex:'#FFD362'},
  {name:'Lavender',hex:'#A99AF7'},
  {name:'Berry',hex:'#E875A8'},
  {name:'Coral',hex:'#F47662'},
  {name:'Blueberry',hex:'#6278D9'}
];
const ROUNDS=6;
const slots=[
  [16,18],[43,13],[73,19],
  [26,43],[61,41],[84,49],
  [13,70],[43,69],[73,73]
];
const $=id=>document.getElementById(id);
const playfield=$('playfield'),targetDot=$('targetDot'),targetName=$('targetName'),progress=$('progress'),soundBtn=$('soundBtn'),win=$('win'),splash=$('splash');
let target=null,score=0,soundOn=true,busy=false,audioCtx=null;

function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function unlockAudio(){if(!soundOn)return;const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;if(!audioCtx)audioCtx=new AC();if(audioCtx.state==='suspended')audioCtx.resume().catch(()=>{})}
function tone(freq,dur=.09,type='sine',gain=.06,delay=0){if(!soundOn)return;unlockAudio();if(!audioCtx)return;const t=audioCtx.currentTime+delay,o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(gain,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(audioCtx.destination);o.start(t);o.stop(t+dur+.02)}
function popSound(){tone(540,.075,'triangle',.065);tone(790,.055,'sine',.035,.035)}
function softNo(){tone(210,.07,'sine',.025)}
function successSound(){tone(523,.14,'sine',.05,0);tone(659,.14,'sine',.05,.11);tone(784,.22,'sine',.055,.22)}
function buildProgress(){progress.innerHTML='';for(let i=0;i<ROUNDS;i++){const d=document.createElement('span');d.className='star'+(i<score?' on':'');progress.appendChild(d)}}
function bubbleSize(){const w=Math.min(innerWidth,900),h=playfield.clientHeight;const base=Math.min(w*.19,h*.19);return Math.max(70,Math.min(124,base))}
function newRound(){
  busy=false;
  playfield.innerHTML='';
  const palette=shuffle(COLORS).slice(0,6);
  target=palette[Math.floor(Math.random()*palette.length)];
  targetDot.style.background=target.hex;
  targetName.textContent=target.name;
  buildProgress();
  const chosenSlots=shuffle(slots).slice(0,palette.length);
  const base=bubbleSize();
  palette.forEach((c,i)=>{
    const b=document.createElement('button');
    const size=Math.round(base*(.86+Math.random()*.22));
    b.className='bubble';
    b.type='button';
    b.dataset.hex=c.hex;
    b.setAttribute('aria-label',c.name+' bubble');
    b.style.width=size+'px';b.style.height=size+'px';
    b.style.background=c.hex;
    b.style.left=chosenSlots[i][0]+'%';
    b.style.top=chosenSlots[i][1]+'%';
    b.style.setProperty('--dur',(3.2+Math.random()*2.2).toFixed(2)+'s');
    b.style.setProperty('--drift',(-5-Math.random()*10).toFixed(1)+'px');
    b.addEventListener('click',()=>pick(b,c));
    playfield.appendChild(b);
  });
}
function pick(button,color){
  if(busy)return;
  unlockAudio();
  if(color.hex===target.hex){
    busy=true;popSound();button.classList.add('pop');score++;buildProgress();
    setTimeout(()=>{
      if(score>=ROUNDS){successSound();win.classList.add('show')}
      else newRound();
    },300);
  }else{
    softNo();button.classList.remove('wrong');void button.offsetWidth;button.classList.add('wrong');
  }
}
function startGame(){unlockAudio();score=0;win.classList.remove('show');splash.style.display='none';newRound()}
$('startBtn').addEventListener('click',startGame);
$('againBtn').addEventListener('click',startGame);
soundBtn.addEventListener('click',()=>{soundOn=!soundOn;soundBtn.setAttribute('aria-pressed',String(soundOn));soundBtn.textContent=soundOn?'🔊 Sound':'🔇 Sound';if(soundOn)unlockAudio()});
window.addEventListener('resize',()=>{if(!splash.offsetParent&&!win.classList.contains('show'))newRound()});
buildProgress();targetDot.style.background=COLORS[0].hex;
})();
</script>
</body>
</html>
