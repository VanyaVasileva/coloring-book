<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Color Pop</title>
<style>
:root{
  --cream:#f7f1e8;
  --ink:#3b3733;
  --soft:#fbf7f1;
  --line:#ddd2c5;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;min-height:100%;background:var(--cream);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden;touch-action:manipulation}
body{min-height:100dvh}
button{font:inherit}
.app{position:relative;width:100vw;height:100dvh;overflow:hidden;background:linear-gradient(180deg,#f8f2e9 0%,#f3ece3 58%,#f7f1e9 100%)}
.app::before,.app::after{content:"";position:absolute;border-radius:50%;filter:blur(34px);opacity:.28;pointer-events:none}
.app::before{width:34vw;height:34vw;max-width:360px;max-height:360px;left:-10vw;top:-8vw;background:#c7a2aa}
.app::after{width:38vw;height:38vw;max-width:400px;max-height:400px;right:-13vw;bottom:-13vw;background:#a8b9ad}
header{position:relative;z-index:10;display:flex;align-items:center;justify-content:space-between;padding:max(14px,env(safe-area-inset-top)) 18px 8px;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:clamp(20px,4vw,30px);letter-spacing:-.04em}
.brandDot{width:24px;height:24px;border-radius:50%;background:linear-gradient(145deg,#c99d92aa,#c9b786aa 38%,#8fb3a4aa 68%,#969ab5aa);border:1.5px solid #ffffffaa;box-shadow:inset 0 2px 4px #ffffffaa,0 4px 12px #796b5f22}
.iconBtn{border:1px solid #ddd2c5;background:#fbf7f1c9;backdrop-filter:blur(10px);border-radius:999px;min-width:46px;height:46px;padding:0 14px;font-weight:800;color:#554d47;box-shadow:0 7px 18px #8f796322}
.hud{position:relative;z-index:9;display:flex;flex-direction:column;align-items:center;gap:8px;padding:0 18px 4px;text-align:center}
.kicker{font-size:13px;font-weight:800;color:#8a7e75;letter-spacing:.08em;text-transform:uppercase}
.targetCard{display:flex;align-items:center;gap:12px;background:#fbf7f1c7;border:1px solid #ddd2c5;border-radius:24px;padding:11px 16px 11px 12px;box-shadow:0 12px 28px #8d756120;backdrop-filter:blur(12px)}
.targetDot{width:54px;height:54px;border-radius:50%;border:1.5px solid #ffffffcc;box-shadow:inset 8px 10px 18px #ffffff55,inset -8px -10px 18px #5b4a3e12,0 7px 16px #6e5d4e20;backdrop-filter:blur(4px)}
.targetText{min-width:122px;text-align:left}
.targetText small{display:block;font-size:11px;color:#91867d;font-weight:800;letter-spacing:.05em;text-transform:uppercase;margin-bottom:2px}
.targetText strong{display:block;font-size:22px;line-height:1;font-weight:900;letter-spacing:-.03em}
.progress{display:flex;align-items:center;justify-content:center;gap:7px;margin-top:1px}
.star{width:13px;height:13px;border-radius:50%;background:#ddd3c9;box-shadow:inset 0 1px 1px #fff}
.star.on{background:#cbb680;box-shadow:0 0 0 3px #f6edd7,0 2px 4px #9f8b5c35}
.playfield{position:absolute;left:0;right:0;top:182px;bottom:max(10px,env(safe-area-inset-bottom));overflow:hidden}
.bubble{position:absolute;display:flex;align-items:center;justify-content:center;border:1.5px solid #ffffffa8;border-radius:50%;cursor:pointer;transform:translate(-50%,-50%);animation:floaty var(--dur,4s) ease-in-out infinite;outline:none;backdrop-filter:blur(5px) saturate(.82);-webkit-backdrop-filter:blur(5px) saturate(.82);box-shadow:inset 12px 14px 22px #ffffff48,inset -10px -14px 24px #55483d0e,0 15px 30px #67594d18,0 0 0 1px #ffffff2c}
.bubble::before{content:"";position:absolute;inset:5%;border-radius:50%;border:1px solid #ffffff38;pointer-events:none}
.bubble::after{content:"";position:absolute;left:18%;top:14%;width:34%;height:20%;border-radius:50%;background:radial-gradient(ellipse at center,#ffffffb8 0%,#ffffff60 42%,transparent 72%);filter:blur(2px);transform:rotate(-18deg)}
.bubble:focus-visible{outline:4px solid #4b443f;outline-offset:4px}
.bubble.pop{animation:pop .28s ease-out forwards}
.bubble.wrong{animation:wobble .34s ease-in-out}
@keyframes floaty{0%,100%{transform:translate(-50%,-50%) translateY(0) rotate(-1deg)}50%{transform:translate(-50%,-50%) translateY(var(--drift,-8px)) rotate(1deg)}}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(1);opacity:1}65%{transform:translate(-50%,-50%) scale(1.18);opacity:.55}100%{transform:translate(-50%,-50%) scale(.25);opacity:0}}
@keyframes wobble{0%,100%{transform:translate(-50%,-50%) translateX(0)}25%{transform:translate(-50%,-50%) translateX(-7px)}75%{transform:translate(-50%,-50%) translateX(7px)}}
.splash,.win{position:absolute;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;padding:22px;background:#f7f1e8d9;backdrop-filter:blur(14px)}
.card{width:min(92vw,480px);border:1px solid #ddd2c5;background:#fbf7f1e8;border-radius:34px;padding:28px 24px 24px;text-align:center;box-shadow:0 24px 70px #6d5c4a29;backdrop-filter:blur(12px)}
.logoBubble{width:112px;height:112px;border-radius:50%;margin:0 auto 14px;background:linear-gradient(145deg,#c99d9299,#c9b78699 35%,#8fb3a499 66%,#969ab599);border:1.5px solid #ffffffbb;box-shadow:inset 12px 14px 24px #ffffff55,inset -10px -12px 22px #5d504413,0 18px 34px #6b5b4b2d;position:relative;backdrop-filter:blur(5px)}
.logoBubble::after{content:"";position:absolute;left:20px;top:17px;width:42px;height:25px;border-radius:50%;background:#ffffff7a;filter:blur(2px);transform:rotate(-20deg)}
.card h1{font-size:clamp(36px,9vw,54px);line-height:.95;margin:0 0 11px;letter-spacing:-.06em}
.card p{font-size:16px;line-height:1.45;color:#756b63;margin:0 auto 20px;max-width:340px}
.primary{border:0;background:#48413c;color:#fff;border-radius:999px;padding:16px 26px;font-weight:900;font-size:18px;min-width:180px;box-shadow:0 9px 0 #292521,0 14px 24px #3e302b24}
.primary:active{transform:translateY(5px);box-shadow:0 4px 0 #292521,0 8px 16px #3e302b20}
.win{display:none;background:#f7f1e8e8}
.win.show{display:flex}
.confetti{display:flex;justify-content:center;gap:9px;font-size:30px;margin-bottom:12px;color:#9a827a}
.winStars{font-size:34px;letter-spacing:6px;margin:12px 0 20px}
.footerHint{position:absolute;left:0;right:0;bottom:max(10px,env(safe-area-inset-bottom));z-index:8;text-align:center;font-size:11px;font-weight:700;color:#91867d;pointer-events:none}
@media(max-width:620px){header{padding-left:14px;padding-right:14px}.iconBtn{height:42px;min-width:42px;padding:0 11px}.targetDot{width:48px;height:48px}.targetText strong{font-size:20px}.playfield{top:174px}.footerHint{display:none}}
@media(max-height:650px){.playfield{top:150px}.hud{transform:scale(.9);transform-origin:top center}.brand{font-size:20px}}
@media(prefers-reduced-motion:reduce){.bubble{animation:none}.bubble.pop{animation:pop .18s ease-out forwards}.bubble.wrong{animation:wobble .25s ease-in-out}}
</style>
</head>
<body>
<div class="app" id="app">
  <header>
    <div class="brand"><span class="brandDot"></span><span>Color Pop</span></div>
    <button class="iconBtn" id="soundBtn" type="button" aria-pressed="true">🔊 Sound</button>
  </header>

  <div class="hud" aria-live="polite">
    <div class="kicker">Find this color</div>
    <div class="targetCard">
      <span class="targetDot" id="targetDot"></span>
      <span class="targetText"><small>Tap the matching bubble</small><strong id="targetName">Dusty Peach</strong></span>
    </div>
    <div class="progress" id="progress" aria-label="Round progress"></div>
  </div>

  <main class="playfield" id="playfield" aria-label="Color bubbles"></main>
  <div class="footerHint">No timer · no losing · just colors and pops</div>

  <section class="splash" id="splash">
    <div class="card">
      <div class="logoBubble"></div>
      <h1>Color<br>Pop</h1>
      <p>Find the color, tap the matching bubble, and collect six little stars.</p>
      <button class="primary" id="startBtn" type="button">Start popping</button>
    </div>
  </section>

  <section class="win" id="win">
    <div class="card">
      <div class="confetti" aria-hidden="true">● ✦ ● ✦ ●</div>
      <h1>You did it!</h1>
      <p>Six perfect color pops.</p>
      <div class="winStars" aria-hidden="true">⭐️⭐️⭐️</div>
      <button class="primary" id="againBtn" type="button">Play again</button>
    </div>
  </section>
</div>

<script>
(()=>{'use strict';
const COLORS=[
  {name:'Dusty Peach',hex:'#C99686'},
  {name:'Misty Blue',hex:'#86A5B8'},
  {name:'Soft Sage',hex:'#8FAF9F'},
  {name:'Muted Gold',hex:'#C9B77F'},
  {name:'Lavender Grey',hex:'#A29AAF'},
  {name:'Dusty Rose',hex:'#BE8EA0'},
  {name:'Warm Clay',hex:'#B78373'},
  {name:'Slate Blue',hex:'#7889A2'}
];
const ROUNDS=6;
const slots=[[16,18],[43,13],[73,19],[26,43],[61,41],[84,49],[13,70],[43,69],[73,73]];
const $=id=>document.getElementById(id);
const playfield=$('playfield'),targetDot=$('targetDot'),targetName=$('targetName'),progress=$('progress'),soundBtn=$('soundBtn'),win=$('win'),splash=$('splash');
let target=null,score=0,soundOn=true,busy=false,audioCtx=null;
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function rgba(hex,a){const n=parseInt(hex.slice(1),16),r=n>>16,g=n>>8&255,b=n&255;return`rgba(${r},${g},${b},${a})`}
function unlockAudio(){if(!soundOn)return;const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;if(!audioCtx)audioCtx=new AC();if(audioCtx.state==='suspended')audioCtx.resume().catch(()=>{})}
function tone(freq,dur=.09,type='sine',gain=.06,delay=0){if(!soundOn)return;unlockAudio();if(!audioCtx)return;const t=audioCtx.currentTime+delay,o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(gain,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(audioCtx.destination);o.start(t);o.stop(t+dur+.02)}
function popSound(){tone(510,.075,'triangle',.052);tone(710,.055,'sine',.027,.035)}
function softNo(){tone(210,.07,'sine',.02)}
function successSound(){tone(523,.14,'sine',.042,0);tone(659,.14,'sine',.042,.11);tone(784,.22,'sine',.046,.22)}
function buildProgress(){progress.innerHTML='';for(let i=0;i<ROUNDS;i++){const d=document.createElement('span');d.className='star'+(i<score?' on':'');progress.appendChild(d)}}
function bubbleSize(){const w=Math.min(innerWidth,900),h=playfield.clientHeight;const base=Math.min(w*.19,h*.19);return Math.max(70,Math.min(124,base))}
function newRound(){
  busy=false;playfield.innerHTML='';
  const palette=shuffle(COLORS).slice(0,6);
  target=palette[Math.floor(Math.random()*palette.length)];
  targetDot.style.background=rgba(target.hex,.62);
  targetName.textContent=target.name;
  buildProgress();
  const chosenSlots=shuffle(slots).slice(0,palette.length),base=bubbleSize();
  palette.forEach((c,i)=>{
    const b=document.createElement('button'),size=Math.round(base*(.86+Math.random()*.22));
    b.className='bubble';b.type='button';b.dataset.hex=c.hex;b.setAttribute('aria-label',c.name+' bubble');
    b.style.width=size+'px';b.style.height=size+'px';
    b.style.background=`radial-gradient(circle at 34% 28%,${rgba(c.hex,.34)} 0%,${rgba(c.hex,.56)} 44%,${rgba(c.hex,.44)} 72%,${rgba(c.hex,.25)} 100%)`;
    b.style.left=chosenSlots[i][0]+'%';b.style.top=chosenSlots[i][1]+'%';
    b.style.setProperty('--dur',(3.2+Math.random()*2.2).toFixed(2)+'s');b.style.setProperty('--drift',(-5-Math.random()*10).toFixed(1)+'px');
    b.addEventListener('click',()=>pick(b,c));playfield.appendChild(b);
  });
}
function pick(button,color){
  if(busy)return;unlockAudio();
  if(color.hex===target.hex){
    busy=true;popSound();button.classList.add('pop');score++;buildProgress();
    setTimeout(()=>{if(score>=ROUNDS){successSound();win.classList.add('show')}else newRound()},300);
  }else{softNo();button.classList.remove('wrong');void button.offsetWidth;button.classList.add('wrong')}
}
function startGame(){unlockAudio();score=0;win.classList.remove('show');splash.style.display='none';newRound()}
$('startBtn').addEventListener('click',startGame);$('againBtn').addEventListener('click',startGame);
soundBtn.addEventListener('click',()=>{soundOn=!soundOn;soundBtn.setAttribute('aria-pressed',String(soundOn));soundBtn.textContent=soundOn?'🔊 Sound':'🔇 Sound';if(soundOn)unlockAudio()});
window.addEventListener('resize',()=>{if(!splash.offsetParent&&!win.classList.contains('show'))newRound()});
buildProgress();targetDot.style.background=rgba(COLORS[0].hex,.62);
})();
</script>
</body>
</html>
