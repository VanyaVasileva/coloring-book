<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Gouache Brush v8</title>
<style>
:root{--bg:#f5f2eb;--ink:#292721;--line:#d4cdc1}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overscroll-behavior:none}body{display:grid;grid-template-rows:auto 1fr}header{background:#fff;border-bottom:1px solid var(--line);padding:9px 12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}h1{font:500 17px Georgia,serif;margin:0 8px 0 0}.ctrl{display:flex;align-items:center;gap:6px;font-size:12px}.ctrl input[type=range]{width:108px}input[type=color]{width:40px;height:34px;padding:2px;border:1px solid var(--line);border-radius:8px;background:#fff}button{border:1px solid #cfc7bb;background:#fff;border-radius:9px;padding:9px 10px;color:var(--ink);font-size:12px;font-weight:700}.stage{min-height:0;padding:8px}.canvas-wrap{height:100%;background:#fff;box-shadow:0 4px 20px #0001;overflow:hidden;touch-action:none;position:relative}.layer{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}.paint{z-index:1;background:#fff}.live{z-index:2;background:transparent;cursor:crosshair}@media(max-width:760px){header{gap:7px}.ctrl input[type=range]{width:82px}.stage{padding:6px}}
</style>
</head>
<body>
<header>
<h1>Gouache Brush v8</h1>
<div class="ctrl"><span>Color</span><input id="color" type="color" value="#987459"></div>
<div class="ctrl"><span>Size</span><input id="size" type="range" min="7" max="150" value="60"><strong id="sizeVal">60</strong></div>
<div class="ctrl"><span>Paint</span><input id="opacity" type="range" min="45" max="100" value="100"><strong id="opacityVal">100%</strong></div>
<div class="ctrl"><span>Texture</span><input id="texture" type="range" min="0" max="100" value="72"><strong id="textureVal">72%</strong></div>
<button id="undo">Undo</button><button id="clear">Clear</button>
</header>
<div class="stage"><div class="canvas-wrap" id="wrap"><canvas id="paint" class="layer paint"></canvas><canvas id="live" class="layer live"></canvas></div></div>
<script>(()=>{'use strict';
const $=id=>document.getElementById(id),paint=$('paint'),live=$('live'),wrap=$('wrap');
const ctx=paint.getContext('2d',{alpha:false,desynchronized:true}),lctx=live.getContext('2d',{alpha:true,desynchronized:true});
const size=$('size'),opacity=$('opacity'),texture=$('texture'),color=$('color');
const mask=document.createElement('canvas'),tex=document.createElement('canvas'),dry=document.createElement('canvas');
let mctx=mask.getContext('2d',{alpha:true}),tctx=tex.getContext('2d',{alpha:true}),dctx=dry.getContext('2d',{alpha:true});
let dpr=1,drawing=false,stroke=null,history=[];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function setup(c,transparent=true){const r=wrap.getBoundingClientRect();c.width=Math.max(1,Math.floor(r.width*dpr));c.height=Math.max(1,Math.floor(r.height*dpr));const x=c.getContext('2d');x.setTransform(dpr,0,0,dpr,0,0);if(!transparent){x.fillStyle='#fff';x.fillRect(0,0,r.width,r.height)}}
function clearLayer(x,c){x.save();x.setTransform(1,0,0,1,0,0);x.clearRect(0,0,c.width,c.height);x.restore()}
function resize(){const old=document.createElement('canvas');old.width=paint.width;old.height=paint.height;if(old.width&&old.height)old.getContext('2d').drawImage(paint,0,0);dpr=Math.max(1,Math.min(2,devicePixelRatio||1));setup(paint,false);setup(live,true);setup(mask,true);setup(tex,true);setup(dry,true);mctx=mask.getContext('2d');tctx=tex.getContext('2d');dctx=dry.getContext('2d');mctx.setTransform(dpr,0,0,dpr,0,0);tctx.setTransform(dpr,0,0,dpr,0,0);dctx.setTransform(dpr,0,0,dpr,0,0);if(old.width&&old.height){ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.drawImage(old,0,0,old.width,old.height,0,0,paint.width,paint.height);ctx.restore()}}
function pos(e){const r=live.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top,pressure:e.pressure>0?e.pressure:.5,time:e.timeStamp||performance.now()}}
function snapshot(){const c=document.createElement('canvas');c.width=paint.width;c.height=paint.height;c.getContext('2d').drawImage(paint,0,0);return c}function save(){history.push(snapshot());if(history.length>10)history.shift()}
function rng(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}
function rgb(hex){return[parseInt(hex.slice(1,3),16),parseInt(hex.slice(3,5),16),parseInt(hex.slice(5,7),16)]}
function shade(hex,p){const [r,g,b]=rgb(hex),f=p<0?1+p:1-p;return p<0?`rgb(${Math.round(r*f)},${Math.round(g*f)},${Math.round(b*f)})`:`rgb(${Math.round(r+(255-r)*p)},${Math.round(g+(255-g)*p)},${Math.round(b+(255-b)*p)})`}
function makeTip(brush,seed){
 const rd=rng(seed),L=Math.max(18,Math.round(brush*1.10)),B=Math.max(16,Math.round(brush*.90)),pad=Math.ceil(brush*.16),c=document.createElement('canvas');c.width=L+pad*2;c.height=B+pad*2;const t=c.getContext('2d');t.translate(pad,pad);
 const n=()=> (rd()-.5)*brush*.018,corner=brush*.09,top=B*.055,bottom=B*.945,left=brush*.028,right=L-brush*.028;
 t.fillStyle='#fff';t.globalAlpha=1;t.beginPath();
 t.moveTo(left+corner+n(),top+n());
 t.lineTo(L*.48+n(),top+n());t.lineTo(right-corner+n(),top+n());
 t.quadraticCurveTo(right+n(),top+n(),right+n(),top+corner+n());
 t.lineTo(right+n(),bottom-corner+n());t.quadraticCurveTo(right+n(),bottom+n(),right-corner+n(),bottom+n());
 t.lineTo(L*.52+n(),bottom+n());t.lineTo(left+corner+n(),bottom+n());
 t.quadraticCurveTo(left+n(),bottom+n(),left+n(),bottom-corner+n());
 t.lineTo(left+n(),top+corner+n());t.quadraticCurveTo(left+n(),top+n(),left+corner+n(),top+n());t.closePath();t.fill();
 // Small irregularities along top/bottom only; keep the silhouette blunt and brush-like.
 t.globalCompositeOperation='destination-out';
 for(let i=0;i<20;i++){const upper=rd()<.5,x=L*(.045+rd()*.91),y=upper?B*(.045+rd()*.045):B*(.91+rd()*.045);t.globalAlpha=.15+rd()*.22;t.beginPath();t.ellipse(x,y,brush*(.003+rd()*.009),brush*(.0025+rd()*.006),0,0,Math.PI*2);t.fill()}
 // Short bristle cuts at the flat ends.
 for(let side=0;side<2;side++)for(let i=0;i<10;i++){const y=B*(.10+rd()*.80),x=side===0?left:right,len=brush*(.018+rd()*.052);t.globalAlpha=.18+rd()*.28;t.lineWidth=Math.max(.4,brush*(.0038+rd()*.0035));t.lineCap='round';t.beginPath();t.moveTo(x,y);t.lineTo(x+(side===0?len:-len),y+(rd()-.5)*brush*.012);t.stroke()}
 t.globalCompositeOperation='source-over';t.globalAlpha=1;return c;
}
function pf(p){return clamp(.975+(p?.pressure??.5)*.05,.98,1.03)}
function smooth(raw){if(!stroke.filtered){stroke.filtered={...raw};return{...raw}}const dx=raw.x-stroke.filtered.x,dy=raw.y-stroke.filtered.y,speed=Math.hypot(dx,dy),follow=clamp(.79+speed/420,.79,.92);stroke.filtered.x+=dx*follow;stroke.filtered.y+=dy*follow;stroke.filtered.pressure=stroke.filtered.pressure*.72+raw.pressure*.28;stroke.filtered.time=raw.time;return{...stroke.filtered}}
function angleDiff(a,b){let d=b-a;while(d>Math.PI)d-=Math.PI*2;while(d< -Math.PI)d+=Math.PI*2;return d}
function updateAngle(target){if(stroke.angle===null){stroke.angle=target;return}const d=angleDiff(stroke.angle,target);stroke.angle+=clamp(d,-.022,.022)*.18}
function stampMask(p,index){const tip=stroke.tips[index%stroke.tips.length],f=pf(p),j=Math.sin((index+1)*1.83+stroke.seed*.001)*Number(size.value)*.0035;const a=stroke.angle??0,nx=-Math.sin(a),ny=Math.cos(a);mctx.save();mctx.translate(p.x+nx*j,p.y+ny*j);mctx.rotate(a);mctx.scale(f*(.996+((index%3)-1)*.003),f);mctx.globalAlpha=1;mctx.globalCompositeOperation='source-over';mctx.drawImage(tip,-tip.width/2,-tip.height/2);mctx.restore()}
function textureSegment(a,b,brush,index){
 const dx=b.x-a.x,dy=b.y-a.y,len=Math.hypot(dx,dy);if(len<.01)return;const nx=-dy/len,ny=dx/len,str=+texture.value/100,base=color.value;
 // Broad paint drag: visible enough to feel painted, not striped.
 const broad=[[-.29,-.050,.050],[-.10,.060,.042],[.11,-.045,.040],[.30,.055,.045]];
 for(let i=0;i<broad.length;i++){const [lane,tone,alpha]=broad[i],wob=Math.sin(index*.43+i*1.51+stroke.seed*.0007)*brush*.008,off=lane*brush+wob;tctx.save();tctx.strokeStyle=shade(base,tone);tctx.globalAlpha=alpha*str;tctx.lineWidth=Math.max(1.5,brush*(.050+(i%2)*.014));tctx.lineCap='round';tctx.beginPath();tctx.moveTo(a.x+nx*off,a.y+ny*off);tctx.quadraticCurveTo((a.x+b.x)/2+nx*(off+wob*.35),(a.y+b.y)/2+ny*(off+wob*.35),b.x+nx*off,b.y+ny*off);tctx.stroke();tctx.restore()}
 // Fine bristle lines in the stroke direction.
 const lanes=[-.39,-.31,-.23,-.15,-.07,.02,.10,.18,.26,.34,.41];
 for(let i=0;i<lanes.length;i++){const wob=Math.sin(index*.61+i*1.77+stroke.seed*.0009)*brush*.006,off=lanes[i]*brush+wob,tone=i%4===0?.12:i%4===1?-.10:i%4===2?.065:-.055;tctx.save();tctx.strokeStyle=shade(base,tone);tctx.globalAlpha=(.040+(i%3)*.012)*str;tctx.lineWidth=Math.max(.55,brush*(.0065+(i%2)*.0035));tctx.lineCap='round';tctx.beginPath();tctx.moveTo(a.x+nx*off,a.y+ny*off);tctx.lineTo(b.x+nx*off,b.y+ny*off);tctx.stroke();tctx.restore()}
 // Broken dry channels. These are sparse and mostly near the edges, like the reference.
 const dryOffsets=[-.41,-.32,-.20,.21,.33,.41];
 for(let i=0;i<dryOffsets.length;i++){const gate=Math.sin(index*.93+i*2.03+stroke.seed*.0011);if(gate<.08)continue;const off=dryOffsets[i]*brush,s=.10+Math.abs(gate)*.10,ex=.90-Math.abs(gate)*.06;dctx.save();dctx.strokeStyle='#000';dctx.globalAlpha=(.12+.08*Math.abs(gate))*str;dctx.lineWidth=Math.max(.45,brush*(.0045+(i%2)*.003));dctx.lineCap='round';dctx.beginPath();dctx.moveTo(a.x+dx*s+nx*off,a.y+dy*s+ny*off);dctx.lineTo(a.x+dx*ex+nx*off,b.y-dy*(1-ex)+ny*off);dctx.stroke();dctx.restore()}
 // Tiny dry flecks close to the outer edges; not random grain across the center.
 if(index%2===0){for(let k=0;k<3;k++){const side=k%2?1:-1,t=.18+.30*k,x=a.x+dx*t,y=a.y+dy*t,off=side*brush*(.40+.025*Math.sin(index+k));dctx.save();dctx.globalAlpha=(.07+.025*k)*str;dctx.fillStyle='#000';dctx.beginPath();dctx.ellipse(x+nx*off,y+ny*off,brush*(.006+.002*k),brush*(.0035+.001*k),0,0,Math.PI*2);dctx.fill();dctx.restore()}}
}
function finishTexture(brush){if(!stroke.last||stroke.angle===null)return;const p=stroke.last,a=stroke.angle,tx=Math.cos(a),ty=Math.sin(a),nx=-ty,ny=tx,str=+texture.value/100;
 // Ragged flat lifting edge: short dry channels, all kept inside roughly 10% of brush size.
 for(let i=0;i<9;i++){const u=-.42+i*(.84/8),off=u*brush,len=brush*(.035+((i*37)%7)*.006);dctx.save();dctx.strokeStyle='#000';dctx.globalAlpha=(.12+(i%3)*.035)*str;dctx.lineWidth=Math.max(.45,brush*(.0045+(i%2)*.002));dctx.lineCap='round';dctx.beginPath();dctx.moveTo(p.x+nx*off-tx*brush*.10,p.y+ny*off-ty*brush*.10);dctx.lineTo(p.x+nx*off+tx*len,p.y+ny*off+ty*len);dctx.stroke();dctx.restore()}
 // A few painted bristle tips protrude slightly beyond the end, so it does not look cut by software.
 tctx.save();tctx.strokeStyle=color.value;tctx.lineCap='round';for(let i=0;i<6;i++){const u=-.36+i*(.72/5),off=u*brush,len=brush*(.020+(i%3)*.012);tctx.globalAlpha=.38+.08*(i%2);tctx.lineWidth=Math.max(.55,brush*(.0045+(i%2)*.002));tctx.beginPath();tctx.moveTo(p.x+nx*off-tx*brush*.025,p.y+ny*off-ty*brush*.025);tctx.lineTo(p.x+nx*off+tx*len,p.y+ny*off+ty*len);tctx.stroke()}tctx.restore();
}
function renderLive(){clearLayer(lctx,live);lctx.save();lctx.setTransform(1,0,0,1,0,0);lctx.globalAlpha=1;lctx.drawImage(mask,0,0);lctx.globalCompositeOperation='source-in';lctx.fillStyle=color.value;lctx.fillRect(0,0,live.width,live.height);lctx.globalCompositeOperation='source-atop';lctx.globalAlpha=1;lctx.drawImage(tex,0,0);lctx.globalCompositeOperation='destination-out';lctx.globalAlpha=.74;lctx.drawImage(dry,0,0);lctx.restore();live.style.opacity=opacity.value/100}
function paintTo(a,b){const dx=b.x-a.x,dy=b.y-a.y,len=Math.hypot(dx,dy);if(len<.08)return;updateAngle(Math.atan2(dy,dx));const brush=+size.value,spacing=brush*.060,n=Math.max(1,Math.ceil(len/spacing));for(let i=1;i<=n;i++){const q=i/n,p={x:a.x+dx*q,y:a.y+dy*q,pressure:a.pressure+(b.pressure-a.pressure)*q};stampMask(p,stroke.index++)}textureSegment(a,b,brush,stroke.segment++)}
function draw(raw){const p=smooth(raw);if(!stroke.last){stroke.last={...p};return}const q=stroke.last;if(Math.hypot(p.x-q.x,p.y-q.y)<.10)return;paintTo(q,p);stroke.last={...p}}
function begin(p){save();clearLayer(mctx,mask);clearLayer(tctx,tex);clearLayer(dctx,dry);clearLayer(lctx,live);const seed=((performance.now()*1000)|0)^(Math.random()*0xffffffff),brush=+size.value;stroke={last:null,filtered:null,angle:null,seed,index:0,segment:0,tips:[makeTip(brush,seed^0x9e37),makeTip(brush,seed^0x51f2),makeTip(brush,seed^0xa4c1)]};draw(p)}
function commit(){if(!stroke)return;finishTexture(+size.value);renderLive();ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=+opacity.value/100;ctx.drawImage(live,0,0);ctx.restore();clearLayer(lctx,live);clearLayer(mctx,mask);clearLayer(tctx,tex);clearLayer(dctx,dry)}
live.addEventListener('pointerdown',e=>{e.preventDefault();try{live.setPointerCapture(e.pointerId)}catch(_){}drawing=true;begin(pos(e))});
live.addEventListener('pointermove',e=>{if(!drawing)return;e.preventDefault();const ce=typeof e.getCoalescedEvents==='function'?e.getCoalescedEvents():null,arr=ce&&ce.length?ce:[e];for(const ev of arr)draw(pos(ev));renderLive()});
function end(e){if(!drawing)return;drawing=false;draw(pos(e));commit();stroke=null;try{live.releasePointerCapture(e.pointerId)}catch(_){}}live.addEventListener('pointerup',end);live.addEventListener('pointercancel',end);live.addEventListener('contextmenu',e=>e.preventDefault());
$('undo').onclick=()=>{clearLayer(lctx,live);if(!history.length)return;const s=history.pop();ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;ctx.fillStyle='#fff';ctx.fillRect(0,0,paint.width,paint.height);ctx.drawImage(s,0,0);ctx.restore()};$('clear').onclick=()=>{save();clearLayer(lctx,live);ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;ctx.fillStyle='#fff';ctx.fillRect(0,0,paint.width,paint.height);ctx.restore()};size.oninput=()=>{$('sizeVal').textContent=size.value};opacity.oninput=()=>{$('opacityVal').textContent=opacity.value+'%';live.style.opacity=opacity.value/100};texture.oninput=()=>{$('textureVal').textContent=texture.value+'%';if(drawing)renderLive()};addEventListener('resize',resize);resize();
})();</script>
</body>
</html>
