<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Gouache Brush v1</title>
<style>
:root{--bg:#f5f2eb;--ink:#292721;--line:#d4cdc1}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overscroll-behavior:none}body{display:grid;grid-template-rows:auto 1fr}header{background:#fff;border-bottom:1px solid var(--line);padding:9px 12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}h1{font:500 17px Georgia,serif;margin:0 8px 0 0}.ctrl{display:flex;align-items:center;gap:6px;font-size:12px}.ctrl input[type=range]{width:120px}input[type=color]{width:40px;height:34px;padding:2px;border:1px solid var(--line);border-radius:8px;background:#fff}button{border:1px solid #cfc7bb;background:#fff;border-radius:9px;padding:9px 10px;color:var(--ink);font-size:12px;font-weight:700}.stage{min-height:0;padding:8px}.canvas-wrap{height:100%;background:#fff;box-shadow:0 4px 20px #0001;overflow:hidden;touch-action:none}canvas{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair;background:#fff}@media(max-width:760px){header{gap:7px}.ctrl input[type=range]{width:90px}.stage{padding:6px}}
</style>
</head>
<body>
<header>
<h1>Gouache Brush v1</h1>
<div class="ctrl"><span>Color</span><input id="color" type="color" value="#D84D75"></div>
<div class="ctrl"><span>Size</span><input id="size" type="range" min="7" max="120" value="46"><strong id="sizeVal">46</strong></div>
<div class="ctrl"><span>Paint</span><input id="opacity" type="range" min="40" max="100" value="100"><strong id="opacityVal">100%</strong></div>
<button id="undo">Undo</button><button id="clear">Clear</button>
</header>
<div class="stage"><div class="canvas-wrap" id="wrap"><canvas id="paint"></canvas></div></div>
<script>(()=>{'use strict';
const $=id=>document.getElementById(id),paint=$('paint'),wrap=$('wrap'),ctx=paint.getContext('2d',{alpha:true,desynchronized:true}),size=$('size'),opacity=$('opacity'),color=$('color');
let dpr=1,drawing=false,stroke=null,history=[];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function resize(){const r=wrap.getBoundingClientRect();const old=document.createElement('canvas');old.width=paint.width;old.height=paint.height;if(old.width&&old.height)old.getContext('2d').drawImage(paint,0,0);dpr=Math.max(1,Math.min(2.5,devicePixelRatio||1));paint.width=Math.max(1,Math.floor(r.width*dpr));paint.height=Math.max(1,Math.floor(r.height*dpr));ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='#fff';ctx.fillRect(0,0,r.width,r.height);if(old.width&&old.height){ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.drawImage(old,0,0,old.width,old.height,0,0,paint.width,paint.height);ctx.restore()}}
function pos(e){const r=paint.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top,pressure:e.pressure>0?e.pressure:.5,time:e.timeStamp||performance.now()}}
function snapshot(){const c=document.createElement('canvas');c.width=paint.width;c.height=paint.height;c.getContext('2d').drawImage(paint,0,0);return c}function save(){history.push(snapshot());if(history.length>10)history.shift()}
function rng(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}
function rgb(hex){return[parseInt(hex.slice(1,3),16),parseInt(hex.slice(3,5),16),parseInt(hex.slice(5,7),16)]}
function shade(hex,p){const [r,g,b]=rgb(hex),f=p<0?1+p:1-p;return p<0?`rgb(${Math.round(r*f)},${Math.round(g*f)},${Math.round(b*f)})`:`rgb(${Math.round(r+(255-r)*p)},${Math.round(g+(255-g)*p)},${Math.round(b+(255-b)*p)})`}
function makeTip(brush,hex,seed){const rd=rng(seed),L=Math.max(20,Math.round(brush*1.02)),B=Math.max(20,Math.round(brush*.94)),pad=Math.ceil(brush*.18),c=document.createElement('canvas');c.width=L+pad*2;c.height=B+pad*2;const t=c.getContext('2d');t.translate(pad,pad);const wob=()=> (rd()-.5)*brush*.045;t.fillStyle=hex;t.globalAlpha=.95;t.beginPath();t.moveTo(brush*.06+wob(),B*.14+wob());t.quadraticCurveTo(L*.45,B*.01+wob(),L-brush*.06+wob(),B*.12+wob());t.quadraticCurveTo(L+wob(),B*.50,L-brush*.07+wob(),B*.88+wob());t.quadraticCurveTo(L*.54,B+wob(),brush*.06+wob(),B*.88+wob());t.quadraticCurveTo(-wob(),B*.51,brush*.06+wob(),B*.14+wob());t.closePath();t.fill();t.globalAlpha=1;for(let i=0;i<3;i++){const y=B*(.18+rd()*.64),amp=(rd()-.5)*brush*.05;t.strokeStyle=shade(hex,-(.035+rd()*.035));t.globalAlpha=.09+rd()*.05;t.lineWidth=Math.max(1,brush*(.028+rd()*.022));t.lineCap='round';t.beginPath();t.moveTo(L*.05,y);t.bezierCurveTo(L*.32,y+amp,L*.70,y-amp*.5,L*.96,y);t.stroke()}for(let i=0;i<2;i++){const y=B*(.22+rd()*.56);t.strokeStyle=shade(hex,.05+rd()*.03);t.globalAlpha=.06+rd()*.035;t.lineWidth=Math.max(.8,brush*(.018+rd()*.018));t.beginPath();t.moveTo(L*.08,y);t.lineTo(L*.94,y+(rd()-.5)*brush*.025);t.stroke()}t.globalCompositeOperation='destination-out';for(let i=0;i<5;i++){const y=B*(.14+rd()*.72),x=L*(.04+rd()*.22),len=L*(.35+rd()*.48);t.strokeStyle=`rgba(0,0,0,${.04+rd()*.055})`;t.lineWidth=Math.max(.6,brush*(.010+rd()*.012));t.lineCap='round';t.beginPath();t.moveTo(x,y);t.lineTo(Math.min(L*.98,x+len),y+(rd()-.5)*brush*.03);t.stroke()}for(let i=0;i<6;i++){const y=rd()<.5?B*(.05+rd()*.08):B*(.87+rd()*.08),x=L*(.08+rd()*.84);t.fillStyle=`rgba(0,0,0,${.05+rd()*.08})`;t.beginPath();t.ellipse(x,y,brush*(.018+rd()*.025),brush*(.010+rd()*.020),0,0,Math.PI*2);t.fill()}t.globalCompositeOperation='source-over';t.globalAlpha=1;return c}
function pf(p){return clamp(.91+(p?.pressure??.5)*.18,.92,1.09)}
function smooth(raw){if(!stroke.filtered){stroke.filtered={...raw};return{...raw}}const dx=raw.x-stroke.filtered.x,dy=raw.y-stroke.filtered.y,speed=Math.hypot(dx,dy),follow=clamp(.82+speed/300,.82,.96);stroke.filtered.x+=dx*follow;stroke.filtered.y+=dy*follow;stroke.filtered.pressure=raw.pressure;stroke.filtered.time=raw.time;return{...stroke.filtered}}
function stamp(p,angle,a=1){const f=pf(p),tip=stroke.tip;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(angle);ctx.scale(f,f);ctx.globalCompositeOperation='source-over';ctx.globalAlpha=(+opacity.value/100)*.52*a;ctx.drawImage(tip,-tip.width/2,-tip.height/2);ctx.restore()}
function paintTo(a,b){const dx=b.x-a.x,dy=b.y-a.y,len=Math.hypot(dx,dy);if(len<.08)return;const ang=Math.atan2(dy,dx),brush=+size.value,dt=Math.max(1,(b.time||0)-(a.time||0)),velocity=len/dt,spacing=brush*clamp(.22+velocity*.08,.22,.30),n=Math.max(1,Math.ceil(len/spacing));stroke.angle=ang;for(let i=1;i<=n;i++){const q=i/n;stamp({x:a.x+dx*q,y:a.y+dy*q,pressure:a.pressure+(b.pressure-a.pressure)*q},ang,1)}}
function draw(raw){const p=smooth(raw);if(!stroke.last){stroke.last={...p};stamp(p,0,1.04);return}const q=stroke.last;if(Math.hypot(p.x-q.x,p.y-q.y)<.1)return;paintTo(q,p);stroke.last={...p}}
function begin(p){save();const seed=((performance.now()*1000)|0)^(Math.random()*0xffffffff);stroke={last:null,filtered:null,angle:0,tip:makeTip(+size.value,color.value,seed)};draw(p)}
paint.addEventListener('pointerdown',e=>{e.preventDefault();try{paint.setPointerCapture(e.pointerId)}catch(_){}drawing=true;begin(pos(e))});
paint.addEventListener('pointermove',e=>{if(!drawing)return;e.preventDefault();const ce=typeof e.getCoalescedEvents==='function'?e.getCoalescedEvents():null,arr=ce&&ce.length?ce:[e];for(const ev of arr)draw(pos(ev))});
function end(e){if(!drawing)return;drawing=false;stroke=null;try{paint.releasePointerCapture(e.pointerId)}catch(_){}}paint.addEventListener('pointerup',end);paint.addEventListener('pointercancel',end);paint.addEventListener('contextmenu',e=>e.preventDefault());
$('undo').onclick=()=>{if(!history.length)return;const s=history.pop();ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#fff';ctx.fillRect(0,0,paint.width,paint.height);ctx.drawImage(s,0,0);ctx.restore()};$('clear').onclick=()=>{save();ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#fff';ctx.fillRect(0,0,paint.width,paint.height);ctx.restore()};size.oninput=()=>{$('sizeVal').textContent=size.value};opacity.oninput=()=>{$('opacityVal').textContent=opacity.value+'%'};addEventListener('resize',resize);resize();
})();</script>
</body>
</html>
