<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Gouache Brush v3</title>
<style>
:root{--bg:#f5f2eb;--ink:#292721;--line:#d4cdc1}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overscroll-behavior:none}body{display:grid;grid-template-rows:auto 1fr}header{background:#fff;border-bottom:1px solid var(--line);padding:9px 12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}h1{font:500 17px Georgia,serif;margin:0 8px 0 0}.ctrl{display:flex;align-items:center;gap:6px;font-size:12px}.ctrl input[type=range]{width:120px}input[type=color]{width:40px;height:34px;padding:2px;border:1px solid var(--line);border-radius:8px;background:#fff}button{border:1px solid #cfc7bb;background:#fff;border-radius:9px;padding:9px 10px;color:var(--ink);font-size:12px;font-weight:700}.stage{min-height:0;padding:8px}.canvas-wrap{height:100%;background:#fff;box-shadow:0 4px 20px #0001;overflow:hidden;touch-action:none}canvas{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair;background:#fff}@media(max-width:760px){header{gap:7px}.ctrl input[type=range]{width:90px}.stage{padding:6px}}
</style>
</head>
<body>
<header>
<h1>Gouache Brush v3</h1>
<div class="ctrl"><span>Color</span><input id="color" type="color" value="#9B765C"></div>
<div class="ctrl"><span>Size</span><input id="size" type="range" min="7" max="140" value="62"><strong id="sizeVal">62</strong></div>
<div class="ctrl"><span>Paint</span><input id="opacity" type="range" min="45" max="100" value="100"><strong id="opacityVal">100%</strong></div>
<button id="undo">Undo</button><button id="clear">Clear</button>
</header>
<div class="stage"><div class="canvas-wrap" id="wrap"><canvas id="paint"></canvas></div></div>
<script>(()=>{'use strict';
const $=id=>document.getElementById(id),paint=$('paint'),wrap=$('wrap'),ctx=paint.getContext('2d',{alpha:true,desynchronized:true}),size=$('size'),opacity=$('opacity'),color=$('color');
let dpr=1,drawing=false,stroke=null,history=[];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function resize(){const r=wrap.getBoundingClientRect();const old=document.createElement('canvas');old.width=paint.width;old.height=paint.height;if(old.width&&old.height)old.getContext('2d').drawImage(paint,0,0);dpr=Math.max(1,Math.min(2.5,devicePixelRatio||1));paint.width=Math.max(1,Math.floor(r.width*dpr));paint.height=Math.max(1,Math.floor(r.height*dpr));ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='#fff';ctx.fillRect(0,0,r.width,r.height);if(old.width&&old.height){ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.drawImage(old,0,0,old.width,old.height,0,0,paint.width,paint.height);ctx.restore()}}
function pos(e){const r=paint.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top,pressure:e.pressure>0?e.pressure:.5,time:e.timeStamp||performance.now()}}
function snapshot(){const c=document.createElement('canvas');c.width=paint.width;c.height=paint.height;c.getContext('2d').drawImage(paint,0,0);return c}function save(){history.push(snapshot());if(history.length>10)history.shift()}
function rng(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}
function rgb(hex){return[parseInt(hex.slice(1,3),16),parseInt(hex.slice(3,5),16),parseInt(hex.slice(5,7),16)]}
function shade(hex,p){const [r,g,b]=rgb(hex),f=p<0?1+p:1-p;return p<0?`rgb(${Math.round(r*f)},${Math.round(g*f)},${Math.round(b*f)})`:`rgb(${Math.round(r+(255-r)*p)},${Math.round(g+(255-g)*p)},${Math.round(b+(255-b)*p)})`}
function makeTip(brush,hex,seed){
  const rd=rng(seed),L=Math.max(22,Math.round(brush*1.28)),B=Math.max(16,Math.round(brush*.64)),pad=Math.ceil(brush*.16),c=document.createElement('canvas');
  c.width=L+pad*2;c.height=B+pad*2;const t=c.getContext('2d');t.translate(pad,pad);const wob=()=> (rd()-.5)*brush*.025;
  // Flat loaded gouache body: broad, mostly rectangular, organically imperfect.
  t.fillStyle=hex;t.globalAlpha=.96;t.beginPath();
  t.moveTo(brush*.04+wob(),B*.16+wob());
  t.bezierCurveTo(L*.22,B*.05+wob(),L*.72,B*.08+wob(),L-brush*.04+wob(),B*.16+wob());
  t.bezierCurveTo(L+wob(),B*.34,L+wob(),B*.66,L-brush*.04+wob(),B*.84+wob());
  t.bezierCurveTo(L*.72,B*.92+wob(),L*.23,B*.95+wob(),brush*.04+wob(),B*.84+wob());
  t.bezierCurveTo(-wob(),B*.66,-wob(),B*.34,brush*.04+wob(),B*.16+wob());t.closePath();t.fill();
  // Fine directional paint streaks, intentionally subtle.
  for(let i=0;i<5;i++){const y=B*(.22+rd()*.56),amp=(rd()-.5)*brush*.018;t.strokeStyle=shade(hex,rd()<.55?-.045:.055);t.globalAlpha=.045+rd()*.045;t.lineWidth=Math.max(.7,brush*(.010+rd()*.014));t.lineCap='round';t.beginPath();t.moveTo(L*.04,y);t.bezierCurveTo(L*.34,y+amp,L*.70,y-amp*.5,L*.97,y);t.stroke()}
  // Sparse dry-brush channels through the paint body.
  t.globalCompositeOperation='destination-out';
  for(let i=0;i<4;i++){const y=B*(.20+rd()*.60),x=L*(.03+rd()*.16),len=L*(.42+rd()*.42);t.strokeStyle=`rgba(0,0,0,${.025+rd()*.035})`;t.lineWidth=Math.max(.45,brush*(.006+rd()*.008));t.lineCap='round';t.beginPath();t.moveTo(x,y);t.lineTo(Math.min(L*.98,x+len),y+(rd()-.5)*brush*.012);t.stroke()}
  // Feather only the outer edge bands, not the middle of the stamp.
  for(let i=0;i<10;i++){const top=rd()<.5,y=top?B*(.06+rd()*.10):B*(.84+rd()*.10),x=L*(.05+rd()*.90),rw=brush*(.010+rd()*.018),rh=brush*(.006+rd()*.012);t.fillStyle=`rgba(0,0,0,${.035+rd()*.055})`;t.beginPath();t.ellipse(x,y,rw,rh,0,0,Math.PI*2);t.fill()}
  // A little bristle breakup at the two ends.
  for(let side=0;side<2;side++)for(let i=0;i<7;i++){const y=B*(.16+rd()*.68),x=side===0?L*(.015+rd()*.035):L*(.95+rd()*.035),len=brush*(.025+rd()*.06);t.strokeStyle=`rgba(0,0,0,${.03+rd()*.05})`;t.lineWidth=Math.max(.4,brush*.006);t.beginPath();t.moveTo(x,y);t.lineTo(x+(side===0?len:-len),y+(rd()-.5)*brush*.018);t.stroke()}
  t.globalCompositeOperation='source-over';t.globalAlpha=1;return c;
}
function pf(p){return clamp(.95+(p?.pressure??.5)*.10,.96,1.05)}
function smooth(raw){if(!stroke.filtered){stroke.filtered={...raw};return{...raw}}const dx=raw.x-stroke.filtered.x,dy=raw.y-stroke.filtered.y,speed=Math.hypot(dx,dy),follow=clamp(.80+speed/340,.80,.94);stroke.filtered.x+=dx*follow;stroke.filtered.y+=dy*follow;stroke.filtered.pressure=raw.pressure;stroke.filtered.time=raw.time;return{...stroke.filtered}}
function angleDiff(a,b){let d=b-a;while(d>Math.PI)d-=Math.PI*2;while(d< -Math.PI)d+=Math.PI*2;return d}
function updateAngle(target){if(stroke.angle===null){stroke.angle=target;return}const d=angleDiff(stroke.angle,target);const limited=clamp(d,-.055,.055);stroke.angle+=limited*.30}
function stamp(p,a=1){const f=pf(p),tip=stroke.tip;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(stroke.angle??0);ctx.scale(f,f);ctx.globalCompositeOperation='source-over';ctx.globalAlpha=(+opacity.value/100)*.46*a;ctx.drawImage(tip,-tip.width/2,-tip.height/2);ctx.restore()}
function paintTo(a,b){const dx=b.x-a.x,dy=b.y-a.y,len=Math.hypot(dx,dy);if(len<.08)return;const target=Math.atan2(dy,dx);updateAngle(target);const brush=+size.value,dt=Math.max(1,(b.time||0)-(a.time||0)),velocity=len/dt,spacing=brush*clamp(.15+velocity*.045,.15,.21),n=Math.max(1,Math.ceil(len/spacing));for(let i=1;i<=n;i++){const q=i/n;stamp({x:a.x+dx*q,y:a.y+dy*q,pressure:a.pressure+(b.pressure-a.pressure)*q},1)}}
function draw(raw){const p=smooth(raw);if(!stroke.last){stroke.last={...p};return}const q=stroke.last;if(Math.hypot(p.x-q.x,p.y-q.y)<.1)return;paintTo(q,p);stroke.last={...p}}
function begin(p){save();const seed=((performance.now()*1000)|0)^(Math.random()*0xffffffff);stroke={last:null,filtered:null,angle:null,tip:makeTip(+size.value,color.value,seed)};draw(p)}
paint.addEventListener('pointerdown',e=>{e.preventDefault();try{paint.setPointerCapture(e.pointerId)}catch(_){}drawing=true;begin(pos(e))});
paint.addEventListener('pointermove',e=>{if(!drawing)return;e.preventDefault();const ce=typeof e.getCoalescedEvents==='function'?e.getCoalescedEvents():null,arr=ce&&ce.length?ce:[e];for(const ev of arr)draw(pos(ev))});
function end(e){if(!drawing)return;drawing=false;stroke=null;try{paint.releasePointerCapture(e.pointerId)}catch(_){}}paint.addEventListener('pointerup',end);paint.addEventListener('pointercancel',end);paint.addEventListener('contextmenu',e=>e.preventDefault());
$('undo').onclick=()=>{if(!history.length)return;const s=history.pop();ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#fff';ctx.fillRect(0,0,paint.width,paint.height);ctx.drawImage(s,0,0);ctx.restore()};$('clear').onclick=()=>{save();ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#fff';ctx.fillRect(0,0,paint.width,paint.height);ctx.restore()};size.oninput=()=>{$('sizeVal').textContent=size.value};opacity.oninput=()=>{$('opacityVal').textContent=opacity.value+'%'};addEventListener('resize',resize);resize();
})();</script>
</body>
</html>
