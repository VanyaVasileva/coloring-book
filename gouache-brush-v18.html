<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Gouache Brush v18</title>
<style>
:root{--bg:#f5f2eb;--ink:#292721;--line:#d4cdc1}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overscroll-behavior:none}body{display:grid;grid-template-rows:auto 1fr}header{background:#fff;border-bottom:1px solid var(--line);padding:9px 12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}h1{font:500 17px Georgia,serif;margin:0 8px 0 0}.ctrl{display:flex;align-items:center;gap:6px;font-size:12px}.ctrl input[type=range]{width:108px}input[type=color]{width:40px;height:34px;padding:2px;border:1px solid var(--line);border-radius:8px;background:#fff}button{border:1px solid #cfc7bb;background:#fff;border-radius:9px;padding:9px 10px;color:var(--ink);font-size:12px;font-weight:700}.stage{min-height:0;padding:8px}.wrap{height:100%;background:#fff;box-shadow:0 4px 20px #0001;overflow:hidden;touch-action:none;position:relative}.layer{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}.paint{z-index:1;background:#fff}.live{z-index:2;background:transparent;cursor:crosshair}@media(max-width:760px){header{gap:7px}.ctrl input[type=range]{width:82px}.stage{padding:6px}}
</style>
</head>
<body>
<header>
<h1>Gouache Brush v18</h1>
<div class="ctrl"><span>Color</span><input id="color" type="color" value="#987459"></div>
<div class="ctrl"><span>Size</span><input id="size" type="range" min="7" max="150" value="60"><strong id="sizeVal">60</strong></div>
<div class="ctrl"><span>Paint</span><input id="opacity" type="range" min="45" max="100" value="100"><strong id="opacityVal">100%</strong></div>
<div class="ctrl"><span>Texture</span><input id="texture" type="range" min="0" max="100" value="76"><strong id="textureVal">76%</strong></div>
<button id="undo">Undo</button><button id="clear">Clear</button>
</header>
<div class="stage"><div class="wrap" id="wrap"><canvas id="paint" class="layer paint"></canvas><canvas id="live" class="layer live"></canvas></div></div>
<script>(()=>{'use strict';
const $=id=>document.getElementById(id),paint=$('paint'),live=$('live'),wrap=$('wrap'),size=$('size'),opacity=$('opacity'),texture=$('texture'),color=$('color');
const pctx=paint.getContext('2d',{alpha:false,desynchronized:true}),lctx=live.getContext('2d',{alpha:true,desynchronized:true});
let dpr=1,drawing=false,stroke=null,history=[];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function setup(c,transparent){const r=wrap.getBoundingClientRect();c.width=Math.max(1,Math.floor(r.width*dpr));c.height=Math.max(1,Math.floor(r.height*dpr));const x=c.getContext('2d');x.setTransform(dpr,0,0,dpr,0,0);if(!transparent){x.fillStyle='#fff';x.fillRect(0,0,r.width,r.height)}}
function clearLive(){lctx.save();lctx.setTransform(1,0,0,1,0,0);lctx.clearRect(0,0,live.width,live.height);lctx.restore()}
function resize(){const old=document.createElement('canvas');old.width=paint.width;old.height=paint.height;if(old.width&&old.height)old.getContext('2d').drawImage(paint,0,0);dpr=Math.max(1,Math.min(2,devicePixelRatio||1));setup(paint,false);setup(live,true);if(old.width&&old.height){pctx.save();pctx.setTransform(1,0,0,1,0,0);pctx.drawImage(old,0,0,old.width,old.height,0,0,paint.width,paint.height);pctx.restore()}}
function pos(e){const r=live.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top,pressure:e.pressure>0?e.pressure:.5,time:e.timeStamp||performance.now()}}
function snapshot(){const c=document.createElement('canvas');c.width=paint.width;c.height=paint.height;c.getContext('2d').drawImage(paint,0,0);return c}
function save(){history.push(snapshot());if(history.length>10)history.shift()}
function rng(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}
function rgb(hex){return[parseInt(hex.slice(1,3),16),parseInt(hex.slice(3,5),16),parseInt(hex.slice(5,7),16)]}
function shade(hex,p){const[r,g,b]=rgb(hex);return p<0?`rgb(${Math.round(r*(1+p))},${Math.round(g*(1+p))},${Math.round(b*(1+p))})`:`rgb(${Math.round(r+(255-r)*p)},${Math.round(g+(255-g)*p)},${Math.round(b+(255-b)*p)})`}
function makeTip(brush,hex,seed){const rd=rng(seed),W=Math.max(18,Math.round(brush*1.08)),H=Math.max(16,Math.round(brush*.90)),pad=Math.ceil(brush*.16),c=document.createElement('canvas');c.width=W+pad*2;c.height=H+pad*2;const t=c.getContext('2d');t.translate(pad,pad);const top=H*.055,bottom=H*.945,left=brush*.025,right=W-brush*.025,corner=brush*.13,j=()=> (rd()-.5)*brush*.012;t.fillStyle=hex;t.beginPath();t.moveTo(left+corner+j(),top+j());t.lineTo(right-corner+j(),top+j());t.quadraticCurveTo(right+brush*.035+j(),top+corner*.52+j(),right+brush*.018+j(),H*.50+j());t.quadraticCurveTo(right+brush*.030+j(),bottom-corner*.55+j(),right-corner+j(),bottom+j());t.lineTo(left+corner+j(),bottom+j());t.quadraticCurveTo(left-brush*.028+j(),bottom-corner*.52+j(),left-brush*.016+j(),H*.50+j());t.quadraticCurveTo(left-brush*.025+j(),top+corner*.58+j(),left+corner+j(),top+j());t.closePath();t.fill();t.globalCompositeOperation='destination-out';for(let i=0;i<18;i++){const side=rd()<.5?-1:1,x=side<0?left+brush*(.00+rd()*.07):right-brush*(.00+rd()*.07),y=H*(.12+rd()*.76);t.globalAlpha=.10+rd()*.18;t.beginPath();t.ellipse(x,y,brush*(.003+rd()*.008),brush*(.002+rd()*.006),(rd()-.5)*.25,0,Math.PI*2);t.fill()}for(let i=0;i<16;i++){const upper=rd()<.5,x=W*(.06+rd()*.88),y=upper?top+brush*(rd()*.035):bottom-brush*(rd()*.035);t.globalAlpha=.08+rd()*.16;t.beginPath();t.ellipse(x,y,brush*(.003+rd()*.008),brush*(.002+rd()*.004),0,0,Math.PI*2);t.fill()}t.globalCompositeOperation='source-over';t.globalAlpha=1;return c}
function makeDeferredHairs(brush,seed,count,dry=false){const rd=rng(seed),arr=[];for(let i=0;i<count;i++)arr.push({lane:-.39+(count===1?.5:i/(count-1))*.78+(rd()-.5)*.075,width:brush*(dry?.0045+rd()*.0050:.0032+rd()*.0048),alpha:dry?.14+rd()*.12:.075+rd()*.080,tone:(rd()-.5)*.34,amp1:brush*(.018+rd()*.035),amp2:brush*(.006+rd()*.018),freq1:.006+rd()*.009,freq2:.015+rd()*.014,phase1:rd()*Math.PI*2,phase2:rd()*Math.PI*2,breakFreq:.006+rd()*.010,breakPhase:rd()*Math.PI*2,breakThreshold:dry?-.05+rd()*.18:-.45});return arr}
function angleDiff(a,b){let d=b-a;while(d>Math.PI)d-=Math.PI*2;while(d< -Math.PI)d+=Math.PI*2;return d}
function updateAngle(target){if(stroke.angle===null){stroke.angle=target;return}const d=angleDiff(stroke.angle,target);stroke.angle+=clamp(d,-.035,.035)*.38}
function pressureScale(p){return clamp(.975+p*.055,.98,1.035)}
function stamp(p,index){const tip=stroke.tips[index%stroke.tips.length],f=pressureScale(p.pressure),a=stroke.angle??0,nx=-Math.sin(a),ny=Math.cos(a),j=Math.sin(index*1.37+stroke.seed*.001)*Number(size.value)*.0015;lctx.save();lctx.translate(p.x+nx*j,p.y+ny*j);lctx.rotate(a);lctx.scale(f,f);lctx.globalAlpha=1;lctx.globalCompositeOperation='source-over';lctx.drawImage(tip,-tip.width/2,-tip.height/2);lctx.restore()}
function textureStrength(){const v=+texture.value/100;return v<=0?0:.50+Math.pow(v,.72)*.92}
function buildGeometry(){const pts=stroke.samples;if(!pts||pts.length<2)return[];const g=[];for(let i=0;i<pts.length;i++){const p=pts[i],a=pts[Math.max(0,i-1)],b=pts[Math.min(pts.length-1,i+1)],dx=b.x-a.x,dy=b.y-a.y,L=Math.hypot(dx,dy)||1;g.push({...p,tx:dx/L,ty:dy/L,nx:-dy/L,ny:dx/L})}return g}
function smoothPath(c,pts){if(pts.length<2)return;c.beginPath();c.moveTo(pts[0].x,pts[0].y);for(let i=1;i<pts.length-1;i++){const mx=(pts[i].x+pts[i+1].x)/2,my=(pts[i].y+pts[i+1].y)/2;c.quadraticCurveTo(pts[i].x,pts[i].y,mx,my)}c.lineTo(pts[pts.length-1].x,pts[pts.length-1].y);c.stroke()}
function hairPoints(g,h,brush){const out=[];for(const p of g){const wander=Math.sin(p.s*h.freq1+h.phase1)*h.amp1+Math.sin(p.s*h.freq2+h.phase2)*h.amp2,off=h.lane*brush+wander;out.push({x:p.x+p.nx*off,y:p.y+p.ny*off,s:p.s})}return out}
function drawDeferredTexture(){const g=buildGeometry();if(g.length<2)return;const brush=+size.value,str=textureStrength(),base=color.value;if(str<=0)return;lctx.save();lctx.globalCompositeOperation='source-atop';lctx.lineCap='round';for(let i=0;i<2;i++){const phase=i?2.1:.4,pts=g.map(p=>{const off=(i?.18:-.20)*brush+Math.sin(p.s*.007+phase)*brush*.025;return{x:p.x+p.nx*off,y:p.y+p.ny*off}});lctx.strokeStyle=shade(base,i?.10:-.09);lctx.globalAlpha=.055*str;lctx.lineWidth=Math.max(1.0,brush*(i?.060:.070));smoothPath(lctx,pts)}for(const h of stroke.hairs){const pts=hairPoints(g,h,brush);lctx.strokeStyle=shade(base,h.tone);lctx.globalAlpha=h.alpha*str;lctx.lineWidth=Math.max(.40,h.width);smoothPath(lctx,pts)}lctx.restore();lctx.save();lctx.globalCompositeOperation='destination-out';lctx.lineCap='round';for(const h of stroke.dryHairs){let seg=[];for(const p of g){const gate=Math.sin(p.s*h.breakFreq+h.breakPhase);const wander=Math.sin(p.s*h.freq1+h.phase1)*h.amp1+Math.sin(p.s*h.freq2+h.phase2)*h.amp2,off=h.lane*brush+wander,q={x:p.x+p.nx*off,y:p.y+p.ny*off};if(gate>h.breakThreshold)seg.push(q);else{if(seg.length>1){lctx.globalAlpha=h.alpha*str;lctx.lineWidth=Math.max(.55,h.width);smoothPath(lctx,seg)}seg=[]}}if(seg.length>1){lctx.globalAlpha=h.alpha*str;lctx.lineWidth=Math.max(.55,h.width);smoothPath(lctx,seg)}}lctx.restore();drawEndDry(g,true);drawEndDry(g,false)}
function drawEndDry(g,isStart){if(g.length<2)return;const brush=+size.value,str=textureStrength(),rd=rng((stroke.seed^(isStart?0x41ab:0x9d73))>>>0),edge=isStart?g[0]:g[g.length-1],dir=isStart?-1:1;lctx.save();lctx.globalCompositeOperation='destination-out';lctx.lineCap='round';for(let i=0;i<5;i++){const lane=-.36+i*(.72/4)+(rd()-.5)*.055,off=lane*brush,curve=(rd()-.5)*brush*.065,startBack=brush*(.07+rd()*.10),sx=edge.x-edge.tx*dir*startBack+edge.nx*off,sy=edge.y-edge.ty*dir*startBack+edge.ny*off,ex=edge.x+edge.tx*dir*brush*(.015+rd()*.030)+edge.nx*(off+(rd()-.5)*brush*.030),ey=edge.y+edge.ty*dir*brush*(.015+rd()*.030)+edge.ny*(off+(rd()-.5)*brush*.030);lctx.globalAlpha=(.24+rd()*.22)*str;lctx.lineWidth=Math.max(.60,brush*(.0050+rd()*.0060));lctx.beginPath();lctx.moveTo(sx,sy);lctx.quadraticCurveTo((sx+ex)/2+edge.nx*curve,(sy+ey)/2+edge.ny*curve,ex,ey);lctx.stroke()}for(let i=0;i<4;i++){const lane=-.34+rd()*.68,off=lane*brush,back=brush*(.014+rd()*.030);lctx.globalAlpha=(.12+rd()*.14)*str;lctx.beginPath();lctx.ellipse(edge.x-edge.tx*dir*back+edge.nx*off,edge.y-edge.ty*dir*back+edge.ny*off,brush*(.009+rd()*.012),brush*(.004+rd()*.007),Math.atan2(edge.ty,edge.tx)+(rd()-.5)*.28,0,Math.PI*2);lctx.fill()}lctx.restore()}
function paintTo(a,b){const dx=b.x-a.x,dy=b.y-a.y,len=Math.hypot(dx,dy);if(len<.05)return;updateAngle(Math.atan2(dy,dx));const brush=+size.value,spacing=clamp(brush*.028,1.1,2.1),n=Math.max(1,Math.ceil(len/spacing));for(let i=1;i<=n;i++){const q=i/n,p={x:a.x+dx*q,y:a.y+dy*q,pressure:a.pressure+(b.pressure-a.pressure)*q};stamp(p,stroke.index++)}stroke.distance+=len}
function process(p){if(!stroke.last){stroke.last={...p};stroke.samples=[{...p,s:0}];return}const q=stroke.last,dist=Math.hypot(p.x-q.x,p.y-q.y);if(dist<.08)return;paintTo(q,p);const sample={...p,s:stroke.distance};const prev=stroke.samples[stroke.samples.length-1];if(!prev||Math.hypot(sample.x-prev.x,sample.y-prev.y)>=1.4)stroke.samples.push(sample);else stroke.samples[stroke.samples.length-1]=sample;stroke.last={...p}}
function begin(p){save();clearLive();const seed=((performance.now()*1000)|0)^(Math.random()*0xffffffff),brush=+size.value;stroke={last:null,angle:null,index:0,distance:0,seed,samples:[],hairs:makeDeferredHairs(brush,seed^0x22b9,5,false),dryHairs:makeDeferredHairs(brush,seed^0x77c1,3,true),tips:[makeTip(brush,color.value,seed^0x9e37),makeTip(brush,color.value,seed^0x51f2),makeTip(brush,color.value,seed^0xa4c1),makeTip(brush,color.value,seed^0x31b7)]};process(p);live.style.opacity=opacity.value/100}
function commit(){if(!stroke)return;if(stroke.last&&stroke.samples&&stroke.samples.length){const lastSample=stroke.samples[stroke.samples.length-1];if(Math.hypot(stroke.last.x-lastSample.x,stroke.last.y-lastSample.y)>.25)stroke.samples.push({...stroke.last,s:stroke.distance})}drawDeferredTexture();pctx.save();pctx.setTransform(1,0,0,1,0,0);pctx.globalAlpha=+opacity.value/100;pctx.drawImage(live,0,0);pctx.restore();clearLive()}
live.addEventListener('pointerdown',e=>{e.preventDefault();try{live.setPointerCapture(e.pointerId)}catch(_){}drawing=true;begin(pos(e))});
live.addEventListener('pointermove',e=>{if(!drawing)return;e.preventDefault();const ce=typeof e.getCoalescedEvents==='function'?e.getCoalescedEvents():null,arr=ce&&ce.length?ce:[e];for(const ev of arr)process(pos(ev))});
function end(e){if(!drawing)return;e.preventDefault();process(pos(e));drawing=false;commit();stroke=null;try{live.releasePointerCapture(e.pointerId)}catch(_){}}
live.addEventListener('pointerup',end);live.addEventListener('pointercancel',end);live.addEventListener('contextmenu',e=>e.preventDefault());
$('undo').onclick=()=>{clearLive();if(!history.length)return;const s=history.pop();pctx.save();pctx.setTransform(1,0,0,1,0,0);pctx.globalAlpha=1;pctx.fillStyle='#fff';pctx.fillRect(0,0,paint.width,paint.height);pctx.drawImage(s,0,0);pctx.restore()};
$('clear').onclick=()=>{save();clearLive();pctx.save();pctx.setTransform(1,0,0,1,0,0);pctx.globalAlpha=1;pctx.fillStyle='#fff';pctx.fillRect(0,0,paint.width,paint.height);pctx.restore()};
size.oninput=()=>{$('sizeVal').textContent=size.value};opacity.oninput=()=>{$('opacityVal').textContent=opacity.value+'%';live.style.opacity=opacity.value/100};texture.oninput=()=>{$('textureVal').textContent=texture.value+'%'};addEventListener('resize',resize);resize();
})();</script>
</body>
</html>
