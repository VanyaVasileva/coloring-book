<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f5f2eb}
#ce822{display:block;width:100%;height:100%;border:0;background:#f5f2eb}
</style>

<body>
<iframe id="ce822" src="./test-v3-ce822.html" title="Acrylic v3 ce822 continuous join test"></iframe>
<script>
(() => {
'use strict';
const host=document.getElementById('ce822');
host.addEventListener('load',()=>{
  let d;
  try{d=host.contentDocument;}catch(_){return;}
  const app=d&&d.getElementById('app');
  if(!app)return;
  const target='./brush-test-v3-continuous-a1.html';
  if(app.getAttribute('src')!==target)app.setAttribute('src',target);
});
})();
</script>
