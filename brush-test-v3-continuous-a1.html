<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Translucent Pigment Acrylic Brush v3</title>
<style>

</style></head><body>
<header><h1>Translucent Pigment Acrylic v3</h1><div class="tools"><button id="paintBtn" class="active">🖌️ Paint</button><button id="moveBtn">✋ Move</button><button id="eraseBtn">🧼 Erase</button><button id="zoomOut">−</button><button id="zoomIn">+</button><button id="undo">Undo</button><button id="clear">Clear</button></div></header>
<main><section class="stage" id="stage"><div class="viewport" id="viewport"><div class="shell" id="shell"><canvas id="paint" class="layer"></canvas><canvas id="guide" class="layer"></canvas></div></div></section><aside>
<div class="pill"><span class="brush">Acrylic v3</span><br>Strong color with slight transparency, very subtle pigment variation, soft dry drag and natural buildup on a second pass.</div>
<div class="label">Brush size</div><div class="row"><span>Size</span><strong id="sizeVal">46</strong></div><input id="size" type="range" min="7" max="120" value="46">
<div class="label">Paint strength</div><div class="row"><span>Opacity</span><strong id="opacityVal">100%</strong></div><input id="opacity" type="range" min="30" max="100" value="100">
<div class="label">Color</div><input id="color" class="sw" type="color" value="#D84D75">
<div class="label">Sketch opacity</div><div class="row"><span>Guide</span><strong id="guideVal">72%</strong></div><input id="guideOpacity" type="range" min="0" max="100" value="72">
<div class="label">Status</div><div id="status" class="pill">Loading city artwork…</div></aside></main>
<script>(()=>{'use strict';
const $=id=>document.getElementById(id),stage=$('stage'),viewport=$('viewport'),shell=$('shell'),guide=$('guide'),paint=$('paint'),gctx=guide.getContext('2d'),ctx=paint.getContext('2d',{alpha:true,desynchronized:true}),size=$('size'),opacity=$('opacity'),color=$('color'),status=$('status');
let W=1000,H=1417,tool='paint',scale=1,tx=0,ty=0,active=new Map(),mode=null,stroke=null,gesture=null,pan=null,history=[];const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),mid=p=>({x:(p[0].x+p[1].x)/2,y:(p[0].y+p[1].y)/2}),dist=p=>Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);

function snapshot(){const c=document.createElement('canvas');c.width=W;c.height=H;c.getContext('2d').drawImage(paint,0,0);return c}function save(){history.push(snapshot());if(history.length>8)history.shift()}
function rng(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}function rgb(hex){return[parseInt(hex.slice(1,3),16),parseInt(hex.slice(3,5),16),parseInt(hex.slice(5,7),16)]}function shade(hex,p){const [r,g,b]=rgb(hex),f=p<0?1+p:1-p;return p<0?`rgb(${Math.round(r*f)},${Math.round(g*f)},${Math.round(b*f)})`:`rgb(${Math.round(r+(255-r)*p)},${Math.round(g+(255-g)*p)},${Math.round(b+(255-b)*p)})`}
function makeTip(brush,hex,seed){const rd=rng(seed),L=Math.max(20,Math.round(brush*1.02)),B=Math.max(20,Math.round(brush*.94)),pad=Math.ceil(brush*.18),c=document.createElement('canvas');c.width=L+pad*2;c.height=B+pad*2;const t=c.getContext('2d');t.translate(pad,pad);const wob=()=>0;t.fillStyle=hex;t.globalAlpha=.88;t.beginPath();t.moveTo(brush*.06+wob(),B*.14+wob());t.quadraticCurveTo(L*.45,B*.01+wob(),L-brush*.06+wob(),B*.12+wob());t.quadraticCurveTo(L+wob(),B*.50,L-brush*.07+wob(),B*.88+wob());t.quadraticCurveTo(L*.54,B+wob(),brush*.06+wob(),B*.88+wob());t.quadraticCurveTo(-wob(),B*.51,brush*.06+wob(),B*.14+wob());t.closePath();t.fill();
  t.globalAlpha=1;for(let i=0;i<3;i++){const y=B*(.18+rd()*.64),amp=(rd()-.5)*brush*.05;t.strokeStyle=shade(hex,-(.035+rd()*.035));t.globalAlpha=.09+rd()*.05;t.lineWidth=Math.max(1,brush*(.028+rd()*.022));t.lineCap='round';t.beginPath();t.moveTo(L*.05,y);t.bezierCurveTo(L*.32,y+amp,L*.70,y-amp*.5,L*.96,y);t.stroke()}

function pf(p){return clamp(.91+(p?.pressure??.5)*.18,.92,1.09)}function smooth(raw){if(!stroke.filtered){stroke.filtered={...raw};return{...raw}}const dx=raw.x-stroke.filtered.x,dy=raw.y-stroke.filtered.y,speed=Math.hypot(dx,dy),follow=clamp(.82+speed/300,.82,.96);stroke.filtered.x+=dx*follow;stroke.filtered.y+=dy*follow;stroke.filtered.pressure=raw.pressure;stroke.filtered.time=raw.time;return{...stroke.filtered}}
function stamp(p,angle,a=1){const f=pf(p),tip=stroke.tip;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(angle);ctx.scale(f,f);ctx.globalCompositeOperation='source-over';ctx.globalAlpha=(+opacity.value/100)*.34*a;ctx.drawImage(tip,-tip.width/2,-tip.height/2);ctx.restore()}
function paintTo(a,b){const dx=b.x-a.x,dy=b.y-a.y,len=Math.hypot(dx,dy);if(len<.08)return;const ang=Math.atan2(dy,dx),brush=+size.value,dt=Math.max(1,(b.time||0)-(a.time||0)),velocity=len/dt,baseSpacing=brush*clamp(.24+velocity*.10,.24,.34),originalN=Math.max(1,Math.ceil(len/baseSpacing)),joinSpacing=baseSpacing*.42,n=Math.max(originalN,Math.ceil(len/joinSpacing));const baseGlobal=(+opacity.value/100)*.34,baseSolid=baseGlobal*.88,ratio=originalN/n,targetSolid=1-Math.pow(Math.max(0,1-baseSolid),ratio),joinA=baseGlobal>0?(targetSolid/.88)/baseGlobal:1;stroke.angle=ang;for(let i=1;i<=n;i++){const q=i/n;stamp({x:a.x+dx*q,y:a.y+dy*q,pressure:a.pressure+(b.pressure-a.pressure)*q},ang,joinA)}}

function draw(raw){const p=smooth(raw);if(!stroke.last){stroke.last={...p};tool==='erase'?eraseDot(p):stamp(p,0,1.08);return}const q=stroke.last;if(Math.hypot(p.x-q.x,p.y-q.y)<.1)return;tool==='erase'?erase(q,p):paintTo(q,p);stroke.last={...p}}function begin(p){save();mode='draw';const seed=((performance.now()*1000)|0)^(Math.random()*0xffffffff);stroke={last:null,filtered:null,angle:0,tip:makeTip(+size.value,color.value,seed)};draw(p)}
function setTool(t){tool=t;mode=null;stroke=null;[$('paintBtn'),$('moveBtn'),$('eraseBtn')].forEach(b=>b.classList.remove('active'));$(t==='paint'?'paintBtn':t==='move'?'moveBtn':'eraseBtn').classList.add('active');paint.style.cursor=t==='move'?'grab':'crosshair';status.textContent=t==='move'?'Move mode — drag to pan; pinch or +/- to zoom.':t==='erase'?'Erase mode.':'Acrylic v3 active — translucent pigment and subtle density variation.'}
paint.addEventListener('pointerdown',e=>{e.preventDefault();try{paint.setPointerCapture(e.pointerId)}catch(_){}active.set(e.pointerId,{x:e.clientX,y:e.clientY});if(active.size>=2){if(mode==='draw'&&history.length){const s=history.pop();ctx.clearRect(0,0,W,H);ctx.drawImage(s,0,0)}const p=[...active.values()].slice(0,2);mode='gesture';stroke=null;gesture={d:dist(p),m:mid(p),s:scale,x:tx,y:ty};return}if(tool==='move'){mode='pan';pan={x:e.clientX,y:e.clientY,tx,ty};return}begin(pos(e))});

$('paintBtn').onclick=()=>setTool('paint');$('moveBtn').onclick=()=>setTool('move');$('eraseBtn').onclick=()=>setTool('erase');$('zoomIn').onclick=()=>zoom(scale*1.35);$('zoomOut').onclick=()=>zoom(scale/1.35);$('clear').onclick=()=>{save();ctx.clearRect(0,0,W,H)};$('undo').onclick=()=>{if(!history.length)return;const s=history.pop();ctx.clearRect(0,0,W,H);ctx.drawImage(s,0,0)};size.oninput=()=>$('sizeVal').textContent=size.value;opacity.oninput=()=>$('opacityVal').textContent=opacity.value+'%';$('guideOpacity').oninput=e=>{guide.style.opacity=e.target.value/100;$('guideVal').textContent=e.target.value+'%'};
async function init(){const res=await fetch('./index.html',{cache:'no-store'});if(!res.ok)throw new Error('Could not load index.html');const text=await res.text(),doc=new DOMParser().parseFromString(text,'text/html'),src=doc.querySelector('#guide')?.getAttribute('src');if(!src)throw new Error('Guide image not found');const im=new Image();await new Promise((ok,bad)=>{im.onload=ok;im.onerror=bad;im.src=src});W=im.naturalWidth||1000;H=im.naturalHeight||1417;guide.width=paint.width=W;guide.height=paint.height=H;gctx.drawImage(im,0,0,W,H);guide.style.opacity=.72;fit();setTool('paint');status.textContent='Acrylic v3 ready — one pass should stay slightly translucent; a second pass should build pigment naturally.'}addEventListener('resize',fit);init().catch(e=>{status.textContent='Could not load city artwork.';console.error(e)});
})();</script></body></html>
