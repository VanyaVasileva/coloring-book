<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Gouache Brush v7</title>
<style>
:root{--bg:#f5f2eb;--ink:#292721;--line:#d4cdc1}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overscroll-behavior:none}body{display:grid;grid-template-rows:auto 1fr}header{background:#fff;border-bottom:1px solid var(--line);padding:9px 12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}h1{font:500 17px Georgia,serif;margin:0 8px 0 0}.ctrl{display:flex;align-items:center;gap:6px;font-size:12px}.ctrl input[type=range]{width:108px}input[type=color]{width:40px;height:34px;padding:2px;border:1px solid var(--line);border-radius:8px;background:#fff}button{border:1px solid #cfc7bb;background:#fff;border-radius:9px;padding:9px 10px;color:var(--ink);font-size:12px;font-weight:700}.stage{min-height:0;padding:8px}.wrap{height:100%;background:#fff;box-shadow:0 4px 20px #0001;overflow:hidden;touch-action:none;position:relative}.layer{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}.paint{z-index:1;background:#fff}.live{z-index:2;background:transparent;cursor:crosshair}@media(max-width:760px){header{gap:7px}.ctrl input[type=range]{width:82px}.stage{padding:6px}}
</style>
</head>
<body>
<header>
<h1>Gouache Brush v7</h1>
<div class="ctrl"><span>Color</span><input id="color" type="color" value="#987459"></div>
<div class="ctrl"><span>Size</span><input id="size" type="range" min="8" max="150" value="60"><strong id="sizeVal">60</strong></div>
<div class="ctrl"><span>Paint</span><input id="opacity" type="range" min="45" max="100" value="100"><strong id="opacityVal">100%</strong></div>
<div class="ctrl"><span>Texture</span><input id="texture" type="range" min="0" max="100" value="58"><strong id="textureVal">58%</strong></div>
<button id="undo">Undo</button><button id="clear">Clear</button>
</header>
<div class="stage"><div class="wrap" id="wrap"><canvas id="paint" class="layer paint"></canvas><canvas id="live" class="layer live"></canvas></div></div>
<script>(()=>{'use strict';
const $=id=>document.getElementById(id),paint=$('paint'),live=$('live'),wrap=$('wrap'),size=$('size'),opacity=$('opacity'),texture=$('texture'),color=$('color');
const ctx=paint.getContext('2d',{alpha:false,desynchronized:true}),lctx=live.getContext('2d',{alpha:true,desynchronized:true});
let dpr=1,drawing=false,stroke=null,history=[];const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function clearCanvas(c,x){x.save();x.setTransform(1,0,0,1,0,0);x.clearRect(0,0,c.width,c.height);x.restore()}
function setup(c,transparent){const r=wrap.getBoundingClientRect();c.width=Math.max(1,Math.floor(r.width*dpr));c.height=Math.max(1,Math.floor(r.height*dpr));const x=c.getContext('2d');x.setTransform(dpr,0,0,dpr,0,0);if(!transparent){x.fillStyle='#fff';x.fillRect(0,0,r.width,r.height)}}
function resize(){const old=document.createElement('canvas');old.width=paint.width;old.height=paint.height;if(old.width&&old.height)old.getContext('2d').drawImage(paint,0,0);dpr=Math.max(1,Math.min(2,devicePixelRatio||1));setup(paint,false);setup(live,true);if(old.width&&old.height){ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.drawImage(old,0,0,old.width,old.height,0,0,paint.width,paint.height);ctx.restore()}}
function point(e){const r=live.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top,pressure:e.pressure>0?e.pressure:.5}}
function snapshot(){const c=document.createElement('canvas');c.width=paint.width;c.height=paint.height;c.getContext('2d').drawImage(paint,0,0);return c}function save(){history.push(snapshot());if(history.length>10)history.shift()}
function hash(n,seed){const x=Math.sin(n*91.173+seed*.000071)*43758.5453123;return x-Math.floor(x)}
function noise(x,seed){const i=Math.floor(x),f=x-i,u=f*f*(3-2*f);return hash(i,seed)*(1-u)+hash(i+1,seed)*u}
function rgb(hex){return[parseInt(hex.slice(1,3),16),parseInt(hex.slice(3,5),16),parseInt(hex.slice(5,7),16)]}
function shade(hex,p){const [r,g,b]=rgb(hex);return p<0?`rgb(${Math.round(r*(1+p))},${Math.round(g*(1+p))},${Math.round(b*(1+p))})`:`rgb(${Math.round(r+(255-r)*p)},${Math.round(g+(255-g)*p)},${Math.round(b+(255-b)*p)})`}
function add(raw){if(!stroke.filtered){stroke.filtered={...raw};stroke.points.push({...raw,s:0});return}const dx=raw.x-stroke.filtered.x,dy=raw.y-stroke.filtered.y,d=Math.hypot(dx,dy),follow=clamp(.72+d/180,.72,.91);stroke.filtered.x+=dx*follow;stroke.filtered.y+=dy*follow;stroke.filtered.pressure=stroke.filtered.pressure*.78+raw.pressure*.22;const p={...stroke.filtered};const q=stroke.points[stroke.points.length-1],dist=Math.hypot(p.x-q.x,p.y-q.y);if(dist<1.2)return;stroke.points.push({...p,s:q.s+dist});if(stroke.points.length>1200)stroke.points=stroke.points.filter((_,i)=>i===0||i%2===0)}
function geometry(){const pts=stroke.points,brush=+size.value,g=[];for(let i=0;i<pts.length;i++){const p=pts[i],a=pts[Math.max(0,i-1)],b=pts[Math.min(pts.length-1,i+1)],dx=b.x-a.x,dy=b.y-a.y,L=Math.hypot(dx,dy)||1,tx=dx/L,ty=dy/L,nx=-ty,ny=tx;const slow=(noise(p.s/(brush*1.35)+2.7,stroke.seed)-.5)*brush*.075;const fine=(noise(p.s/(brush*.34)+9.4,stroke.seed^0x51f2)-.5)*brush*.012;const press=.965+clamp(p.pressure,0,1)*.07;const half=brush*.50*press+slow;const leftNoise=fine+(noise(p.s/(brush*.22)+18.2,stroke.seed^0x9e37)-.5)*brush*.008;const rightNoise=-fine+(noise(p.s/(brush*.25)+31.8,stroke.seed^0xa4c1)-.5)*brush*.008;g.push({...p,tx,ty,nx,ny,half,left:{x:p.x+nx*(half+leftNoise),y:p.y+ny*(half+leftNoise)},right:{x:p.x-nx*(half+rightNoise),y:p.y-ny*(half+rightNoise)}})}return g}
function appendSmooth(c,pts){if(pts.length<2)return;for(let i=1;i<pts.length-1;i++){const mx=(pts[i].x+pts[i+1].x)/2,my=(pts[i].y+pts[i+1].y)/2;c.quadraticCurveTo(pts[i].x,pts[i].y,mx,my)}c.lineTo(pts[pts.length-1].x,pts[pts.length-1].y)}
function cap(g,isEnd){const p=isEnd?g[g.length-1]:g[0],dir=isEnd?1:-1,arr=[],steps=10,brush=+size.value;for(let i=0;i<=steps;i++){const u=1-2*i/steps,edge=Math.abs(u),r=hash(i+(isEnd?37:83),stroke.seed)-.5,r2=hash(i+(isEnd?137:183),stroke.seed)-.5;let along=dir*brush*(r*.035+edge*r2*.020);if(isEnd)along+=dir*brush*(hash(i+211,stroke.seed)-.35)*.018;const cross=u*p.half;arr.push({x:p.x+p.tx*along+p.nx*cross,y:p.y+p.ty*along+p.ny*cross})}return arr}
function buildPath(c,g){const left=g.map(p=>p.left),right=g.map(p=>p.right),endCap=cap(g,true),startCap=cap(g,false);c.beginPath();c.moveTo(left[0].x,left[0].y);appendSmooth(c,left);for(let i=1;i<endCap.length;i++)c.lineTo(endCap[i].x,endCap[i].y);const rev=right.slice().reverse();appendSmooth(c,rev);for(let i=1;i<startCap.length;i++)c.lineTo(startCap[i].x,startCap[i].y);c.closePath()}
function lane(g,factor,wobble){const brush=+size.value;return g.map(p=>{const w=(noise(p.s/(brush*.85)+factor*11.7,stroke.seed^0x7d93)-.5)*brush*wobble,off=p.half*factor+w;return{x:p.x+p.nx*off,y:p.y+p.ny*off,s:p.s}})}
function drawSmoothLine(c,pts){if(pts.length<2)return;c.beginPath();c.moveTo(pts[0].x,pts[0].y);appendSmooth(c,pts);c.stroke()}
function render(){clearCanvas(live,lctx);if(!stroke||stroke.points.length<2)return;const g=geometry(),strength=+texture.value/100,brush=+size.value,base=color.value;buildPath(lctx,g);lctx.fillStyle=base;lctx.globalAlpha=1;lctx.globalCompositeOperation='source-over';lctx.fill();
 // Clip all texture to the one continuous paint body.
 lctx.save();buildPath(lctx,g);lctx.clip();
 // Broad, almost invisible pigment drag.
 const broad=[[-.26,-.040,.026],[.02,.045,.022],[.27,-.035,.024]];for(const [f,t,a] of broad){lctx.strokeStyle=shade(base,t);lctx.globalAlpha=a*strength;lctx.lineWidth=Math.max(2,brush*.17);lctx.lineCap='round';lctx.lineJoin='round';drawSmoothLine(lctx,lane(g,f,.008))}
 // Only a few fine bristle traces, continuous and very faint.
 const fine=[-.38,-.19,.16,.37];for(let i=0;i<fine.length;i++){lctx.strokeStyle=shade(base,i%2?.07:-.06);lctx.globalAlpha=(.025+i*.004)*strength;lctx.lineWidth=Math.max(.55,brush*.007);lctx.lineCap='round';drawSmoothLine(lctx,lane(g,fine[i],.010))}
 lctx.restore();
 // Sparse dry brush channels only near outer edges and mostly toward the ending.
 if(strength>0){const total=g[g.length-1].s||1,start=total-brush*2.2;lctx.save();lctx.globalCompositeOperation='destination-out';for(let k=0;k<4;k++){const f=[-.41,-.31,.31,.41][k],pts=lane(g,f,.008).filter(p=>p.s>start+(k%2)*brush*.28);if(pts.length<2)continue;lctx.globalAlpha=(.045+k*.012)*strength;lctx.lineWidth=Math.max(.5,brush*(.005+k*.0008));lctx.lineCap='round';drawSmoothLine(lctx,pts)}lctx.restore()}
 // Tiny ragged bristles at the finishing cap; short enough not to become spikes.
 const e=g[g.length-1];lctx.save();lctx.globalCompositeOperation='source-over';lctx.strokeStyle=base;lctx.lineCap='round';for(let i=0;i<7;i++){const u=-.43+i*(.86/6),r=hash(i+401,stroke.seed),off=e.half*u,len=brush*(.018+r*.055),sx=e.x+e.nx*off,sy=e.y+e.ny*off;lctx.globalAlpha=.45+.35*r;lctx.lineWidth=Math.max(.5,brush*(.0045+hash(i+451,stroke.seed)*.006));lctx.beginPath();lctx.moveTo(sx,sy);lctx.lineTo(sx+e.tx*len,sy+e.ty*len);lctx.stroke()}lctx.restore();live.style.opacity=opacity.value/100}
function begin(p){save();stroke={points:[],filtered:null,seed:((performance.now()*1000)|0)^(Math.random()*0xffffffff)};add(p);clearCanvas(live,lctx)}
function commit(){if(!stroke||stroke.points.length<2){clearCanvas(live,lctx);return}render();ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=+opacity.value/100;ctx.drawImage(live,0,0);ctx.restore();clearCanvas(live,lctx)}
live.addEventListener('pointerdown',e=>{e.preventDefault();try{live.setPointerCapture(e.pointerId)}catch(_){}drawing=true;begin(point(e))});
live.addEventListener('pointermove',e=>{if(!drawing)return;e.preventDefault();const ce=typeof e.getCoalescedEvents==='function'?e.getCoalescedEvents():null,arr=ce&&ce.length?ce:[e];for(const ev of arr)add(point(ev));render()});
function end(e){if(!drawing)return;drawing=false;add(point(e));commit();stroke=null;try{live.releasePointerCapture(e.pointerId)}catch(_){}}live.addEventListener('pointerup',end);live.addEventListener('pointercancel',end);live.addEventListener('contextmenu',e=>e.preventDefault());
$('undo').onclick=()=>{clearCanvas(live,lctx);if(!history.length)return;const s=history.pop();ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;ctx.fillStyle='#fff';ctx.fillRect(0,0,paint.width,paint.height);ctx.drawImage(s,0,0);ctx.restore()};$('clear').onclick=()=>{save();clearCanvas(live,lctx);ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;ctx.fillStyle='#fff';ctx.fillRect(0,0,paint.width,paint.height);ctx.restore()};size.oninput=()=>{$('sizeVal').textContent=size.value;if(drawing)render()};opacity.oninput=()=>{$('opacityVal').textContent=opacity.value+'%';live.style.opacity=opacity.value/100};texture.oninput=()=>{$('textureVal').textContent=texture.value+'%';if(drawing)render()};addEventListener('resize',resize);resize();
})();</script>
</body>
</html>
